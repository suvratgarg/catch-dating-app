name: widgetbook_workspace
description: Catch design-system Widgetbook for primitive and screen state review.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  catch_dating_app:
    path: ../
  firebase_auth: ^6.5.7
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  image_picker: ^1.2.3
  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  catch_ui_lints:
    path: ../packages/catch_ui_lints
  widgetbook_generator: ^3.24.0

dependency_overrides:
  phosphor_flutter:
    path: ../packages/phosphor_flutter

flutter:
  uses-material-design: true

  assets:
    - assets/branding/catch_icon.png
