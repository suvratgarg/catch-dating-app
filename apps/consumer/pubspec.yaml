name: catch_consumer_app
description: Installable Catch consumer product with consumer-only native SDKs.
publish_to: none
version: 1.0.2+3
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  catch_dating_app:
    path: ../..
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  health: ^13.3.2
  razorpay_flutter: ^1.4.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: false
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/branding/catch_icon.png
    - assets/branding/catch_icon_round.png
    - assets/branding/catch_icon_square.png
    - assets/branding/catch_splash_mark_dark.png
    - assets/branding/catch_splash_mark_light.png
    - assets/branding/catch_hosts_icon.png
    - assets/branding/catch_hosts_logo.png
    - assets/audio/event_success/
    - assets/audio/celebration/
    - assets/fonts/OFL-Archivo.txt
    - assets/fonts/OFL-IBMPlexMono.txt
    - tool/demo/demo_seed/scenarios/host-demo.json
    - tool/demo/demo_seed/personas/us_nyc_sales_profile_projection.planned.json
  # Keep app font aliases while sharing the package's single asset copy.
  fonts:
    - family: Archivo
      fonts:
        - asset: packages/catch_dating_app/assets/fonts/Archivo-Roman-VF.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: packages/catch_dating_app/assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: packages/catch_dating_app/assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: packages/catch_dating_app/assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: packages/catch_dating_app/assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
