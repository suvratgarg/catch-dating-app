name: Host account-deletion indexes
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: backend-delivery
  cancel-in-progress: false
jobs:
  dev:
    name: Add two deletion query indexes in dev
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    environment: dev
    concurrency:
      group: firebase-dev
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Require current-main CI and exact additive field definitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tool/firebase/host_deletion_indexes.mjs authorize dev
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Add only missing indexes and verify retained metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tool/firebase/host_deletion_indexes.mjs apply dev
      - name: Retain before and after evidence even on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: host-deletion-indexes-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/host-deletion-indexes/*.json
          if-no-files-found: warn
          retention-days: 30
  prod:
    name: Add two deletion query indexes in prod
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    environment: prod
    concurrency:
      group: firebase-prod
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Require recorded human PROD environment approval for operator release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment="$(gh api "repos/$GITHUB_REPOSITORY/environments/prod")"
          history="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals")"
          jq -en --argjson environment "$environment" --argjson history "$history" '
            ([ $environment.protection_rules[]? | select(.type == "required_reviewers") |
              .reviewers[]? | select(.type == "User") | .reviewer.id ]) as $reviewers |
            ($reviewers | length) > 0 and
            ([ $history[]? | select(any(.environments[]?; .id == $environment.id and .name == "prod")) ]
              | length) > 0 and
            ([ $history[]? | select(any(.environments[]?; .id == $environment.id and .name == "prod")) |
              select(.state != "approved") ] | length) == 0 and
            any($history[]?;
              .state == "approved" and .user.id != null and
              (.user.id as $reviewer_id | ($reviewers | index($reviewer_id)) != null) and
              any(.environments[]?; .id == $environment.id and .name == "prod"))
          ' > /dev/null

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Read this run's completed DEV proof
        uses: actions/download-artifact@v7
        with:
          name: host-deletion-indexes-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/host-deletion-indexes/dev
      - name: Require current-main CI and exact additive field definitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tool/firebase/host_deletion_indexes.mjs authorize prod
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Add only missing indexes and verify retained metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tool/firebase/host_deletion_indexes.mjs apply prod
      - name: Retain before and after evidence even on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: host-deletion-indexes-prod-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/host-deletion-indexes/*.json
          if-no-files-found: warn
          retention-days: 30
