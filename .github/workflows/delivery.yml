name: Delivery
# catch.backend-delivery-lanes/v1
run-name: Delivery lane v1 ${{ inputs.environment || github.event.client_payload.environment || (github.event_name == 'workflow_run' && 'dev' || 'prod') }}

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  repository_dispatch:
    types: [backend-delivery-drain]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose oldest pending source is being recovered.
        required: true
        default: prod
        type: choice
        options: [dev, prod]
      source_ci_run_id:
        description: Oldest pending successful main CI run id to resume.
        required: true
        type: string
      source_sha:
        description: Exact source SHA of that oldest pending CI run.
        required: true
        type: string
      resume_delivery_run_id:
        description: Terminal non-success Delivery run id whose exact authorization/checkpoints should be resumed.
        required: true
        type: string
      resume_delivery_attempt:
        description: Terminal non-success Delivery attempt containing the authorization/checkpoints.
        required: true
        default: "1"
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read
  id-token: write

# Each lane owns selection, mutation and completion publication. GitHub wakeup
# order is advisory; immutable source authorities establish release order.
# Production preserves the legacy/rebaseline drain lock during cutover.
env:
  DELIVERY_ENVIRONMENT: ${{ inputs.environment || github.event.client_payload.environment || (github.event_name == 'workflow_run' && 'dev' || 'prod') }}
concurrency:
  group: ${{ (inputs.environment || github.event.client_payload.environment || (github.event_name == 'workflow_run' && 'dev' || 'prod')) == 'dev' && 'backend-delivery-dev' || 'backend-delivery' }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Select and authorize the next CI artifact
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'repository_dispatch' &&
       github.event.action == 'backend-delivery-drain') ||
      github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      environment: ${{ env.DELIVERY_ENVIRONMENT }}
      lane_waiting: ${{ steps.lane.outputs.waiting }}
      lane_refresh_required: ${{ steps.lane.outputs.refresh_required }}
      waiting_for_dev: ${{ steps.source.outputs.waiting_for_dev }}
      dev_completion_artifact_id: ${{ steps.source.outputs.dev_completion_artifact_id }}
      dev_completion_artifact_digest: ${{ steps.source.outputs.dev_completion_artifact_digest }}
      bootstrap: ${{ steps.lane.outputs.has_cursor != 'true' }}
      work_required: ${{ steps.source.outputs.work_required }}
      source_ci_workflow_id: ${{ steps.source.outputs.source_ci_workflow_id }}
      source_ci_run_number: ${{ steps.source.outputs.source_ci_run_number }}
      source_ci_run_id: ${{ steps.source.outputs.source_ci_run_id }}
      source_ci_run_attempt: ${{ steps.source.outputs.source_ci_run_attempt }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      deploy_required: ${{ steps.plan.outputs.deploy_required }}
      production_environment: ${{ steps.package.outputs.production_environment }}
    steps:
      - name: Validate the isolated lane before queue selection
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          [[ "$DELIVERY_ENVIRONMENT" =~ ^(dev|prod)$ ]]

      - name: Checkout the immutable Delivery control plane
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0

      - id: queue-toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.queue-toolchain.outputs.node-version }}

      - id: cursor
        name: Restore the latest verified delivery cursor
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          mkdir -p build/delivery/cursor
          current_ci_workflow="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml")"
          current_ci_workflow_id="$(jq -er '
            select(
              (.id | type == "number" and . > 0 and floor == .) and
              (.path | split("@")[0]) == ".github/workflows/ci.yml"
            ) |
            .id
          ' <<< "$current_ci_workflow")"
          [[ "$current_ci_workflow_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          echo "source_ci_workflow_id=$current_ci_workflow_id" >> "$GITHUB_OUTPUT"
          artifact_pages="$(gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100")"
          printf '%s\n' "$artifact_pages" > build/delivery/unexpired-artifacts.json
          cursor_artifact_count="$(jq -r '[.[].artifacts[] |
            select(
              .expired == false and
              (.name == "backend-delivery-cursor" or
               (.name | startswith("backend-delivery-cursor-")))
            )
          ] | length' <<< "$artifact_pages")"
          # queue-selector: cursor-candidates-begin
          cursor_candidates="$(jq -c \
            --argjson repository_id "$REPOSITORY_ID" \
            --argjson workflow_id "$current_ci_workflow_id" '
            [.[].artifacts[] |
              select(
                .expired == false and
                .workflow_run.id != null and
                .workflow_run.repository_id == $repository_id and
                .workflow_run.head_repository_id == $repository_id and
                (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
              ) |
              . as $artifact |
              ($artifact.name |
                try capture(
                  "^backend-delivery-cursor-v4-(?<workflowId>[1-9][0-9]*)-(?<runNumber>[1-9][0-9]*)-(?<sourceRunId>[1-9][0-9]*)-(?<sourceAttempt>[1-9][0-9]*)-(?<sourceSha>[0-9a-f]{40})-(?<deliveryRunId>[1-9][0-9]*)-(?<deliveryAttempt>[1-9][0-9]*)$"
                ) catch null
              ) as $binding |
              select($binding != null) |
              {
                artifactId: $artifact.id,
                artifactName: $artifact.name,
                artifactDigest: $artifact.digest,
                artifactDeliveryRunId: ($artifact.workflow_run.id | tostring),
                sourceCiWorkflowId: ($binding.workflowId | tonumber),
                sourceCiRunNumber: ($binding.runNumber | tonumber),
                sourceCiRunId: $binding.sourceRunId,
                sourceCiRunAttempt: $binding.sourceAttempt,
                sourceSha: $binding.sourceSha,
                deliveryRunId: $binding.deliveryRunId,
                deliveryRunAttempt: $binding.deliveryAttempt
              } |
              select(
                .sourceCiWorkflowId == $workflow_id and
                .artifactDeliveryRunId == .deliveryRunId
              )
            ]
          ' <<< "$artifact_pages")"
          # queue-selector: cursor-candidates-end
          cursor_ambiguity_count="$(jq -r '
            group_by(.sourceCiRunNumber) |
            map(select(([.[] | [.sourceCiRunId, .sourceSha]] | unique | length) > 1)) |
            length
          ' <<< "$cursor_candidates")"
          if (( cursor_ambiguity_count > 0 )); then
            echo "Multiple source CI run ids claim the same workflow-scoped run number in cursor authority; refusing ambiguous ordering."
            exit 64
          fi
          # queue-selector: cursor-winner-begin
          cursor_candidate="$(jq -c '
            sort_by([
              .sourceCiRunNumber,
              (.sourceCiRunAttempt | tonumber),
              (.deliveryRunId | tonumber),
              (.deliveryRunAttempt | tonumber)
            ]) |
            if length == 0 then null else last end
          ' <<< "$cursor_candidates")"
          # queue-selector: cursor-winner-end

          if [[ "$cursor_candidate" == "null" ]]; then
            if (( cursor_artifact_count > 0 )); then
              echo "Delivery cursor artifacts exist for a different or legacy CI workflow generation. Review the release baseline and explicitly remove or migrate those artifacts before delivery can continue."
              exit 64
            fi
            echo "has_cursor=false" >> "$GITHUB_OUTPUT"
            echo "No verified delivery cursor exists; bootstrap rules apply."
            exit 0
          fi

          cursor_artifact_id="$(jq -er '.artifactId | tostring' <<< "$cursor_candidate")"
          cursor_artifact_name="$(jq -er '.artifactName' <<< "$cursor_candidate")"
          cursor_artifact_digest="$(jq -er '.artifactDigest' <<< "$cursor_candidate")"
          cursor_delivery_run_id="$(jq -er '.deliveryRunId' <<< "$cursor_candidate")"
          cursor_delivery_run_attempt="$(jq -er '.deliveryRunAttempt' <<< "$cursor_candidate")"
          cursor_run_id="$(jq -er '.sourceCiRunId' <<< "$cursor_candidate")"
          cursor_run_attempt="$(jq -er '.sourceCiRunAttempt' <<< "$cursor_candidate")"
          cursor_run_number="$(jq -er '.sourceCiRunNumber' <<< "$cursor_candidate")"
          cursor_dir=build/delivery/cursor/selected
          mkdir -p "$cursor_dir"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$cursor_artifact_id/zip" \
            > "$cursor_dir/cursor.zip"
          test "sha256:$(sha256sum "$cursor_dir/cursor.zip" | awk '{print $1}')" = "$cursor_artifact_digest"
          unzip -Z1 "$cursor_dir/cursor.zip" | \
            awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
          unzip -q "$cursor_dir/cursor.zip" -d "$cursor_dir/content"
          test "$(find "$cursor_dir/content" -type l | wc -l | tr -d ' ')" = "0"
          cursor_file="$cursor_dir/content/backend-delivery-cursor.json"
          test -f "$cursor_file"
          test "$(find "$cursor_dir/content" -type f | wc -l | tr -d ' ')" = "1"
          jq -e \
            --arg artifact_name "$cursor_artifact_name" \
            --arg delivery_run_attempt "$cursor_delivery_run_attempt" \
            --arg delivery_run_id "$cursor_delivery_run_id" \
            --arg source_run_attempt "$cursor_run_attempt" \
            --arg source_run_id "$cursor_run_id" \
            --arg source_sha "$(jq -er '.sourceSha' <<< "$cursor_candidate")" \
            --argjson source_run_number "$cursor_run_number" \
            --argjson source_workflow_id "$current_ci_workflow_id" '
              (keys | sort) == [
                "deliveryRunAttempt",
                "deliveryRunId",
                "schema",
                "sourceCiRunAttempt",
                "sourceCiRunId",
                "sourceCiRunNumber",
                "sourceCiWorkflowId",
                "sourceSha"
              ] and
              .schema == "catch.backend-delivery-cursor/v4" and
              .deliveryRunId == $delivery_run_id and
              .deliveryRunAttempt == $delivery_run_attempt and
              .sourceCiWorkflowId == $source_workflow_id and
              .sourceCiRunNumber == $source_run_number and
              .sourceCiRunId == $source_run_id and
              .sourceCiRunAttempt == $source_run_attempt and
              .sourceSha == $source_sha and
              $artifact_name == (
                "backend-delivery-cursor-v4-" +
                (.sourceCiWorkflowId | tostring) + "-" +
                (.sourceCiRunNumber | tostring) + "-" +
                .sourceCiRunId + "-" +
                .sourceCiRunAttempt + "-" +
                .sourceSha + "-" +
                .deliveryRunId + "-" +
                .deliveryRunAttempt
              )
            ' "$cursor_file" > /dev/null
          cursor_source_sha="$(jq -er '.sourceSha' "$cursor_file")"
          node tool/ci/backend_delivery_lanes.mjs verify-run \
            --repository "$GITHUB_REPOSITORY" --repository-id "$REPOSITORY_ID" \
            --run-id "$cursor_delivery_run_id" --run-attempt "$cursor_delivery_run_attempt" \
            --role cursor --output build/delivery/cursor/producer.json
          cursor_source_run="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$cursor_run_id/attempts/$cursor_run_attempt")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson run_attempt "$cursor_run_attempt" \
            --arg run_id "$cursor_run_id" \
            --arg source_sha "$cursor_source_sha" \
            --argjson run_number "$cursor_run_number" \
            --argjson workflow_id "$current_ci_workflow_id" '
              .name == "CI" and
              (.path | split("@")[0]) == ".github/workflows/ci.yml" and
              .workflow_id == $workflow_id and
              .event == "push" and
              .head_branch == "main" and
              .head_repository.full_name == $repository and
              (.id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              .run_number == $run_number and
              .head_sha == $source_sha and
              .status == "completed" and
              .conclusion == "success"
            ' <<< "$cursor_source_run" > /dev/null
          echo "has_cursor=true" >> "$GITHUB_OUTPUT"
          echo "source_ci_run_id=$cursor_run_id" >> "$GITHUB_OUTPUT"
          echo "source_ci_run_attempt=$cursor_run_attempt" >> "$GITHUB_OUTPUT"
          echo "source_ci_run_number=$cursor_run_number" >> "$GITHUB_OUTPUT"
          echo "source_ci_workflow_id=$current_ci_workflow_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$cursor_source_sha" >> "$GITHUB_OUTPUT"
          echo "cursor_artifact_id=$cursor_artifact_id" >> "$GITHUB_OUTPUT"

      - id: lane
        name: Resolve this environment's verified progress and legacy cutover
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CI_WORKFLOW_ID: ${{ steps.cursor.outputs.source_ci_workflow_id }}
        run: |
          set -euo pipefail
          current_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          test "$(jq -r '.run_attempt' <<< "$current_run")" = "$GITHUB_RUN_ATTEMPT"
          test "$(jq -r '.run_number' <<< "$current_run")" = "$GITHUB_RUN_NUMBER"
          jq -n \
            --arg environment "$DELIVERY_ENVIRONMENT" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson repositoryId "$GITHUB_REPOSITORY_ID" \
            --argjson sourceCiWorkflowId "$SOURCE_CI_WORKFLOW_ID" \
            --argjson deliveryWorkflowId "$(jq -er '.workflow_id' <<< "$current_run")" \
            --arg deliveryRunId "$GITHUB_RUN_ID" \
            --arg deliveryRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --argjson deliveryRunNumber "$GITHUB_RUN_NUMBER" \
            '{environment: $environment, repository: $repository, repositoryId: $repositoryId,
              sourceCiWorkflowId: $sourceCiWorkflowId, deliveryWorkflowId: $deliveryWorkflowId,
              deliveryRunId: $deliveryRunId, deliveryRunAttempt: $deliveryRunAttempt,
              deliveryRunNumber: $deliveryRunNumber}' > build/delivery/lane-context.json
          if [[ -f build/delivery/cursor/selected/content/backend-delivery-cursor.json ]]; then
            cp build/delivery/cursor/selected/content/backend-delivery-cursor.json build/delivery/production-cursor.json
          else
            printf 'null\n' > build/delivery/production-cursor.json
          fi
          node tool/ci/backend_delivery_lanes.mjs resolve \
            --context build/delivery/lane-context.json \
            --catalog build/delivery/unexpired-artifacts.json \
            --prod-cursor build/delivery/production-cursor.json \
            --output build/delivery/lane-progress.json \
            --github-output "$GITHUB_OUTPUT"
          if [[ "$(jq -r '.refreshRequired // false' build/delivery/lane-progress.json)" == "true" && "$(jq -r '.client_payload.wakeup_reason // ""' "$GITHUB_EVENT_PATH")" == "refresh" ]]; then
            echo "The production cursor changed again during the initial dev cutover. Review the concurrent worker before retrying." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$(jq -r '.waiting' build/delivery/lane-progress.json)" == "true" ]]; then
            echo "Manual recovery is blocked by an earlier legacy delivery or rebaseline. Retry this exact recovery after it completes." >&2
            exit 1
          fi

      - id: source
        name: Select the next successful main CI authority
        if: ${{ steps.lane.outputs.waiting != 'true' }}
        env:
          CURSOR_RUN_NUMBER: ${{ steps.lane.outputs.source_ci_run_number }}
          CURRENT_CI_WORKFLOW_ID: ${{ steps.lane.outputs.source_ci_workflow_id }}
          EVENT_NAME: ${{ github.event_name }}
          HAS_CURSOR: ${{ steps.lane.outputs.has_cursor }}
          INPUT_RUN_ID: ${{ inputs.source_ci_run_id }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          RESUME_DELIVERY_ATTEMPT: ${{ inputs.resume_delivery_attempt }}
          RESUME_DELIVERY_RUN_ID: ${{ inputs.resume_delivery_run_id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          selection_dir=build/delivery/selection
          mkdir -p "$selection_dir"
          artifact_pages_file=build/delivery/unexpired-artifacts.json
          [[ "$CURRENT_CI_WORKFLOW_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          test -f "$artifact_pages_file"

          cursor_threshold=0
          if [[ "$HAS_CURSOR" == "true" ]]; then
            [[ "$CURSOR_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]]
            cursor_threshold="$CURSOR_RUN_NUMBER"
          fi

          # queue-selector: source-candidates-begin
          source_candidates="$(jq -c \
            --argjson cursor_run "$cursor_threshold" \
            --argjson repository_id "$REPOSITORY_ID" \
            --argjson workflow_id "$CURRENT_CI_WORKFLOW_ID" '
              [.[].artifacts[] |
                select(
                  .expired == false and
                  .workflow_run.id != null and
                  .workflow_run.head_branch == "main" and
                  .workflow_run.repository_id == $repository_id and
                  .workflow_run.head_repository_id == $repository_id and
                  (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
                ) |
                . as $artifact |
                ($artifact.name |
                  try capture(
                    "^harness-success-v3-(?<workflowId>[1-9][0-9]*)-(?<runNumber>[1-9][0-9]*)-(?<runId>[1-9][0-9]*)-(?<sha>[0-9a-f]{40})-(?<attempt>[1-9][0-9]*)$"
                  ) catch null
                ) as $binding |
                select($binding != null) |
                {
                  artifactId: $artifact.id,
                  artifactName: $artifact.name,
                  artifactDigest: $artifact.digest,
                  artifactRunId: ($artifact.workflow_run.id | tostring),
                  artifactHeadSha: $artifact.workflow_run.head_sha,
                  sourceCiWorkflowId: ($binding.workflowId | tonumber),
                  sourceCiRunNumber: ($binding.runNumber | tonumber),
                  sourceCiRunId: $binding.runId,
                  sourceCiRunAttempt: $binding.attempt,
                  sourceSha: $binding.sha
                } |
                select(
                  .sourceCiWorkflowId == $workflow_id and
                  .sourceCiRunNumber > $cursor_run and
                  .artifactRunId == .sourceCiRunId and
                  .artifactHeadSha == .sourceSha
                )
              ]
            ' "$artifact_pages_file")"
          # queue-selector: source-candidates-end
          printf '%s\n' "$source_candidates" > "$selection_dir/source-candidates.json"
          source_ambiguity_count="$(jq -r '
            group_by(.sourceCiRunNumber) |
            map(select(([.[] | [.sourceCiRunId, .sourceSha]] | unique | length) > 1)) |
            length
          ' <<< "$source_candidates")"
          if (( source_ambiguity_count > 0 )); then
            echo "Multiple immutable CI authorities claim the same workflow-scoped run number; refusing ambiguous ordering."
            exit 64
          fi
          # queue-selector: source-winner-begin
          source_candidate="$(jq -c '
              group_by(.sourceCiRunNumber) |
              map(sort_by(.sourceCiRunAttempt | tonumber) | last) |
              if length == 0 then null else min_by(.sourceCiRunNumber) end
            ' <<< "$source_candidates")"
          # queue-selector: source-winner-end
          # queue-selector: bootstrap-source-winner-begin
          bootstrap_source_candidate="$(jq -c '
              group_by(.sourceCiRunNumber) |
              map(sort_by(.sourceCiRunAttempt | tonumber) | last) |
              if length == 0 then null else max_by(.sourceCiRunNumber) end
            ' <<< "$source_candidates")"
          # queue-selector: bootstrap-source-winner-end
          if [[ "$HAS_CURSOR" != "true" ]]; then
            source_candidate="$bootstrap_source_candidate"
          fi
          if [[ "$DELIVERY_ENVIRONMENT" == "prod" ]]; then
            node tool/ci/backend_delivery_lanes.mjs select-prod   \
            --context build/delivery/lane-context.json   \
            --catalog "$artifact_pages_file"   \
            --candidates "$selection_dir/source-candidates.json"   \
            --prod-cursor build/delivery/production-cursor.json   \
            --output "$selection_dir/production-selection.json"   \
            --github-output "$GITHUB_OUTPUT"
            if [[ "$(jq -r '.waiting' "$selection_dir/production-selection.json")" == "true" ]]; then
              if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
                echo "Protected production recovery requires exact completed dev proof first. Recover dev, then repeat this same production recovery."
                exit 64
              fi
              echo "waiting_for_dev=true" >> "$GITHUB_OUTPUT"
              echo "work_required=false" >> "$GITHUB_OUTPUT"
              echo "Production is waiting for the exact oldest source to finish dev."
              exit 0
            fi
            source_candidate="$(jq -c '.sourceCandidate' "$selection_dir/production-selection.json")"
            jq '.devCompletion' "$selection_dir/production-selection.json" > "$selection_dir/dev-completion.json"
          fi
          if [[ "$source_candidate" == "null" ]]; then
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "There is no pending successful immutable main CI attempt to resume."
              exit 64
            fi
            echo "work_required=false" >> "$GITHUB_OUTPUT"
            if [[ "$HAS_CURSOR" == "true" ]]; then
              echo "The delivery cursor already covers every eligible immutable main CI attempt."
            else
              echo "No successful main CI attempt with an exact Harness v2 plan is ready yet."
            fi
            exit 0
          fi
          if [[ "$HAS_CURSOR" != "true" ]]; then
            echo "Preparing to bootstrap from the current main head's latest successful immutable CI authority."
          fi

          printf '%s\n' "$source_candidate" > "$selection_dir/source-candidate.json"
          authority_artifact_id="$(jq -er '.artifactId | tostring' <<< "$source_candidate")"
          authority_artifact_name="$(jq -er '.artifactName' <<< "$source_candidate")"
          authority_artifact_digest="$(jq -er '.artifactDigest' <<< "$source_candidate")"
          source_ci_run_id="$(jq -er '.sourceCiRunId' <<< "$source_candidate")"
          source_ci_run_number="$(jq -er '.sourceCiRunNumber' <<< "$source_candidate")"
          source_ci_run_attempt="$(jq -er '.sourceCiRunAttempt' <<< "$source_candidate")"
          source_sha="$(jq -er '.sourceSha' <<< "$source_candidate")"
          [[ "$source_ci_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$source_ci_run_number" =~ ^[1-9][0-9]*$ ]]
          [[ "$source_ci_run_attempt" =~ ^[1-9][0-9]*$ ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]

          authority_dir="$selection_dir/authority"
          mkdir -p "$authority_dir"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$authority_artifact_id/zip" \
            > "$authority_dir/authority.zip"
          test "sha256:$(sha256sum "$authority_dir/authority.zip" | awk '{print $1}')" = "$authority_artifact_digest"
          unzip -Z1 "$authority_dir/authority.zip" | \
            awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
          unzip -q "$authority_dir/authority.zip" -d "$authority_dir/content"
          test "$(find "$authority_dir/content" -type l | wc -l | tr -d ' ')" = "0"
          authority_file="$authority_dir/content/ci-delivery-authority.json"
          test -f "$authority_file"
          test "$(find "$authority_dir/content" -type f | wc -l | tr -d ' ')" = "1"
          expected_plan_artifact="harness-plan-${source_ci_run_number}-${source_ci_run_id}-${source_sha}-${source_ci_run_attempt}"
          expected_package_artifact="firebase-delivery-${source_sha}-${source_ci_run_attempt}"
          jq -e \
            --arg artifact_name "$authority_artifact_name" \
            --arg expected_package "$expected_package_artifact" \
            --arg expected_plan "$expected_plan_artifact" \
            --arg source_attempt "$source_ci_run_attempt" \
            --arg source_run_id "$source_ci_run_id" \
            --arg source_sha "$source_sha" \
            --argjson source_run_number "$source_ci_run_number" \
            --argjson source_workflow_id "$CURRENT_CI_WORKFLOW_ID" '
              (keys | sort) == [
                "deployRequired",
                "packageArtifact",
                "planArtifact",
                "schema",
                "sourceCiRunAttempt",
                "sourceCiRunId",
                "sourceCiRunNumber",
                "sourceCiWorkflowId",
                "sourceSha"
              ] and
              .schema == "catch.ci-delivery-authority/v3" and
              .sourceCiWorkflowId == $source_workflow_id and
              .sourceCiRunNumber == $source_run_number and
              .sourceCiRunId == $source_run_id and
              .sourceCiRunAttempt == $source_attempt and
              .sourceSha == $source_sha and
              (.planArtifact | keys | sort) == ["digest", "id", "name"] and
              (.planArtifact.id | type == "number" and . > 0 and floor == .) and
              (.planArtifact.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
              .planArtifact.name == $expected_plan and
              ((.deployRequired == true and
                (.packageArtifact | keys | sort) == ["digest", "id", "name"] and
                (.packageArtifact.id | type == "number" and . > 0 and floor == .) and
                (.packageArtifact.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
                .packageArtifact.name == $expected_package) or
               (.deployRequired == false and .packageArtifact == null)) and
              $artifact_name == (
                "harness-success-v3-" +
                (.sourceCiWorkflowId | tostring) + "-" +
                (.sourceCiRunNumber | tostring) + "-" +
                .sourceCiRunId + "-" +
                .sourceSha + "-" +
                .sourceCiRunAttempt
              )
            ' "$authority_file" > /dev/null
          plan_artifact_id="$(jq -er '.planArtifact.id' "$authority_file")"
          plan_artifact_name="$(jq -er '.planArtifact.name' "$authority_file")"
          plan_artifact_digest="$(jq -er '.planArtifact.digest' "$authority_file")"
          package_artifact_id="$(jq -r '.packageArtifact.id // ""' "$authority_file")"
          package_artifact_name="$(jq -r '.packageArtifact.name // ""' "$authority_file")"
          package_artifact_digest="$(jq -r '.packageArtifact.digest // ""' "$authority_file")"

          if [[ "$HAS_CURSOR" != "true" && "$DELIVERY_ENVIRONMENT" == "dev" ]]; then
            current_main_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
            current_main_sha="$(jq -er '.object.sha' <<< "$current_main_ref")"
            [[ "$current_main_sha" =~ ^[0-9a-f]{40}$ ]]
            if [[ "$source_sha" != "$current_main_sha" ]]; then
              if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
                echo "No-cursor bootstrap requires the exact current main head to own a successful immutable CI authority."
                exit 64
              fi
              echo "Current main does not have a successful immutable CI authority yet; waiting for a later queue wakeup."
              echo "work_required=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$(jq -r '.deployRequired' "$authority_file")" != "true" ]]; then
              if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
                echo "No-cursor bootstrap requires a current-main backend package; a no-op CI authority cannot establish the backend baseline."
                exit 64
              fi
              echo "Current main has no backend package, so it cannot establish the delivery baseline."
              echo "work_required=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Bootstrapping the delivery cursor from the exact backend package for current main."
          fi

          historical_attempt="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$source_ci_run_id/attempts/$source_ci_run_attempt")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$source_ci_run_id" \
            --arg source_sha "$source_sha" \
            --argjson run_attempt "$source_ci_run_attempt" \
            --argjson run_number "$source_ci_run_number" \
            --argjson workflow_id "$CURRENT_CI_WORKFLOW_ID" '
              .name == "CI" and
              (.path | split("@")[0]) == ".github/workflows/ci.yml" and
              .workflow_id == $workflow_id and
              .event == "push" and
              .head_branch == "main" and
              .head_repository.full_name == $repository and
              (.id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              .run_number == $run_number and
              .head_sha == $source_sha and
              .status == "completed" and
              .conclusion == "success"
            ' <<< "$historical_attempt" > /dev/null

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$INPUT_RUN_ID" = "$source_ci_run_id"
            test "$INPUT_SOURCE_SHA" = "$source_sha"
            [[ "$RESUME_DELIVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$RESUME_DELIVERY_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            node tool/ci/backend_delivery_lanes.mjs verify-run \
              --repository "$GITHUB_REPOSITORY" --repository-id "$REPOSITORY_ID" \
              --run-id "$RESUME_DELIVERY_RUN_ID" --run-attempt "$RESUME_DELIVERY_ATTEMPT" \
              --role delivery --output build/delivery/selection/failed-producer.json
            jq -e '
              .status == "completed" and
              (.conclusion == "failure" or
               .conclusion == "cancelled" or
               .conclusion == "timed_out" or
               .conclusion == "stale" or
               .conclusion == "action_required" or
               .conclusion == "startup_failure")
            ' build/delivery/selection/failed-producer.json > /dev/null
            authorization_name="backend-delivery-authorization-${CURRENT_CI_WORKFLOW_ID}-${source_sha}-${source_ci_run_attempt}-${RESUME_DELIVERY_ATTEMPT}"
            failed_artifacts="$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_DELIVERY_RUN_ID/artifacts?per_page=100")"
            authorization_count="$(jq -r --arg name "$authorization_name" '
              [.[].artifacts[] | select(.expired == false and .name == $name)] | length
            ' <<< "$failed_artifacts")"
            if [[ "$authorization_count" != "1" ]]; then
              echo "The failed Delivery run does not contain exactly one source-bound recovery authorization; use a normal cursor-driven retry."
              exit 64
            fi
            authorization_record="$(jq -c --arg name "$authorization_name" '
              [.[].artifacts[] | select(.expired == false and .name == $name)][0]
            ' <<< "$failed_artifacts")"
            authorization_artifact_id="$(jq -er '.id' <<< "$authorization_record")"
            authorization_artifact_digest="$(jq -er '.digest' <<< "$authorization_record")"
            [[ "$authorization_artifact_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$authorization_artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            mkdir -p build/delivery/resume-authorization
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$authorization_artifact_id/zip" \
              > build/delivery/resume-authorization.zip
            test "sha256:$(sha256sum build/delivery/resume-authorization.zip | awk '{print $1}')" = "$authorization_artifact_digest"
            unzip -Z1 build/delivery/resume-authorization.zip | \
              awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
            unzip -q build/delivery/resume-authorization.zip \
              -d build/delivery/resume-authorization
            test "$(find build/delivery/resume-authorization -type l | wc -l | tr -d ' ')" = "0"
            authorization_file=build/delivery/resume-authorization/backend-delivery-authorization.json
            test -f "$authorization_file"
            test "$(find build/delivery/resume-authorization -type f | wc -l | tr -d ' ')" = "1"
            jq -e \
              --arg delivery_attempt "$RESUME_DELIVERY_ATTEMPT" \
              --arg delivery_run_id "$RESUME_DELIVERY_RUN_ID" \
              --arg source_attempt "$source_ci_run_attempt" \
              --arg source_run_id "$source_ci_run_id" \
              --arg source_sha "$source_sha" \
              --argjson source_run_number "$source_ci_run_number" \
              --argjson source_workflow_id "$CURRENT_CI_WORKFLOW_ID" '
                (keys | sort) == [
                  "baseSha",
                  "deliveryRunAttempt",
                  "deliveryRunId",
                  "packageSha256",
                  "provenanceSha256",
                  "schema",
                  "sourceCiRunAttempt",
                  "sourceCiRunId",
                  "sourceCiRunNumber",
                  "sourceCiWorkflowId",
                  "sourceSha"
                ] and
                .schema == "catch.backend-delivery-authorization/v2" and
                .deliveryRunId == $delivery_run_id and
                .deliveryRunAttempt == $delivery_attempt and
                .sourceCiRunId == $source_run_id and
                .sourceCiRunAttempt == $source_attempt and
                .sourceCiRunNumber == $source_run_number and
                .sourceCiWorkflowId == $source_workflow_id and
                .sourceSha == $source_sha and
                (.baseSha | type == "string" and test("^[0-9a-f]{40}$")) and
                (.packageSha256 | type == "string" and test("^[0-9a-f]{64}$")) and
                (.provenanceSha256 | type == "string" and test("^[0-9a-f]{64}$"))
              ' "$authorization_file" > /dev/null
            echo "resume_base_sha=$(jq -er '.baseSha' "$authorization_file")" >> "$GITHUB_OUTPUT"
            echo "resume_package_sha256=$(jq -er '.packageSha256' "$authorization_file")" >> "$GITHUB_OUTPUT"
            echo "resume_provenance_sha256=$(jq -er '.provenanceSha256' "$authorization_file")" >> "$GITHUB_OUTPUT"
            checkpoint_pages="$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_DELIVERY_RUN_ID/artifacts?per_page=100")"
            checkpoint_count="$(jq -r \
              --arg attempt "$RESUME_DELIVERY_ATTEMPT" \
              --arg source_sha "$source_sha" '
                [.[].artifacts[] |
                  select(
                    .expired == false and
                    (.name | startswith("firebase-checkpoint-")) and
                    (.name | endswith("-" + $source_sha + "-" + $attempt))
                  )
                ] | length
              ' <<< "$checkpoint_pages")"
            if [[ "$checkpoint_count" == "0" ]]; then
              echo "The failed Delivery stopped before publishing a checkpoint; the selected CI item will restart at its first stage."
            else
              mkdir -p build/delivery/resume-validation
              gh run download "$RESUME_DELIVERY_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "firebase-checkpoint-*-${source_sha}-${RESUME_DELIVERY_ATTEMPT}" \
                --dir build/delivery/resume-validation
              validated_count=0
              while IFS= read -r checkpoint_file; do
                jq -e \
                  --arg run_attempt "$source_ci_run_attempt" \
                  --arg run_id "$source_ci_run_id" \
                  --arg source_sha "$source_sha" '
                    .schema == "catch.delivery-checkpoints/v2" and
                    (.scope | type == "string" and startswith("firebase:")) and
                    .provenance.sourceSha == $source_sha and
                    .provenance.sourceCiRunId == $run_id and
                    .provenance.sourceCiRunAttempt == $run_attempt
                  ' "$checkpoint_file" > /dev/null
                validated_count=$((validated_count + 1))
              done < <(find build/delivery/resume-validation -type f -name checkpoint.json -print)
              test "$validated_count" = "$checkpoint_count"
            fi
          fi

          echo "work_required=true" >> "$GITHUB_OUTPUT"
          echo "source_ci_workflow_id=$CURRENT_CI_WORKFLOW_ID" >> "$GITHUB_OUTPUT"
          echo "source_ci_run_id=$source_ci_run_id" >> "$GITHUB_OUTPUT"
          echo "source_ci_run_number=$source_ci_run_number" >> "$GITHUB_OUTPUT"
          echo "source_ci_run_attempt=$source_ci_run_attempt" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "plan_artifact_id=$plan_artifact_id" >> "$GITHUB_OUTPUT"
          echo "plan_artifact_name=$plan_artifact_name" >> "$GITHUB_OUTPUT"
          echo "plan_artifact_digest=$plan_artifact_digest" >> "$GITHUB_OUTPUT"
          echo "package_artifact_id=$package_artifact_id" >> "$GITHUB_OUTPUT"
          echo "package_artifact_name=$package_artifact_name" >> "$GITHUB_OUTPUT"
          echo "package_artifact_digest=$package_artifact_digest" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact CI-approved source as verification input
        if: ${{ steps.source.outputs.work_required == 'true' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 0
          path: build/delivery/source-checkout

      - name: Require the control plane and selected source to remain exact
        if: ${{ steps.source.outputs.work_required == 'true' }}
        env:
          CONTROL_PLANE_SHA: ${{ github.workflow_sha }}
          SOURCE_CHECKOUT: build/delivery/source-checkout
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_SHA"
          test "$(git -C "$SOURCE_CHECKOUT" rev-parse HEAD)" = "$SOURCE_SHA"
          git -C "$SOURCE_CHECKOUT" fetch origin main:refs/remotes/origin/main --no-tags
          git -C "$SOURCE_CHECKOUT" merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main

      - name: Download the exact CI impact plan first
        if: ${{ steps.source.outputs.work_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_ARTIFACT_DIGEST: ${{ steps.source.outputs.plan_artifact_digest }}
          PLAN_ARTIFACT_ID: ${{ steps.source.outputs.plan_artifact_id }}
        run: |
          set -euo pipefail
          [[ "$PLAN_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PLAN_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p build/delivery/plan
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PLAN_ARTIFACT_ID/zip" \
            > build/delivery/plan.zip
          test "sha256:$(sha256sum build/delivery/plan.zip | awk '{print $1}')" = "$PLAN_ARTIFACT_DIGEST"
          unzip -Z1 build/delivery/plan.zip | \
            awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
          unzip -q build/delivery/plan.zip -d build/delivery/plan
          test "$(find build/delivery/plan -type l | wc -l | tr -d ' ')" = "0"
          test -f build/delivery/plan/impact-plan.json
          test "$(find build/delivery/plan -type f | wc -l | tr -d ' ')" = "1"

      - id: plan
        name: Verify the plan binding and resolve no-op delivery
        if: ${{ steps.source.outputs.work_required == 'true' }}
        env:
          CURSOR_SOURCE_SHA: ${{ steps.lane.outputs.source_sha }}
          EVENT_NAME: ${{ github.event_name }}
          HAS_CURSOR: ${{ steps.lane.outputs.has_cursor }}
          RESUME_BASE_SHA: ${{ steps.source.outputs.resume_base_sha }}
          SOURCE_CI_RUN_ATTEMPT: ${{ steps.source.outputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ steps.source.outputs.source_ci_run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          impact_plan=build/delivery/plan/impact-plan.json
          jq -e \
            --arg run_attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --arg run_id "$SOURCE_CI_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" '
              .complete == true and
              .mode == "main" and
              .sourceSha == $source_sha and
              .sourceCiRunId == $run_id and
              .sourceCiRunAttempt == $run_attempt and
              (.baseSha | type == "string" and test("^[0-9a-f]{40}$")) and
              (.operations.deployGroups | type == "array") and
              (.operations.deployGroups | length == (unique | length)) and
              all(.operations.deployGroups[];
                . == "functions" or
                . == "firestore-indexes" or
                . == "firestore-rules" or
                . == "storage-rules")
            ' "$impact_plan" > /dev/null
          base_sha="$(jq -er '.baseSha' "$impact_plan")"
          if [[ "$HAS_CURSOR" == "true" ]]; then
            [[ "$CURSOR_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            if [[ "$base_sha" != "$CURSOR_SOURCE_SHA" ]]; then
              echo "The oldest available CI authority does not continue from the delivery cursor. An immutable authority artifact is missing or expired; refusing to skip that release window."
              exit 64
            fi
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$RESUME_BASE_SHA" = "$base_sha"
          fi
          deploy_groups="$(jq -c '.operations.deployGroups' "$impact_plan")"
          deploy_required="$(jq -r '.operations.deployGroups | length > 0' "$impact_plan")"
          git cat-file -e "${base_sha}^{commit}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$deploy_required" != "true" ]]; then
            echo "The selected CI run has no backend delivery to resume."
            exit 64
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "deploy_groups=$deploy_groups" >> "$GITHUB_OUTPUT"
          echo "deploy_required=$deploy_required" >> "$GITHUB_OUTPUT"

      - name: Download only the backend artifact produced by the selected CI run
        if: ${{ steps.plan.outputs.deploy_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ARTIFACT_DIGEST: ${{ steps.source.outputs.package_artifact_digest }}
          PACKAGE_ARTIFACT_ID: ${{ steps.source.outputs.package_artifact_id }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PACKAGE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p build/delivery/source
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PACKAGE_ARTIFACT_ID/zip" \
            > build/delivery/source.zip
          test "sha256:$(sha256sum build/delivery/source.zip | awk '{print $1}')" = "$PACKAGE_ARTIFACT_DIGEST"
          unzip -Z1 build/delivery/source.zip | \
            awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
          unzip -q build/delivery/source.zip -d build/delivery/source
          test "$(find build/delivery/source -type l | wc -l | tr -d ' ')" = "0"

      - name: Verify SHA-256 and source-run provenance before extraction
        if: ${{ steps.plan.outputs.deploy_required == 'true' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESUME_PACKAGE_SHA256: ${{ steps.source.outputs.resume_package_sha256 }}
          RESUME_PROVENANCE_SHA256: ${{ steps.source.outputs.resume_provenance_sha256 }}
          SOURCE_CI_RUN_ATTEMPT: ${{ steps.source.outputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ steps.source.outputs.source_ci_run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          node tool/ci/delivery_core.mjs verify \
            --manifest build/delivery/source/firebase-provenance.json \
            --artifact build/delivery/source/firebase-backend.tar.gz \
            --source-sha "$SOURCE_SHA" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$(jq -er '.artifact.sha256' build/delivery/source/firebase-provenance.json)" = "$RESUME_PACKAGE_SHA256"
            test "$(sha256sum build/delivery/source/firebase-provenance.json | awk '{print $1}')" = "$RESUME_PROVENANCE_SHA256"
          fi

      - name: Verify production uses the exact completed dev package
        if: ${{ steps.plan.outputs.deploy_required == 'true' && env.DELIVERY_ENVIRONMENT == 'prod' }}
        run: |
          set -euo pipefail
          node tool/ci/backend_delivery_lanes.mjs verify-package \
            --context build/delivery/lane-context.json \
            --receipt build/delivery/selection/dev-completion.json \
            --source-sha "${{ steps.source.outputs.source_sha }}" \
            --ci-run-id "${{ steps.source.outputs.source_ci_run_id }}" \
            --ci-run-attempt "${{ steps.source.outputs.source_ci_run_attempt }}" \
            --base-sha "${{ steps.plan.outputs.base_sha }}" \
            --package build/delivery/source/firebase-backend.tar.gz \
            --provenance build/delivery/source/firebase-provenance.json \
            --output build/delivery/verified-dev-package.json

      - name: Install the pinned source-analysis parser
        if: ${{ steps.plan.outputs.deploy_required == 'true' }}
        run: npm ci --ignore-scripts --workspaces=false

      - id: package
        name: Verify the packaged CI plan and least-authority config
        if: ${{ steps.plan.outputs.deploy_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.plan.outputs.base_sha }}
          SOURCE_CI_RUN_ATTEMPT: ${{ steps.source.outputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ steps.source.outputs.source_ci_run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p build/delivery/package
          tar -tzf build/delivery/source/firebase-backend.tar.gz | \
            awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
          tar -xzf build/delivery/source/firebase-backend.tar.gz \
            -C build/delivery/package
          result="$(node tool/ci/package_firebase_delivery.mjs verify \
            --source-root build/delivery/source-checkout \
            --package-dir build/delivery/package \
            --source-sha "$SOURCE_SHA" \
            --base-sha "$BASE_SHA" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --provenance-manifest build/delivery/source/firebase-provenance.json \
            --affected-functions true)"
          result="$(node tool/ci/backend_source_review.mjs \
            --source-root build/delivery/source-checkout \
            --repository "$GITHUB_REPOSITORY" <<< "$result")"
          test "$(jq -er '.baseSha' <<< "$result")" = "$BASE_SHA"
          production_environment="$(jq -r '.productionPromotion.environment // "prod"' <<< "$result")"
          # Explicit recovery remains reviewer-protected even for ordinary code.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then production_environment=prod; fi
          [[ "$production_environment" =~ ^(prod|prod-backend)$ ]]
          jq '.productionPromotion // {environment: "prod", reason: "Non-Functions stages"}' <<< "$result"
          echo "production_environment=$production_environment" >> "$GITHUB_OUTPUT"

      - name: Write the source-bound manual recovery authorization
        if: ${{ steps.plan.outputs.deploy_required == 'true' }}
        env:
          BASE_SHA: ${{ steps.plan.outputs.base_sha }}
          SOURCE_CI_RUN_ATTEMPT: ${{ steps.source.outputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ steps.source.outputs.source_ci_run_id }}
          SOURCE_CI_RUN_NUMBER: ${{ steps.source.outputs.source_ci_run_number }}
          SOURCE_CI_WORKFLOW_ID: ${{ steps.source.outputs.source_ci_workflow_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p build/delivery/authorization
          package_sha256="$(jq -er '.artifact.sha256' build/delivery/source/firebase-provenance.json)"
          provenance_sha256="$(sha256sum build/delivery/source/firebase-provenance.json | awk '{print $1}')"
          [[ "$SOURCE_CI_WORKFLOW_ID" =~ ^[1-9][0-9]*$ ]]
          jq -n \
            --arg baseSha "$BASE_SHA" \
            --arg deliveryRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg deliveryRunId "$GITHUB_RUN_ID" \
            --arg packageSha256 "$package_sha256" \
            --arg provenanceSha256 "$provenance_sha256" \
            --arg sourceCiRunAttempt "$SOURCE_CI_RUN_ATTEMPT" \
            --arg sourceCiRunId "$SOURCE_CI_RUN_ID" \
            --arg sourceSha "$SOURCE_SHA" \
            --argjson sourceCiWorkflowId "$SOURCE_CI_WORKFLOW_ID" \
            --argjson sourceCiRunNumber "$SOURCE_CI_RUN_NUMBER" '{
              schema: "catch.backend-delivery-authorization/v2",
              baseSha: $baseSha,
              deliveryRunAttempt: $deliveryRunAttempt,
              deliveryRunId: $deliveryRunId,
              packageSha256: $packageSha256,
              provenanceSha256: $provenanceSha256,
              sourceCiRunAttempt: $sourceCiRunAttempt,
              sourceCiRunId: $sourceCiRunId,
              sourceCiRunNumber: $sourceCiRunNumber,
              sourceCiWorkflowId: $sourceCiWorkflowId,
              sourceSha: $sourceSha
            }' > build/delivery/authorization/backend-delivery-authorization.json

      - name: Upload the source-bound manual recovery authorization
        if: ${{ steps.plan.outputs.deploy_required == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-delivery-authorization-${{ steps.source.outputs.source_ci_workflow_id }}-${{ steps.source.outputs.source_sha }}-${{ steps.source.outputs.source_ci_run_attempt }}-${{ github.run_attempt }}
          path: build/delivery/authorization/backend-delivery-authorization.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve the verified inputs for dev completion
        if: ${{ steps.source.outputs.work_required == 'true' && env.DELIVERY_ENVIRONMENT == 'dev' }}
        run: |
          set -euo pipefail
          mkdir -p build/delivery/dev-completion-input
          cp build/delivery/lane-context.json build/delivery/dev-completion-input/context.json
          cp build/delivery/selection/source-candidate.json build/delivery/dev-completion-input/source-candidate.json
          cp build/delivery/selection/authority/content/ci-delivery-authority.json build/delivery/dev-completion-input/ci-delivery-authority.json
          cp build/delivery/plan/impact-plan.json build/delivery/dev-completion-input/impact-plan.json
          if [[ -f build/delivery/source/firebase-provenance.json ]]; then
            cp build/delivery/source/firebase-provenance.json build/delivery/dev-completion-input/firebase-provenance.json
            jq -er '.artifact.sha256' build/delivery/source/firebase-provenance.json > build/delivery/dev-completion-input/verified-package-sha256.txt
          fi

      - name: Upload the exact dev completion inputs
        if: ${{ steps.source.outputs.work_required == 'true' && env.DELIVERY_ENVIRONMENT == 'dev' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-dev-input-${{ github.run_attempt }}
          path: build/delivery/dev-completion-input
          if-no-files-found: error
          retention-days: 90

  dev:
    name: Promote backend to dev
    needs: authorize
    if: >-
      needs.authorize.result == 'success' &&
      needs.authorize.outputs.environment == 'dev' &&
      needs.authorize.outputs.work_required == 'true' &&
      needs.authorize.outputs.deploy_required == 'true'
    uses: ./.github/workflows/_firebase-promote.yml
    with:
      environment: dev
      control_plane_sha: ${{ github.workflow_sha }}
      base_sha: ${{ needs.authorize.outputs.base_sha }}
      source_ci_run_attempt: ${{ needs.authorize.outputs.source_ci_run_attempt }}
      source_ci_run_id: ${{ needs.authorize.outputs.source_ci_run_id }}
      source_sha: ${{ needs.authorize.outputs.source_sha }}
      resume_delivery_run_id: ${{ inputs.resume_delivery_run_id }}
      resume_delivery_attempt: ${{ inputs.resume_delivery_attempt }}
    secrets: inherit

  prod:
    name: Promote backend to prod
    needs: authorize
    if: >-
      always() &&
      needs.authorize.result == 'success' &&
      needs.authorize.outputs.work_required == 'true' &&
      needs.authorize.outputs.deploy_required == 'true' &&
      needs.authorize.outputs.environment == 'prod' &&
      needs.authorize.outputs.dev_completion_artifact_id != ''
    uses: ./.github/workflows/_firebase-promote.yml
    with:
      environment: prod
      approval_environment: ${{ needs.authorize.outputs.production_environment }}
      dev_completion_artifact_id: ${{ needs.authorize.outputs.dev_completion_artifact_id }}
      dev_completion_artifact_digest: ${{ needs.authorize.outputs.dev_completion_artifact_digest }}
      control_plane_sha: ${{ github.workflow_sha }}
      base_sha: ${{ needs.authorize.outputs.base_sha }}
      source_ci_run_attempt: ${{ needs.authorize.outputs.source_ci_run_attempt }}
      source_ci_run_id: ${{ needs.authorize.outputs.source_ci_run_id }}
      source_sha: ${{ needs.authorize.outputs.source_sha }}
      resume_delivery_run_id: ${{ inputs.resume_delivery_run_id }}
      resume_delivery_attempt: ${{ inputs.resume_delivery_attempt }}
    secrets: inherit

  finalize-dev:
    name: Record the successful dev completion
    needs: [authorize, dev]
    if: >-
      always() &&
      needs.authorize.result == 'success' &&
      needs.authorize.outputs.environment == 'dev' &&
      needs.authorize.outputs.work_required == 'true' &&
      (needs.authorize.outputs.deploy_required == 'false' || needs.dev.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}

      - id: completion-toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.completion-toolchain.outputs.node-version }}

      - uses: actions/download-artifact@v7
        with:
          name: backend-dev-input-${{ github.run_attempt }}
          path: build/delivery/dev-completion-input

      - id: completion
        name: Bind complete dev success to its exact source and package
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_RESULT: ${{ needs.dev.result }}
          BOOTSTRAP: ${{ needs.authorize.outputs.bootstrap }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          SOURCE_CI_RUN_ID: ${{ needs.authorize.outputs.source_ci_run_id }}
          SOURCE_CI_RUN_ATTEMPT: ${{ needs.authorize.outputs.source_ci_run_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          input=build/delivery/dev-completion-input
          jq -e --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '.deliveryRunId == $run and .deliveryRunAttempt == $attempt and .environment == "dev"' \
            "$input/context.json" > /dev/null
          jq -e --arg sha "$SOURCE_SHA" --arg run "$SOURCE_CI_RUN_ID" --arg attempt "$SOURCE_CI_RUN_ATTEMPT" \
            '.sourceSha == $sha and .sourceCiRunId == $run and .sourceCiRunAttempt == $attempt' \
            "$input/source-candidate.json" > /dev/null
          package_args=()
          if [[ -f "$input/firebase-provenance.json" ]]; then
            package_args=(--provenance "$input/firebase-provenance.json" --verified-package-sha256 "$(cat "$input/verified-package-sha256.txt")")
          fi
          node tool/ci/backend_delivery_lanes.mjs prepare-receipt \
            --context "$input/context.json" \
            --source "$input/source-candidate.json" \
            --authority "$input/ci-delivery-authority.json" \
            --plan "$input/impact-plan.json" \
            --dev-result "$DEV_RESULT" \
            --bootstrap "$BOOTSTRAP" \
            --output build/delivery/completion/backend-dev-completion.json \
            --github-output "$GITHUB_OUTPUT" \
            "${package_args[@]}"

      - name: Upload the immutable completed dev receipt
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.completion.outputs.dev_completion_artifact_name }}
          path: build/delivery/completion/backend-dev-completion.json
          if-no-files-found: error
          retention-days: 90

      - name: Wake both ordered delivery lanes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for environment in dev prod; do
            jq -n --arg environment "$environment" \
              '{event_type: "backend-delivery-drain", client_payload: {environment: $environment}}' \
              > build/delivery/wakeup.json
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input build/delivery/wakeup.json
          done

  wake-peer:
    name: Wake the lane whose progress can unblock delivery
    needs: authorize
    if: >-
      needs.authorize.result == 'success' &&
      (needs.authorize.outputs.lane_refresh_required == 'true' ||
       (github.event.client_payload.wakeup_reason != 'peer' &&
        needs.authorize.outputs.lane_waiting != 'true' &&
        (needs.authorize.outputs.waiting_for_dev == 'true' ||
         (needs.authorize.outputs.environment == 'dev' && needs.authorize.outputs.work_required == 'false'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Dispatch a fresh selector without changing its source
        env:
          GH_TOKEN: ${{ github.token }}
          WAKE_ENVIRONMENT: ${{ needs.authorize.outputs.lane_refresh_required == 'true' && 'dev' || (needs.authorize.outputs.environment == 'dev' && 'prod' || 'dev') }}
          WAKE_REASON: ${{ needs.authorize.outputs.lane_refresh_required == 'true' && 'refresh' || 'peer' }}
        run: |
          set -euo pipefail
          jq -n --arg environment "$WAKE_ENVIRONMENT" --arg reason "$WAKE_REASON" \
            '{event_type: "backend-delivery-drain", client_payload: {environment: $environment, wakeup_reason: $reason}}' > wakeup.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input wakeup.json


  finalize:
    name: Advance the successful delivery cursor
    needs: [authorize, dev, prod]
    if: >-
      always() &&
      needs.authorize.result == 'success' &&
      needs.authorize.outputs.work_required == 'true' &&
      needs.authorize.outputs.environment == 'prod' &&
      (
        needs.authorize.outputs.deploy_required == 'false' ||
        (
          needs.authorize.outputs.deploy_required == 'true' &&
          needs.prod.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Refuse stale GitHub partial reruns
        run: |
          set -euo pipefail
          if (( GITHUB_RUN_ATTEMPT > 1 )); then
            echo "GitHub partial reruns may reuse stale authorize outputs. Start a fresh manual Delivery recovery run instead."
            exit 64
          fi

      - name: Write the schema-bound cursor for this completed CI item
        env:
          DELIVERY_RUN_ATTEMPT: ${{ github.run_attempt }}
          DELIVERY_RUN_ID: ${{ github.run_id }}
          SOURCE_CI_RUN_ATTEMPT: ${{ needs.authorize.outputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ needs.authorize.outputs.source_ci_run_id }}
          SOURCE_CI_RUN_NUMBER: ${{ needs.authorize.outputs.source_ci_run_number }}
          SOURCE_CI_WORKFLOW_ID: ${{ needs.authorize.outputs.source_ci_workflow_id }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$DELIVERY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$DELIVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_CI_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_CI_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_CI_WORKFLOW_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p build/delivery/cursor
          jq -n \
            --arg deliveryRunAttempt "$DELIVERY_RUN_ATTEMPT" \
            --arg deliveryRunId "$DELIVERY_RUN_ID" \
            --arg sourceCiRunAttempt "$SOURCE_CI_RUN_ATTEMPT" \
            --arg sourceCiRunId "$SOURCE_CI_RUN_ID" \
            --arg sourceSha "$SOURCE_SHA" \
            --argjson sourceCiWorkflowId "$SOURCE_CI_WORKFLOW_ID" \
            --argjson sourceCiRunNumber "$SOURCE_CI_RUN_NUMBER" '{
              schema: "catch.backend-delivery-cursor/v4",
              deliveryRunAttempt: $deliveryRunAttempt,
              deliveryRunId: $deliveryRunId,
              sourceCiRunAttempt: $sourceCiRunAttempt,
              sourceCiRunNumber: $sourceCiRunNumber,
              sourceCiRunId: $sourceCiRunId,
              sourceCiWorkflowId: $sourceCiWorkflowId,
              sourceSha: $sourceSha
            }' > build/delivery/cursor/backend-delivery-cursor.json

      - name: Upload the immutable resumable delivery cursor
        uses: actions/upload-artifact@v7
        with:
          name: backend-delivery-cursor-v4-${{ needs.authorize.outputs.source_ci_workflow_id }}-${{ needs.authorize.outputs.source_ci_run_number }}-${{ needs.authorize.outputs.source_ci_run_id }}-${{ needs.authorize.outputs.source_ci_run_attempt }}-${{ needs.authorize.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/delivery/cursor/backend-delivery-cursor.json
          if-no-files-found: error
          retention-days: 90

      - name: Dispatch the next cursor-driven worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=backend-delivery-drain
          echo "Dispatched one cursor-driven worker to select the next immutable CI attempt."
