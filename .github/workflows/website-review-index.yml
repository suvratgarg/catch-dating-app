name: Website Review Index

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: backend-delivery
  cancel-in-progress: false

jobs:
  authorize:
    name: Verify the exact website index scope and accepted source
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Display the single additive index and successful current-main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node website/scripts/next/reviewIndexRelease.mjs authorize

  index:
    name: Protected organiser-review index only
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: prod
    concurrency:
      group: firebase-prod
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Recheck current accepted source after production review
        env:
          GH_TOKEN: ${{ github.token }}
        run: node website/scripts/next/reviewIndexRelease.mjs authorize
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      - name: Add only the missing index and wait until it is ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: node website/scripts/next/reviewIndexRelease.mjs apply
      - name: Preserve exact scope and before/after index metadata
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: website-review-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/website-review-index/*.json
          if-no-files-found: warn
          retention-days: 30
