name: Mobile Internal Exact Promotion

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: Exact signed package to promote.
        required: true
        type: choice
        options:
          - consumer-android
          - consumer-ios
          - host-android
          - host-ios
      producer_run_id:
        description: Successful Mobile Internal Release producer run id.
        required: true
        type: string
      producer_run_attempt:
        description: Current successful attempt of the producer run.
        required: true
        type: string
      authority_artifact_id:
        description: Immutable mobile build authority artifact id.
        required: true
        type: string
      authority_artifact_sha256:
        description: Lowercase SHA-256 of the authority artifact ZIP.
        required: true
        type: string
      reason:
        description: Non-empty operator reason for this store mutation.
        required: true
        type: string
      confirm:
        description: Confirm promotion of only the selected exact artifact.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  promote:
    name: Promote exact ${{ inputs.release_target }} package
    runs-on: ${{ endsWith(inputs.release_target, '-ios') && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    environment: prod-mobile
    concurrency:
      group: mobile-internal-promotion-${{ inputs.release_target }}
      cancel-in-progress: false
      queue: max

    steps:
      - id: producer
        name: Authorize the current successful producer attempt
        env:
          AUTHORITY_ARTIFACT_ID: ${{ inputs.authority_artifact_id }}
          AUTHORITY_ARTIFACT_SHA256: ${{ inputs.authority_artifact_sha256 }}
          CONFIRM: ${{ inputs.confirm }}
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          REASON: ${{ inputs.reason }}
          RELEASE_TARGET: ${{ inputs.release_target }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$PRODUCER_RUN_ID" != "$GITHUB_RUN_ID"
          [[ "$PRODUCER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PRODUCER_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$AUTHORITY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$AUTHORITY_ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_TARGET" =~ ^(consumer|host)-(android|ios)$ ]]
          test "$CONFIRM" = "true"
          if [[ -z "${REASON//[[:space:]]/}" || ${#REASON} -gt 500 ]]; then
            echo "Exact mobile promotion requires a non-empty reason of at most 500 characters."
            exit 64
          fi

          canonical_workflow="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/mobile-internal-release.yml")"
          workflow_id="$(jq -er '
            select(
              (.id | type == "number" and . > 0 and floor == .) and
              (.path | split("@")[0]) == ".github/workflows/mobile-internal-release.yml"
            ) | .id
          ' <<< "$canonical_workflow")"
          current_run="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID")"
          binding="$(jq -ce \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$PRODUCER_RUN_ID" \
            --argjson run_attempt "$PRODUCER_RUN_ATTEMPT" \
            --argjson workflow_id "$workflow_id" '
              select(
                (.id | tostring) == $run_id and
                .run_attempt == $run_attempt and
                .workflow_id == $workflow_id and
                .name == "Mobile Internal Release" and
                (.path | split("@")[0]) ==
                  ".github/workflows/mobile-internal-release.yml" and
                .event == "workflow_run" and
                .head_branch == "main" and
                .head_repository.full_name == $repository and
                (.head_sha | test("^[0-9a-f]{40}$")) and
                .status == "completed" and
                .conclusion == "success" and
                (.run_number | type == "number" and . > 0 and floor == .)
              ) |
              {producerHeadSha: .head_sha, runNumber: .run_number}
            ' <<< "$current_run")"
          producer_head_sha="$(jq -er '.producerHeadSha' <<< "$binding")"
          run_number="$(jq -er '.runNumber' <<< "$binding")"

          exact_attempt="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/attempts/$PRODUCER_RUN_ATTEMPT")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$PRODUCER_RUN_ID" \
            --arg producer_head_sha "$producer_head_sha" \
            --argjson run_attempt "$PRODUCER_RUN_ATTEMPT" \
            --argjson run_number "$run_number" \
            --argjson workflow_id "$workflow_id" '
              (.id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              .run_number == $run_number and
              .workflow_id == $workflow_id and
              .head_sha == $producer_head_sha and
              .name == "Mobile Internal Release" and
              (.path | split("@")[0]) ==
                ".github/workflows/mobile-internal-release.yml" and
              .event == "workflow_run" and
              .head_branch == "main" and
              .head_repository.full_name == $repository and
              .status == "completed" and
              .conclusion == "success"
            ' <<< "$exact_attempt" > /dev/null
          {
            echo "producer_head_sha=$producer_head_sha"
            echo "producer_workflow_id=$workflow_id"
            echo "producer_run_number=$run_number"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the exact current promoter implementation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require this promoter implementation to be current main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main:refs/remotes/origin/main --no-tags
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - id: authority
        name: Download and resolve only the exact build authority
        env:
          AUTHORITY_ARTIFACT_ID: ${{ inputs.authority_artifact_id }}
          AUTHORITY_ARTIFACT_SHA256: ${{ inputs.authority_artifact_sha256 }}
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          PRODUCER_HEAD_SHA: ${{ steps.producer.outputs.producer_head_sha }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          RELEASE_TARGET: ${{ inputs.release_target }}
        run: |
          set -euo pipefail
          verify_zip_paths() {
            local archive="$1"
            local entries
            local entry_count
            entries="$(unzip -Z1 "$archive")"
            test -n "$entries"
            entry_count="$(printf '%s\n' "$entries" | wc -l | tr -d ' ')"
            printf '%s\n' "$entries" | awk '
              $0 == "" || substr($0, 1, 1) == "/" || index($0, "\\") > 0 { exit 64 }
              {
                count = split($0, part, "/")
                for (segment = 1; segment <= count; segment += 1) {
                  if (part[segment] == "..") exit 64
                }
              }
            '
            test "$(printf '%s\n' "$entries" | sort | uniq -d | wc -l | tr -d ' ')" = "0"
            zipinfo -s "$archive" | awk -v expected="$entry_count" '
              /^[-bcdlps][rwxStTs-]{9}[[:space:]]/ {
                found += 1
                if (substr($0, 1, 1) != "-") exit 64
              }
              END { if (found != expected) exit 64 }
            '
          }

          mkdir -p build/mobile-promotion/authority
          metadata="$(gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTHORITY_ARTIFACT_ID")"
          repository_id="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.id')"
          jq -e \
            --arg digest "sha256:$AUTHORITY_ARTIFACT_SHA256" \
            --arg run_id "$PRODUCER_RUN_ID" \
            --arg producer_head_sha "$PRODUCER_HEAD_SHA" \
            --argjson artifact_id "$AUTHORITY_ARTIFACT_ID" \
            --argjson repository_id "$repository_id" '
              .id == $artifact_id and
              .expired == false and
              .digest == $digest and
              (.workflow_run.id | tostring) == $run_id and
              .workflow_run.repository_id == $repository_id and
              .workflow_run.head_repository_id == $repository_id and
              .workflow_run.head_branch == "main" and
              .workflow_run.head_sha == $producer_head_sha
            ' <<< "$metadata" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTHORITY_ARTIFACT_ID/zip" \
            > build/mobile-promotion/authority.zip
          test "$(shasum -a 256 build/mobile-promotion/authority.zip | awk '{print $1}')" = \
            "$AUTHORITY_ARTIFACT_SHA256"
          verify_zip_paths build/mobile-promotion/authority.zip
          unzip -q build/mobile-promotion/authority.zip \
            -d build/mobile-promotion/authority
          test "$(find build/mobile-promotion/authority -type l | wc -l | tr -d ' ')" = "0"
          authority_file=build/mobile-promotion/authority/mobile-build-authority.json
          test -f "$authority_file"
          test "$(find build/mobile-promotion/authority -type f | wc -l | tr -d ' ')" = "1"

          selection="$(node tool/ci/mobile_promotion_core.mjs select \
            --authority "$authority_file" \
            --release-target "$RELEASE_TARGET" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT")"
          jq -e '.ok == true' <<< "$selection" > /dev/null
          expected_authority_name="$(jq -er '.result.authorityArtifactName' <<< "$selection")"
          jq -e --arg name "$expected_authority_name" '.name == $name' \
            <<< "$metadata" > /dev/null
          {
            echo "authority_artifact_name=$expected_authority_name"
            echo "source_sha=$(jq -er '.result.sourceSha' <<< "$selection")"
            echo "source_ci_workflow_id=$(jq -er '.result.sourceCiWorkflowId' <<< "$selection")"
            echo "source_ci_run_number=$(jq -er '.result.sourceCiRunNumber' <<< "$selection")"
            echo "source_ci_run_id=$(jq -er '.result.sourceCiRunId' <<< "$selection")"
            echo "source_ci_run_attempt=$(jq -er '.result.sourceCiRunAttempt' <<< "$selection")"
            echo "package_artifact_id=$(jq -er '.result.packageArtifact.id' <<< "$selection")"
            echo "package_artifact_name=$(jq -er '.result.packageArtifact.name' <<< "$selection")"
            echo "package_artifact_digest=$(jq -er '.result.packageArtifact.digest' <<< "$selection")"
            echo "signed_artifact_sha256=$(jq -er '.result.artifactSha256' <<< "$selection")"
            echo "provenance_manifest_sha256=$(jq -er '.result.provenanceManifestSha256' <<< "$selection")"
          } >> "$GITHUB_OUTPUT"

      - name: Require the authority source to remain on main
        env:
          SOURCE_SHA: ${{ steps.authority.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main:refs/remotes/origin/main --no-tags
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main

      - id: package
        name: Download and verify the authority-selected package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ARTIFACT_DIGEST: ${{ steps.authority.outputs.package_artifact_digest }}
          PACKAGE_ARTIFACT_ID: ${{ steps.authority.outputs.package_artifact_id }}
          PACKAGE_ARTIFACT_NAME: ${{ steps.authority.outputs.package_artifact_name }}
          PRODUCER_HEAD_SHA: ${{ steps.producer.outputs.producer_head_sha }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          RELEASE_TARGET: ${{ inputs.release_target }}
          SOURCE_SHA: ${{ steps.authority.outputs.source_sha }}
        run: |
          set -euo pipefail
          verify_zip_paths() {
            local archive="$1"
            local entries
            local entry_count
            entries="$(unzip -Z1 "$archive")"
            test -n "$entries"
            entry_count="$(printf '%s\n' "$entries" | wc -l | tr -d ' ')"
            printf '%s\n' "$entries" | awk '
              $0 == "" || substr($0, 1, 1) == "/" || index($0, "\\") > 0 { exit 64 }
              {
                count = split($0, part, "/")
                for (segment = 1; segment <= count; segment += 1) {
                  if (part[segment] == "..") exit 64
                }
              }
            '
            test "$(printf '%s\n' "$entries" | sort | uniq -d | wc -l | tr -d ' ')" = "0"
            zipinfo -s "$archive" | awk -v expected="$entry_count" '
              /^[-bcdlps][rwxStTs-]{9}[[:space:]]/ {
                found += 1
                if (substr($0, 1, 1) != "-") exit 64
              }
              END { if (found != expected) exit 64 }
            '
          }

          metadata="$(gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$PACKAGE_ARTIFACT_ID")"
          repository_id="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.id')"
          jq -e \
            --arg digest "$PACKAGE_ARTIFACT_DIGEST" \
            --arg name "$PACKAGE_ARTIFACT_NAME" \
            --arg run_id "$PRODUCER_RUN_ID" \
            --arg producer_head_sha "$PRODUCER_HEAD_SHA" \
            --argjson artifact_id "$PACKAGE_ARTIFACT_ID" \
            --argjson repository_id "$repository_id" '
              .id == $artifact_id and
              .expired == false and
              .name == $name and
              .digest == $digest and
              (.workflow_run.id | tostring) == $run_id and
              .workflow_run.repository_id == $repository_id and
              .workflow_run.head_repository_id == $repository_id and
              .workflow_run.head_branch == "main" and
              .workflow_run.head_sha == $producer_head_sha
            ' <<< "$metadata" > /dev/null
          mkdir -p build/mobile-promotion/package
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PACKAGE_ARTIFACT_ID/zip" \
            > build/mobile-promotion/package.zip
          test "sha256:$(shasum -a 256 build/mobile-promotion/package.zip | awk '{print $1}')" = \
            "$PACKAGE_ARTIFACT_DIGEST"
          verify_zip_paths build/mobile-promotion/package.zip
          unzip -q build/mobile-promotion/package.zip -d build/mobile-promotion/package
          test "$(find build/mobile-promotion/package -type l | wc -l | tr -d ' ')" = "0"
          verification="$(node tool/ci/mobile_promotion_core.mjs verify-package \
            --authority build/mobile-promotion/authority/mobile-build-authority.json \
            --package-dir build/mobile-promotion/package \
            --release-target "$RELEASE_TARGET" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --source-sha "$SOURCE_SHA")"
          jq -e '.ok == true' <<< "$verification" > /dev/null
          {
            echo "artifact_name=$(jq -er '.result.artifactName' <<< "$verification")"
            echo "artifact_size_bytes=$(jq -er '.result.artifactSizeBytes' <<< "$verification")"
            echo "role=$(jq -er '.result.role' <<< "$verification")"
            echo "platform=$(jq -er '.result.platform' <<< "$verification")"
            echo "bundle_identifier=$(jq -r '.result.storeIdentity.bundleIdentifier // ""' <<< "$verification")"
            echo "application_id=$(jq -r '.result.storeIdentity.applicationId // ""' <<< "$verification")"
            echo "version=$(jq -r '.result.storeIdentity.version // .result.storeIdentity.versionName // ""' <<< "$verification")"
            echo "build=$(jq -r '.result.storeIdentity.build // (.result.storeIdentity.versionCode | tostring) // ""' <<< "$verification")"
          } >> "$GITHUB_OUTPUT"

      - id: store
        name: Bind the package identity to the canonical store target
        env:
          APPLICATION_ID: ${{ steps.package.outputs.application_id }}
          BUNDLE_IDENTIFIER: ${{ steps.package.outputs.bundle_identifier }}
          PLATFORM: ${{ steps.package.outputs.platform }}
          ROLE: ${{ steps.package.outputs.role }}
        run: |
          set -euo pipefail
          if [[ "$PLATFORM" == "ios" ]]; then
            fields="$(node tool/platform/resolve_app_target.mjs \
              --role "$ROLE" \
              --environment prod \
              --fields id,ios.bundleId,release.appStoreConnectAppId)"
            IFS=$'\t' read -r target_id expected_bundle_id app_store_connect_app_id <<< "$fields"
            test "$target_id" = "${ROLE}-prod"
            test "$BUNDLE_IDENTIFIER" = "$expected_bundle_id"
            [[ "$app_store_connect_app_id" =~ ^[1-9][0-9]*$ ]]
            echo "app_store_connect_app_id=$app_store_connect_app_id" >> "$GITHUB_OUTPUT"
          else
            fields="$(node tool/platform/resolve_app_target.mjs \
              --role "$ROLE" \
              --environment prod \
              --fields id,release.googlePlayPackageName)"
            IFS=$'\t' read -r target_id google_play_package_name <<< "$fields"
            test "$target_id" = "${ROLE}-prod"
            test "$APPLICATION_ID" = "$google_play_package_name"
            echo "google_play_package_name=$google_play_package_name" >> "$GITHUB_OUTPUT"
          fi

      - id: final
        name: Re-extract and reverify exact bytes before prior-claim lookup
        env:
          APPLICATION_ID: ${{ steps.package.outputs.application_id }}
          AUTHORITY_ARTIFACT_ID: ${{ inputs.authority_artifact_id }}
          AUTHORITY_ARTIFACT_NAME: ${{ steps.authority.outputs.authority_artifact_name }}
          AUTHORITY_ARTIFACT_SHA256: ${{ inputs.authority_artifact_sha256 }}
          BUNDLE_IDENTIFIER: ${{ steps.package.outputs.bundle_identifier }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ARTIFACT_DIGEST: ${{ steps.authority.outputs.package_artifact_digest }}
          PACKAGE_ARTIFACT_ID: ${{ steps.authority.outputs.package_artifact_id }}
          PACKAGE_ARTIFACT_NAME: ${{ steps.authority.outputs.package_artifact_name }}
          PRODUCER_HEAD_SHA: ${{ steps.producer.outputs.producer_head_sha }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          RELEASE_TARGET: ${{ inputs.release_target }}
          SOURCE_CI_RUN_ATTEMPT: ${{ steps.authority.outputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ steps.authority.outputs.source_ci_run_id }}
          SOURCE_CI_RUN_NUMBER: ${{ steps.authority.outputs.source_ci_run_number }}
          SOURCE_CI_WORKFLOW_ID: ${{ steps.authority.outputs.source_ci_workflow_id }}
          SOURCE_SHA: ${{ steps.authority.outputs.source_sha }}
        run: |
          set -euo pipefail
          verify_zip_paths() {
            local archive="$1"
            local entries
            local entry_count
            entries="$(unzip -Z1 "$archive")"
            test -n "$entries"
            entry_count="$(printf '%s\n' "$entries" | wc -l | tr -d ' ')"
            printf '%s\n' "$entries" | awk '
              $0 == "" || substr($0, 1, 1) == "/" || index($0, "\\") > 0 { exit 64 }
              {
                count = split($0, part, "/")
                for (segment = 1; segment <= count; segment += 1) {
                  if (part[segment] == "..") exit 64
                }
              }
            '
            test "$(printf '%s\n' "$entries" | sort | uniq -d | wc -l | tr -d ' ')" = "0"
            zipinfo -s "$archive" | awk -v expected="$entry_count" '
              /^[-bcdlps][rwxStTs-]{9}[[:space:]]/ {
                found += 1
                if (substr($0, 1, 1) != "-") exit 64
              }
              END { if (found != expected) exit 64 }
            '
          }

          current_run="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID")"
          jq -e \
            --arg run_id "$PRODUCER_RUN_ID" \
            --arg producer_head_sha "$PRODUCER_HEAD_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson run_attempt "$PRODUCER_RUN_ATTEMPT" '
              (.id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              .head_sha == $producer_head_sha and
              (.path | split("@")[0]) ==
                ".github/workflows/mobile-internal-release.yml" and
              .event == "workflow_run" and
              .head_branch == "main" and
              .head_repository.full_name == $repository and
              .status == "completed" and
              .conclusion == "success"
            ' <<< "$current_run" > /dev/null

          git fetch origin main:refs/remotes/origin/main --no-tags
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main

          canonical_ci="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml")"
          jq -e \
            --argjson workflow_id "$SOURCE_CI_WORKFLOW_ID" '
              .id == $workflow_id and
              (.path | split("@")[0]) == ".github/workflows/ci.yml"
            ' <<< "$canonical_ci" > /dev/null
          source_current="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$SOURCE_CI_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --argjson run_attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --argjson run_number "$SOURCE_CI_RUN_NUMBER" \
            --argjson workflow_id "$SOURCE_CI_WORKFLOW_ID" '
              (.id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              .run_number == $run_number and
              .workflow_id == $workflow_id and
              .name == "CI" and
              (.path | split("@")[0]) == ".github/workflows/ci.yml" and
              .event == "push" and
              .head_branch == "main" and
              .head_repository.full_name == $repository and
              .head_sha == $source_sha and
              .status == "completed" and
              .conclusion == "success"
            ' <<< "$source_current" > /dev/null
          source_exact="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID/attempts/$SOURCE_CI_RUN_ATTEMPT")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$SOURCE_CI_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --argjson run_attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --argjson run_number "$SOURCE_CI_RUN_NUMBER" \
            --argjson workflow_id "$SOURCE_CI_WORKFLOW_ID" '
              (.id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              .run_number == $run_number and
              .workflow_id == $workflow_id and
              .name == "CI" and
              (.path | split("@")[0]) == ".github/workflows/ci.yml" and
              .event == "push" and
              .head_branch == "main" and
              .head_repository.full_name == $repository and
              .head_sha == $source_sha and
              .status == "completed" and
              .conclusion == "success"
            ' <<< "$source_exact" > /dev/null

          authority_metadata="$(gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTHORITY_ARTIFACT_ID")"
          jq -e \
            --arg digest "sha256:$AUTHORITY_ARTIFACT_SHA256" \
            --arg name "$AUTHORITY_ARTIFACT_NAME" \
            --arg run_id "$PRODUCER_RUN_ID" \
            --arg producer_head_sha "$PRODUCER_HEAD_SHA" \
            --argjson artifact_id "$AUTHORITY_ARTIFACT_ID" '
              .id == $artifact_id and .expired == false and
              .name == $name and .digest == $digest and
              (.workflow_run.id | tostring) == $run_id and
              .workflow_run.head_branch == "main" and
              .workflow_run.head_sha == $producer_head_sha
            ' <<< "$authority_metadata" > /dev/null
          package_metadata="$(gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$PACKAGE_ARTIFACT_ID")"
          jq -e \
            --arg digest "$PACKAGE_ARTIFACT_DIGEST" \
            --arg name "$PACKAGE_ARTIFACT_NAME" \
            --arg run_id "$PRODUCER_RUN_ID" \
            --arg producer_head_sha "$PRODUCER_HEAD_SHA" \
            --argjson artifact_id "$PACKAGE_ARTIFACT_ID" '
              .id == $artifact_id and .expired == false and
              .name == $name and .digest == $digest and
              (.workflow_run.id | tostring) == $run_id and
              .workflow_run.head_branch == "main" and
              .workflow_run.head_sha == $producer_head_sha
            ' <<< "$package_metadata" > /dev/null
          test "$(shasum -a 256 build/mobile-promotion/authority.zip | awk '{print $1}')" = \
            "$AUTHORITY_ARTIFACT_SHA256"
          test "sha256:$(shasum -a 256 build/mobile-promotion/package.zip | awk '{print $1}')" = \
            "$PACKAGE_ARTIFACT_DIGEST"

          rm -rf build/mobile-promotion/authority build/mobile-promotion/package
          mkdir -p build/mobile-promotion/authority build/mobile-promotion/package
          verify_zip_paths build/mobile-promotion/authority.zip
          verify_zip_paths build/mobile-promotion/package.zip
          unzip -q build/mobile-promotion/authority.zip -d build/mobile-promotion/authority
          unzip -q build/mobile-promotion/package.zip -d build/mobile-promotion/package
          test "$(find build/mobile-promotion/authority build/mobile-promotion/package \
            -type l | wc -l | tr -d ' ')" = "0"
          test -f build/mobile-promotion/authority/mobile-build-authority.json
          test "$(find build/mobile-promotion/authority -type f | wc -l | tr -d ' ')" = "1"

          selection="$(node tool/ci/mobile_promotion_core.mjs select \
            --authority build/mobile-promotion/authority/mobile-build-authority.json \
            --release-target "$RELEASE_TARGET" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --source-sha "$SOURCE_SHA")"
          jq -e \
            --arg digest "$PACKAGE_ARTIFACT_DIGEST" \
            --arg name "$PACKAGE_ARTIFACT_NAME" \
            --argjson artifact_id "$PACKAGE_ARTIFACT_ID" '
              .ok == true and
              .result.packageArtifact.id == $artifact_id and
              .result.packageArtifact.name == $name and
              .result.packageArtifact.digest == $digest
            ' <<< "$selection" > /dev/null
          verification="$(node tool/ci/mobile_promotion_core.mjs verify-package \
            --authority build/mobile-promotion/authority/mobile-build-authority.json \
            --package-dir build/mobile-promotion/package \
            --release-target "$RELEASE_TARGET" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --source-sha "$SOURCE_SHA")"
          jq -e '.ok == true' <<< "$verification" > /dev/null
          artifact_name="$(jq -er '.result.artifactName' <<< "$verification")"
          artifact_path="$GITHUB_WORKSPACE/build/mobile-promotion/package/$artifact_name"
          test -f "$artifact_path"
          test "$(shasum -a 256 "$artifact_path" | awk '{print $1}')" = \
            "$(jq -er '.result.artifactSha256' <<< "$verification")"
          if [[ "$RELEASE_TARGET" == *-ios ]]; then
            final_bundle_id="$(jq -er '.result.storeIdentity.bundleIdentifier' <<< "$verification")"
            test "$final_bundle_id" = "$BUNDLE_IDENTIFIER"
            final_version="$(jq -er '.result.storeIdentity.version' <<< "$verification")"
            final_build="$(jq -er '.result.storeIdentity.build' <<< "$verification")"
          else
            final_application_id="$(jq -er '.result.storeIdentity.applicationId' <<< "$verification")"
            test "$final_application_id" = "$APPLICATION_ID"
            final_version="$(jq -er '.result.storeIdentity.versionName' <<< "$verification")"
            final_build="$(jq -er '.result.storeIdentity.versionCode' <<< "$verification")"
          fi
          {
            echo "artifact_name=$artifact_name"
            echo "artifact_path=$artifact_path"
            echo "artifact_sha256=$(jq -er '.result.artifactSha256' <<< "$verification")"
            echo "bundle_identifier=${final_bundle_id:-}"
            echo "application_id=${final_application_id:-}"
            echo "version=$final_version"
            echo "build=$final_build"
          } >> "$GITHUB_OUTPUT"

      - id: claim
        name: Resolve an immutable prior exact-promotion claim
        env:
          AUTHORITY_ARTIFACT_DIGEST: sha256:${{ inputs.authority_artifact_sha256 }}
          AUTHORITY_ARTIFACT_ID: ${{ inputs.authority_artifact_id }}
          AUTHORITY_ARTIFACT_NAME: ${{ steps.authority.outputs.authority_artifact_name }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ARTIFACT_DIGEST: ${{ steps.authority.outputs.package_artifact_digest }}
          PACKAGE_ARTIFACT_ID: ${{ steps.authority.outputs.package_artifact_id }}
          PACKAGE_ARTIFACT_NAME: ${{ steps.authority.outputs.package_artifact_name }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          RELEASE_TARGET: ${{ inputs.release_target }}
          SIGNED_ARTIFACT_SHA256: ${{ steps.final.outputs.artifact_sha256 }}
          SOURCE_CI_RUN_ATTEMPT: ${{ steps.authority.outputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ steps.authority.outputs.source_ci_run_id }}
          SOURCE_SHA: ${{ steps.authority.outputs.source_sha }}
          STORE_BUILD: ${{ steps.final.outputs.build }}
          STORE_CHANNEL: ${{ endsWith(inputs.release_target, '-ios') && 'testflight' || 'play-qa' }}
          STORE_TARGET: ${{ steps.store.outputs.app_store_connect_app_id || steps.store.outputs.google_play_package_name }}
          STORE_VERSION: ${{ steps.final.outputs.version }}
        run: |
          set -euo pipefail
          claim_name="mobile-promotion-claim-v1-${RELEASE_TARGET}-${PACKAGE_ARTIFACT_ID}-${SIGNED_ARTIFACT_SHA256}"
          [[ "$claim_name" =~ ^[A-Za-z0-9._-]+$ ]]
          listing="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$claim_name&per_page=100")"
          count="$(jq -er '[.artifacts[] | select(.expired == false)] | length' <<< "$listing")"
          if [[ "$count" == "0" ]]; then
            {
              echo "claim_artifact_name=$claim_name"
              echo "prior_receipt=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$count" = "1"
          metadata="$(jq -ce '[.artifacts[] | select(.expired == false)] | .[0]' <<< "$listing")"
          claim_id="$(jq -er '.id' <<< "$metadata")"
          claim_digest="$(jq -er '.digest' <<< "$metadata")"
          [[ "$claim_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$claim_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -e --arg name "$claim_name" '.name == $name and .expired == false' \
            <<< "$metadata" > /dev/null
          prior_run_id="$(jq -er '.workflow_run.id' <<< "$metadata")"
          mkdir -p build/mobile-promotion/prior-claim
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$claim_id/zip" \
            > build/mobile-promotion/prior-claim.zip
          test "sha256:$(shasum -a 256 build/mobile-promotion/prior-claim.zip | awk '{print $1}')" = \
            "$claim_digest"
          entries="$(unzip -Z1 build/mobile-promotion/prior-claim.zip)"
          test "$entries" = "mobile-promotion-receipt.json"
          zipinfo -s build/mobile-promotion/prior-claim.zip | awk '
            /^[-bcdlps][rwxStTs-]{9}[[:space:]]/ {
              found += 1
              if (substr($0, 1, 1) != "-") exit 64
            }
            END { if (found != 1) exit 64 }
          '
          unzip -q build/mobile-promotion/prior-claim.zip \
            -d build/mobile-promotion/prior-claim
          test "$(find build/mobile-promotion/prior-claim -type l | wc -l | tr -d ' ')" = "0"
          receipt="$(node tool/ci/mobile_promotion_core.mjs verify-receipt \
            --receipt build/mobile-promotion/prior-claim/mobile-promotion-receipt.json \
            --release-target "$RELEASE_TARGET" \
            --source-sha "$SOURCE_SHA" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --authority-artifact-id "$AUTHORITY_ARTIFACT_ID" \
            --authority-artifact-name "$AUTHORITY_ARTIFACT_NAME" \
            --authority-artifact-digest "$AUTHORITY_ARTIFACT_DIGEST" \
            --package-artifact-id "$PACKAGE_ARTIFACT_ID" \
            --package-artifact-name "$PACKAGE_ARTIFACT_NAME" \
            --package-artifact-digest "$PACKAGE_ARTIFACT_DIGEST" \
            --signed-artifact-sha256 "$SIGNED_ARTIFACT_SHA256" \
            --store-channel "$STORE_CHANNEL" \
            --store-target "$STORE_TARGET" \
            --store-version "$STORE_VERSION" \
            --store-build "$STORE_BUILD")"
          jq -e --arg release_target "$RELEASE_TARGET" '
              .ok == true and
              .result.evidenceLevel == "exact-artifact" and
              (($release_target | endswith("-ios") | not) or
               .result.store.result == "uploaded")
            ' \
            <<< "$receipt" > /dev/null
          receipt_run_id="$(jq -er '.result.promotionRunId' <<< "$receipt")"
          receipt_run_attempt="$(jq -er '.result.promotionRunAttempt' <<< "$receipt")"
          test "$receipt_run_id" = "$prior_run_id"
          [[ "$receipt_run_attempt" =~ ^[1-9][0-9]*$ ]]
          prior_exact="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$prior_run_id/attempts/$receipt_run_attempt")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$prior_run_id" \
            --argjson run_attempt "$receipt_run_attempt" '
              (.id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              .name == "Mobile Internal Exact Promotion" and
              (.path | split("@")[0]) == ".github/workflows/mobile-internal-promote.yml" and
              .event == "workflow_dispatch" and
              .head_branch == "main" and
              .head_repository.full_name == $repository and
              .status == "completed" and
              .conclusion == "success"
            ' <<< "$prior_exact" > /dev/null
          {
            echo "claim_artifact_name=$claim_name"
            echo "prior_receipt=true"
            echo "prior_remote_id=$(jq -er '.result.store.remoteId' <<< "$receipt")"
          } >> "$GITHUB_OUTPUT"

      - name: Re-extract and reverify exact bytes immediately before credentials
        env:
          AUTHORITY_ARTIFACT_ID: ${{ inputs.authority_artifact_id }}
          AUTHORITY_ARTIFACT_NAME: ${{ steps.authority.outputs.authority_artifact_name }}
          AUTHORITY_ARTIFACT_SHA256: ${{ inputs.authority_artifact_sha256 }}
          EXPECTED_APPLICATION_ID: ${{ steps.final.outputs.application_id }}
          EXPECTED_ARTIFACT_NAME: ${{ steps.final.outputs.artifact_name }}
          EXPECTED_ARTIFACT_SHA256: ${{ steps.final.outputs.artifact_sha256 }}
          EXPECTED_BUILD: ${{ steps.final.outputs.build }}
          EXPECTED_BUNDLE_ID: ${{ steps.final.outputs.bundle_identifier }}
          EXPECTED_VERSION: ${{ steps.final.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ARTIFACT_DIGEST: ${{ steps.authority.outputs.package_artifact_digest }}
          PACKAGE_ARTIFACT_ID: ${{ steps.authority.outputs.package_artifact_id }}
          PACKAGE_ARTIFACT_NAME: ${{ steps.authority.outputs.package_artifact_name }}
          PRODUCER_HEAD_SHA: ${{ steps.producer.outputs.producer_head_sha }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          RELEASE_TARGET: ${{ inputs.release_target }}
          SOURCE_CI_RUN_ATTEMPT: ${{ steps.authority.outputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ steps.authority.outputs.source_ci_run_id }}
          SOURCE_CI_RUN_NUMBER: ${{ steps.authority.outputs.source_ci_run_number }}
          SOURCE_CI_WORKFLOW_ID: ${{ steps.authority.outputs.source_ci_workflow_id }}
          SOURCE_SHA: ${{ steps.authority.outputs.source_sha }}
        run: |
          set -euo pipefail
          verify_zip_paths() {
            local archive="$1"
            local entries
            local entry_count
            entries="$(unzip -Z1 "$archive")"
            test -n "$entries"
            entry_count="$(printf '%s\n' "$entries" | wc -l | tr -d ' ')"
            printf '%s\n' "$entries" | awk '
              $0 == "" || substr($0, 1, 1) == "/" || index($0, "\\") > 0 { exit 64 }
              {
                count = split($0, part, "/")
                for (segment = 1; segment <= count; segment += 1) {
                  if (part[segment] == "..") exit 64
                }
              }
            '
            test "$(printf '%s\n' "$entries" | sort | uniq -d | wc -l | tr -d ' ')" = "0"
            zipinfo -s "$archive" | awk -v expected="$entry_count" '
              /^[-bcdlps][rwxStTs-]{9}[[:space:]]/ {
                found += 1
                if (substr($0, 1, 1) != "-") exit 64
              }
              END { if (found != expected) exit 64 }
            '
          }

          git fetch origin main:refs/remotes/origin/main --no-tags
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main

          producer="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID")"
          jq -e \
            --arg producer_head_sha "$PRODUCER_HEAD_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$PRODUCER_RUN_ID" \
            --argjson run_attempt "$PRODUCER_RUN_ATTEMPT" '
              (.id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              .head_sha == $producer_head_sha and
              (.path | split("@")[0]) ==
                ".github/workflows/mobile-internal-release.yml" and
              .event == "workflow_run" and .head_branch == "main" and
              .head_repository.full_name == $repository and
              .status == "completed" and .conclusion == "success"
            ' <<< "$producer" > /dev/null

          source_current="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID")"
          source_exact="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID/attempts/$SOURCE_CI_RUN_ATTEMPT")"
          for source_run in "$source_current" "$source_exact"; do
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg run_id "$SOURCE_CI_RUN_ID" \
              --arg source_sha "$SOURCE_SHA" \
              --argjson run_attempt "$SOURCE_CI_RUN_ATTEMPT" \
              --argjson run_number "$SOURCE_CI_RUN_NUMBER" \
              --argjson workflow_id "$SOURCE_CI_WORKFLOW_ID" '
                (.id | tostring) == $run_id and
                .run_attempt == $run_attempt and
                .run_number == $run_number and
                .workflow_id == $workflow_id and .name == "CI" and
                (.path | split("@")[0]) == ".github/workflows/ci.yml" and
                .event == "push" and .head_branch == "main" and
                .head_repository.full_name == $repository and
                .head_sha == $source_sha and
                .status == "completed" and .conclusion == "success"
              ' <<< "$source_run" > /dev/null
          done

          for artifact_kind in authority package; do
            if [[ "$artifact_kind" == "authority" ]]; then
              artifact_id="$AUTHORITY_ARTIFACT_ID"
              artifact_name="$AUTHORITY_ARTIFACT_NAME"
              artifact_digest="sha256:$AUTHORITY_ARTIFACT_SHA256"
            else
              artifact_id="$PACKAGE_ARTIFACT_ID"
              artifact_name="$PACKAGE_ARTIFACT_NAME"
              artifact_digest="$PACKAGE_ARTIFACT_DIGEST"
            fi
            metadata="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")"
            jq -e \
              --arg digest "$artifact_digest" \
              --arg name "$artifact_name" \
              --arg producer_head_sha "$PRODUCER_HEAD_SHA" \
              --arg run_id "$PRODUCER_RUN_ID" \
              --argjson artifact_id "$artifact_id" '
                .id == $artifact_id and .expired == false and
                .name == $name and .digest == $digest and
                (.workflow_run.id | tostring) == $run_id and
                .workflow_run.head_branch == "main" and
                .workflow_run.head_sha == $producer_head_sha
              ' <<< "$metadata" > /dev/null
          done

          test "$(shasum -a 256 build/mobile-promotion/authority.zip | awk '{print $1}')" = \
            "$AUTHORITY_ARTIFACT_SHA256"
          test "sha256:$(shasum -a 256 build/mobile-promotion/package.zip | awk '{print $1}')" = \
            "$PACKAGE_ARTIFACT_DIGEST"
          rm -rf build/mobile-promotion/authority build/mobile-promotion/package
          mkdir -p build/mobile-promotion/authority build/mobile-promotion/package
          verify_zip_paths build/mobile-promotion/authority.zip
          verify_zip_paths build/mobile-promotion/package.zip
          unzip -q build/mobile-promotion/authority.zip -d build/mobile-promotion/authority
          unzip -q build/mobile-promotion/package.zip -d build/mobile-promotion/package
          test "$(find build/mobile-promotion/authority build/mobile-promotion/package \
            -type l | wc -l | tr -d ' ')" = "0"
          test "$(find build/mobile-promotion/authority -type f | wc -l | tr -d ' ')" = "1"
          verification="$(node tool/ci/mobile_promotion_core.mjs verify-package \
            --authority build/mobile-promotion/authority/mobile-build-authority.json \
            --package-dir build/mobile-promotion/package \
            --release-target "$RELEASE_TARGET" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --source-sha "$SOURCE_SHA")"
          jq -e \
            --arg application_id "$EXPECTED_APPLICATION_ID" \
            --arg artifact_name "$EXPECTED_ARTIFACT_NAME" \
            --arg artifact_sha256 "$EXPECTED_ARTIFACT_SHA256" \
            --arg build "$EXPECTED_BUILD" \
            --arg bundle_id "$EXPECTED_BUNDLE_ID" \
            --arg version "$EXPECTED_VERSION" '
              .ok == true and
              .result.artifactName == $artifact_name and
              .result.artifactSha256 == $artifact_sha256 and
              ((.result.platform == "ios" and
                .result.storeIdentity.bundleIdentifier == $bundle_id and
                .result.storeIdentity.version == $version and
                .result.storeIdentity.build == $build) or
               (.result.platform == "android" and
                .result.storeIdentity.applicationId == $application_id and
                .result.storeIdentity.versionName == $version and
                (.result.storeIdentity.versionCode | tostring) == $build))
            ' <<< "$verification" > /dev/null
          artifact_path="$GITHUB_WORKSPACE/build/mobile-promotion/package/$EXPECTED_ARTIFACT_NAME"
          test -f "$artifact_path"
          test "$(shasum -a 256 "$artifact_path" | awk '{print $1}')" = \
            "$EXPECTED_ARTIFACT_SHA256"

      - id: ios-auth
        name: Materialize App Store Connect credentials after final verification
        if: ${{ endsWith(inputs.release_target, '-ios') }}
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_BASE64"
          key_dir="$HOME/.appstoreconnect/private_keys"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$key_dir"
          printf '%s' "$ASC_KEY_BASE64" | /usr/bin/base64 -D > "$key_path"
          chmod 600 "$key_path"
          echo "key_path=$key_path" >> "$GITHUB_OUTPUT"

      - id: ios-preflight
        name: Fail closed or bind TestFlight to a prior exact receipt
        if: ${{ endsWith(inputs.release_target, '-ios') }}
        env:
          APP_STORE_CONNECT_APP_ID: ${{ steps.store.outputs.app_store_connect_app_id }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          BUILD_NUMBER: ${{ steps.final.outputs.build }}
          KEY_PATH: ${{ steps.ios-auth.outputs.key_path }}
          PRIOR_RECEIPT: ${{ steps.claim.outputs.prior_receipt }}
          PRIOR_REMOTE_ID: ${{ steps.claim.outputs.prior_remote_id }}
        run: |
          set -euo pipefail
          preflight="$(node tool/platform/verify_app_store_build.mjs \
            --app-id "$APP_STORE_CONNECT_APP_ID" \
            --build-number "$BUILD_NUMBER" \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-path "$KEY_PATH" \
            --preflight)"
          action="$(jq -er '.action' <<< "$preflight")"
          remote_id="$(jq -r '.buildId // ""' <<< "$preflight")"
          case "$action" in
            upload-required)
              test "$PRIOR_RECEIPT" = "false"
              ;;
            existing-valid|existing-processing)
              if [[ "$PRIOR_RECEIPT" != "true" || "$remote_id" != "$PRIOR_REMOTE_ID" ]]; then
                echo "Existing App Store build has no matching exact-artifact receipt."
                echo "The prior upload result is ambiguous; exact promotion fails closed."
                exit 64
              fi
              ;;
            *) echo "Unsupported App Store preflight action: $action"; exit 64 ;;
          esac
          {
            echo "action=$action"
            echo "remote_id=$remote_id"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the exact IPA to TestFlight
        if: ${{ endsWith(inputs.release_target, '-ios') && steps.ios-preflight.outputs.action == 'upload-required' }}
        env:
          APP_STORE_CONNECT_APP_ID: ${{ steps.store.outputs.app_store_connect_app_id }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          BUNDLE_IDENTIFIER: ${{ steps.final.outputs.bundle_identifier }}
          BUILD_NUMBER: ${{ steps.final.outputs.build }}
          IPA_PATH: ${{ steps.final.outputs.artifact_path }}
          MARKETING_VERSION: ${{ steps.final.outputs.version }}
        run: |
          set -euo pipefail
          test "$(shasum -a 256 "$IPA_PATH" | awk '{print $1}')" = \
            "${{ steps.final.outputs.artifact_sha256 }}"
          xcrun altool \
            --upload-package "$IPA_PATH" \
            --platform ios \
            --apple-id "$APP_STORE_CONNECT_APP_ID" \
            --bundle-id "$BUNDLE_IDENTIFIER" \
            --bundle-version "$BUILD_NUMBER" \
            --bundle-short-version-string "$MARKETING_VERSION" \
            --api-key "$ASC_KEY_ID" \
            --api-issuer "$ASC_ISSUER_ID"

      - id: ios-store
        name: Verify the exact TestFlight postcondition
        if: ${{ endsWith(inputs.release_target, '-ios') }}
        env:
          ACTION: ${{ steps.ios-preflight.outputs.action }}
          APP_STORE_CONNECT_APP_ID: ${{ steps.store.outputs.app_store_connect_app_id }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          BUILD_NUMBER: ${{ steps.final.outputs.build }}
          KEY_PATH: ${{ steps.ios-auth.outputs.key_path }}
          PREFLIGHT_REMOTE_ID: ${{ steps.ios-preflight.outputs.remote_id }}
        run: |
          set -euo pipefail
          if [[ "$ACTION" == "existing-valid" ]]; then
            remote_id="$PREFLIGHT_REMOTE_ID"
            result="already-promoted"
          else
            processed="$(node tool/platform/verify_app_store_build.mjs \
              --app-id "$APP_STORE_CONNECT_APP_ID" \
              --build-number "$BUILD_NUMBER" \
              --key-id "$ASC_KEY_ID" \
              --issuer-id "$ASC_ISSUER_ID" \
              --key-path "$KEY_PATH" \
              --wait-processed \
              --github-run-id "$GITHUB_RUN_ID")"
            test "$(jq -er '.processingState' <<< "$processed")" = "VALID"
            remote_id="$(jq -er '.buildId' <<< "$processed")"
            if [[ "$ACTION" == "existing-processing" ]]; then
              test "$remote_id" = "$PREFLIGHT_REMOTE_ID"
              result="already-promoted"
            else
              result="uploaded"
            fi
          fi
          {
            echo "remote_id=$remote_id"
            echo "result=$result"
          } >> "$GITHUB_OUTPUT"

      - name: Remove App Store Connect credentials before postconditions
        if: ${{ always() && endsWith(inputs.release_target, '-ios') }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_KEY_PATH: ${{ steps.ios-auth.outputs.key_path }}
        run: |
          set -euo pipefail
          if [[ -z "$ASC_KEY_PATH" && -n "$ASC_KEY_ID" ]]; then
            ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          fi
          if [[ -n "$ASC_KEY_PATH" ]]; then
            case "$ASC_KEY_PATH" in
              "$HOME/.appstoreconnect/private_keys/"AuthKey_*.p8) ;;
              *) echo "Unexpected App Store Connect key path."; exit 64 ;;
            esac
            rm -f -- "$ASC_KEY_PATH"
            test ! -e "$ASC_KEY_PATH"
          fi

      - name: Require the guarded Play internal publisher
        if: ${{ endsWith(inputs.release_target, '-android') }}
        env:
          GOOGLE_PLAY_UPLOAD_ENABLED: ${{ vars.GOOGLE_PLAY_UPLOAD_ENABLED }}
        run: |
          if [[ "$GOOGLE_PLAY_UPLOAD_ENABLED" != "true" ]]; then
            echo "Play internal upload remains disabled; refusing the store mutation."
            exit 64
          fi

      - id: play-auth
        name: Authenticate the Play publisher after final verification
        if: ${{ endsWith(inputs.release_target, '-android') }}
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - id: play-store
        name: Upload the exact AAB only to the Play qa track
        if: ${{ endsWith(inputs.release_target, '-android') }}
        env:
          AAB_PATH: ${{ steps.final.outputs.artifact_path }}
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          GOOGLE_PLAY_PACKAGE_NAME: ${{ steps.store.outputs.google_play_package_name }}
          RELEASE_TARGET: ${{ inputs.release_target }}
          SIGNED_ARTIFACT_SHA256: ${{ steps.final.outputs.artifact_sha256 }}
          VERSION_CODE: ${{ steps.final.outputs.build }}
          VERSION_NAME: ${{ steps.final.outputs.version }}
        run: |
          set -euo pipefail
          test "$(shasum -a 256 "$AAB_PATH" | awk '{print $1}')" = \
            "${{ steps.final.outputs.artifact_sha256 }}"
          result="$(node tool/platform/upload_google_play_bundle.mjs \
            --package-name "$GOOGLE_PLAY_PACKAGE_NAME" \
            --bundle "$AAB_PATH" \
            --expected-version-code "$VERSION_CODE" \
            --expected-sha256 "$SIGNED_ARTIFACT_SHA256" \
            --track qa \
            --release-name "GitHub exact $RELEASE_TARGET $VERSION_NAME ($VERSION_CODE)" \
            --apply \
            --allow-prod)"
          jq -e \
            --arg package "$GOOGLE_PLAY_PACKAGE_NAME" \
            --arg sha256 "$SIGNED_ARTIFACT_SHA256" \
            --arg version "$VERSION_CODE" '
              .ok == true and
              .result.packageName == $package and
              .result.track == "qa" and
              .result.versionCode == $version and
              .result.sha256 == $sha256 and
              (.result.operation == "uploaded" or
               .result.operation == "resumed" or
               .result.operation == "already-promoted")
            ' <<< "$result" > /dev/null
          operation="$(jq -er '.result.operation' <<< "$result")"
          case "$operation" in
            uploaded) store_result="uploaded" ;;
            resumed) store_result="reconciled" ;;
            already-promoted) store_result="already-promoted" ;;
          esac
          {
            echo "remote_id=$VERSION_CODE"
            echo "result=$store_result"
          } >> "$GITHUB_OUTPUT"

      - name: Remove Play credentials before postconditions
        if: ${{ always() && endsWith(inputs.release_target, '-android') }}
        env:
          CREDENTIAL_FILE: ${{ steps.play-auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          if [[ -z "$CREDENTIAL_FILE" ]]; then
            CREDENTIAL_FILE="${GOOGLE_GHA_CREDS_PATH:-}"
          fi
          if [[ -n "$CREDENTIAL_FILE" ]]; then
            case "$CREDENTIAL_FILE" in
              "$GITHUB_WORKSPACE/"gha-creds-*.json) ;;
              *) echo "Unexpected Google credential path."; exit 64 ;;
            esac
            rm -f -- "$CREDENTIAL_FILE"
            test ! -e "$CREDENTIAL_FILE"
          fi
          {
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="
            echo "GOOGLE_APPLICATION_CREDENTIALS="
            echo "GOOGLE_GHA_CREDS_PATH="
          } >> "$GITHUB_ENV"

      - id: receipt
        name: Create the immutable exact-promotion receipt after credential removal
        if: ${{ success() && steps.claim.outputs.prior_receipt == 'false' }}
        env:
          AUTHORITY_ARTIFACT_DIGEST: sha256:${{ inputs.authority_artifact_sha256 }}
          AUTHORITY_ARTIFACT_ID: ${{ inputs.authority_artifact_id }}
          AUTHORITY_ARTIFACT_NAME: ${{ steps.authority.outputs.authority_artifact_name }}
          PACKAGE_ARTIFACT_DIGEST: ${{ steps.authority.outputs.package_artifact_digest }}
          PACKAGE_ARTIFACT_ID: ${{ steps.authority.outputs.package_artifact_id }}
          PACKAGE_ARTIFACT_NAME: ${{ steps.authority.outputs.package_artifact_name }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          REASON: ${{ inputs.reason }}
          RELEASE_TARGET: ${{ inputs.release_target }}
          SIGNED_ARTIFACT_SHA256: ${{ steps.final.outputs.artifact_sha256 }}
          SOURCE_CI_RUN_ATTEMPT: ${{ steps.authority.outputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ steps.authority.outputs.source_ci_run_id }}
          SOURCE_SHA: ${{ steps.authority.outputs.source_sha }}
          STORE_BUILD: ${{ steps.final.outputs.build }}
          STORE_CHANNEL: ${{ endsWith(inputs.release_target, '-ios') && 'testflight' || 'play-qa' }}
          STORE_REMOTE_ID: ${{ steps.ios-store.outputs.remote_id || steps.play-store.outputs.remote_id }}
          STORE_RESULT: ${{ steps.ios-store.outputs.result || steps.play-store.outputs.result }}
          STORE_TARGET: ${{ steps.store.outputs.app_store_connect_app_id || steps.store.outputs.google_play_package_name }}
          STORE_VERSION: ${{ steps.final.outputs.version }}
        run: |
          set -euo pipefail
          reason_sha256="$(printf '%s' "$REASON" | shasum -a 256 | awk '{print $1}')"
          mkdir -p build/mobile-promotion/claim
          node tool/ci/mobile_promotion_core.mjs receipt \
            --release-target "$RELEASE_TARGET" \
            --source-sha "$SOURCE_SHA" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --authority-artifact-id "$AUTHORITY_ARTIFACT_ID" \
            --authority-artifact-name "$AUTHORITY_ARTIFACT_NAME" \
            --authority-artifact-digest "$AUTHORITY_ARTIFACT_DIGEST" \
            --package-artifact-id "$PACKAGE_ARTIFACT_ID" \
            --package-artifact-name "$PACKAGE_ARTIFACT_NAME" \
            --package-artifact-digest "$PACKAGE_ARTIFACT_DIGEST" \
            --signed-artifact-sha256 "$SIGNED_ARTIFACT_SHA256" \
            --promotion-run-id "$GITHUB_RUN_ID" \
            --promotion-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --reason-sha256 "$reason_sha256" \
            --store-channel "$STORE_CHANNEL" \
            --store-target "$STORE_TARGET" \
            --store-version "$STORE_VERSION" \
            --store-build "$STORE_BUILD" \
            --store-result "$STORE_RESULT" \
            --store-remote-id "$STORE_REMOTE_ID" \
            --evidence-level exact-artifact \
            --output build/mobile-promotion/claim/mobile-promotion-receipt.json
          test "$(jq -er '.claimArtifactName' \
            build/mobile-promotion/claim/mobile-promotion-receipt.json)" = \
            "${{ steps.claim.outputs.claim_artifact_name }}"

      - name: Record credential-free exact promotion postconditions
        if: ${{ success() }}
        env:
          ARTIFACT_PATH: ${{ steps.final.outputs.artifact_path }}
          ARTIFACT_SHA256: ${{ steps.final.outputs.artifact_sha256 }}
          ASC_KEY_PATH: ${{ steps.ios-auth.outputs.key_path }}
          CREDENTIAL_FILE: ${{ steps.play-auth.outputs.credentials_file_path }}
          RELEASE_TARGET: ${{ inputs.release_target }}
        run: |
          set -euo pipefail
          test "$(shasum -a 256 "$ARTIFACT_PATH" | awk '{print $1}')" = \
            "$ARTIFACT_SHA256"
          if [[ -n "$ASC_KEY_PATH" ]]; then test ! -e "$ASC_KEY_PATH"; fi
          if [[ -n "$CREDENTIAL_FILE" ]]; then test ! -e "$CREDENTIAL_FILE"; fi
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          {
            echo "## Exact mobile internal promotion"
            echo
            echo "- Release target: \`$RELEASE_TARGET\`"
            echo "- Producer run: \`${{ inputs.producer_run_id }}\` attempt \`${{ inputs.producer_run_attempt }}\`"
            echo "- Authority artifact: \`${{ inputs.authority_artifact_id }}\`"
            echo "- Package artifact: \`${{ steps.authority.outputs.package_artifact_id }}\`"
            echo "- Signed-byte SHA-256: \`$ARTIFACT_SHA256\`"
            echo "- Exact claim: \`${{ steps.claim.outputs.claim_artifact_name }}\`"
            echo "- Prior exact claim reused: \`${{ steps.claim.outputs.prior_receipt }}\`"
            echo "- Operator reason: recorded in protected dispatch inputs"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist the immutable exact-promotion claim as the final substantive step
        if: ${{ success() && steps.claim.outputs.prior_receipt == 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.claim.outputs.claim_artifact_name }}
          path: build/mobile-promotion/claim/mobile-promotion-receipt.json
          if-no-files-found: error
          retention-days: 90
