name: Firebase Backend Promotion

on:
  workflow_call:
    inputs:
      environment:
        description: Firebase environment alias.
        required: true
        type: string
      approval_environment:
        description: Optional separately restricted routine production environment.
        required: false
        default: ""
        type: string
      dev_completion_artifact_id:
        description: Exact completed-dev receipt required for ordinary production delivery.
        required: false
        default: ""
        type: string
      dev_completion_artifact_digest:
        description: GitHub SHA-256 archive digest of the exact completed-dev receipt.
        required: false
        default: ""
        type: string
      base_sha:
        description: Exact base SHA recorded by the trusted CI impact plan.
        required: true
        type: string
      control_plane_sha:
        description: Exact commit containing the trusted Delivery workflow and helpers.
        required: true
        type: string
      source_ci_run_id:
        description: Trusted source CI run id.
        required: true
        type: string
      source_ci_run_attempt:
        description: Trusted source CI run attempt.
        required: true
        type: string
      source_sha:
        description: Exact CI-approved source SHA.
        required: true
        type: string
      require_current_main:
        description: Require the approved source to remain the exact current main head.
        required: false
        default: false
        type: boolean
      resume_delivery_run_id:
        description: Optional terminal non-success Delivery run id containing the exact recovery authorization/checkpoint.
        required: false
        type: string
      resume_delivery_attempt:
        description: Prior terminal non-success Delivery attempt containing the recovery state.
        required: false
        default: "1"
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read
  id-token: write

jobs:
  promote:
    name: Firebase ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: ${{ inputs.approval_environment || inputs.environment }}
    concurrency:
      group: firebase-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Validate bounded promotion inputs
        env:
          CONTROL_PLANE_SHA: ${{ inputs.control_plane_sha }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          APPROVAL_ENVIRONMENT: ${{ inputs.approval_environment || inputs.environment }}
          RESUME_RUN_ID: ${{ inputs.resume_delivery_run_id }}
          BASE_SHA: ${{ inputs.base_sha }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REQUIRE_CURRENT_MAIN: ${{ inputs.require_current_main }}
        run: |
          set -euo pipefail
          if (( GITHUB_RUN_ATTEMPT > 1 )); then
            echo "GitHub partial reruns may reuse stale authorize outputs. Start a fresh manual Delivery recovery run instead."
            exit 64
          fi
          [[ "$CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_ENVIRONMENT" =~ ^(dev|staging|prod)$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_CI_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUIRE_CURRENT_MAIN" =~ ^(true|false)$ ]]
          if [[ "$APPROVAL_ENVIRONMENT" != "$DEPLOY_ENVIRONMENT" ]]; then
            test "$DEPLOY_ENVIRONMENT" = prod
            test "$APPROVAL_ENVIRONMENT" = prod-backend
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/delivery.yml@refs/heads/main"
            [[ "$GITHUB_EVENT_NAME" =~ ^(workflow_run|repository_dispatch)$ ]]
            test "$REQUIRE_CURRENT_MAIN" = false
            test -z "$RESUME_RUN_ID"
          fi

      - name: Checkout the immutable Delivery control plane
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.control_plane_sha }}
          fetch-depth: 0

      - name: Checkout the exact CI-approved source as verification input
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: build/delivery/source-checkout

      - name: Require the control plane and ordered source to remain exact
        env:
          CONTROL_PLANE_SHA: ${{ inputs.control_plane_sha }}
          REQUIRE_CURRENT_MAIN: ${{ inputs.require_current_main }}
          SOURCE_CHECKOUT: build/delivery/source-checkout
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_SHA"
          test "$(git -C "$SOURCE_CHECKOUT" rev-parse HEAD)" = "$SOURCE_SHA"
          git -C "$SOURCE_CHECKOUT" fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          git -C "$SOURCE_CHECKOUT" merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          if [[ "$REQUIRE_CURRENT_MAIN" == "true" ]]; then
            test "$(git -C "$SOURCE_CHECKOUT" rev-parse refs/remotes/origin/main)" = "$SOURCE_SHA"
          fi

      - name: Download only the source CI artifact
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_ci_run_id }}
          name: firebase-delivery-${{ inputs.source_sha }}-${{ inputs.source_ci_run_attempt }}
          path: build/delivery/source

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the pinned source-analysis parser
        run: npm ci --ignore-scripts --workspaces=false

      - id: verify
        name: Verify artifact provenance and packaged CI plan before mutation
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ inputs.base_sha }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          node tool/ci/delivery_core.mjs verify \
            --manifest build/delivery/source/firebase-provenance.json \
            --artifact build/delivery/source/firebase-backend.tar.gz \
            --source-sha "$SOURCE_SHA" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT"
          mkdir -p build/delivery/package
          tar -tzf build/delivery/source/firebase-backend.tar.gz | \
            awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
          tar -xzf build/delivery/source/firebase-backend.tar.gz \
            -C build/delivery/package
          result="$(node tool/ci/package_firebase_delivery.mjs verify \
            --source-root build/delivery/source-checkout \
            --package-dir build/delivery/package \
            --source-sha "$SOURCE_SHA" \
            --base-sha "$BASE_SHA" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --provenance-manifest build/delivery/source/firebase-provenance.json \
            --affected-functions true)"
          reviewed_result="$(node tool/ci/backend_source_review.mjs \
            --source-root build/delivery/source-checkout \
            --repository "$GITHUB_REPOSITORY" <<< "$result")"
          project_id="$(jq -er --arg environment "$DEPLOY_ENVIRONMENT" \
            '.projects[$environment]' build/delivery/package/.firebaserc)"
          control_project_id="$(jq -er --arg environment "$DEPLOY_ENVIRONMENT" \
            '.projects[$environment]' .firebaserc)"
          [[ "$project_id" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          test "$control_project_id" = "$project_id"
          # Keep live approval evidence separate from the deterministic package
          # plan compared again at each deployment boundary.
          printf '%s\n' "$result" > build/delivery/execution-plan.json
          jq '.productionPromotion' <<< "$reviewed_result" > build/delivery/production-approval.json
          jq '{stages, targets, functionSelection, productionPromotion}' <<< "$reviewed_result"
          echo "targets=$(jq -r '.targets | map(select(length > 0)) | join(",")' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "has_targets=$(jq -r '.targets | any(length > 0)' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "has_functions=$(jq -r '.targets | any(startswith("functions:"))' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "checkpoint_scope=firebase:${DEPLOY_ENVIRONMENT}:${project_id}" >> "$GITHUB_OUTPUT"

      - name: Independently verify exact dev completion before production authentication
        if: ${{ inputs.environment == 'prod' && endsWith(github.workflow_ref, '/.github/workflows/delivery.yml@refs/heads/main') }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_COMPLETION_ARTIFACT_ID: ${{ inputs.dev_completion_artifact_id }}
          DEV_COMPLETION_ARTIFACT_DIGEST: ${{ inputs.dev_completion_artifact_digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "$DEV_COMPLETION_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DEV_COMPLETION_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          current_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          source_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID/attempts/$SOURCE_CI_RUN_ATTEMPT")"
          jq -n \
            --arg environment prod \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson repositoryId "$GITHUB_REPOSITORY_ID" \
            --argjson sourceCiWorkflowId "$(jq -er '.workflow_id' <<< "$source_run")" \
            --argjson deliveryWorkflowId "$(jq -er '.workflow_id' <<< "$current_run")" \
            --arg deliveryRunId "$GITHUB_RUN_ID" \
            --arg deliveryRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --argjson deliveryRunNumber "$GITHUB_RUN_NUMBER" \
            '{environment: $environment, repository: $repository, repositoryId: $repositoryId,
              sourceCiWorkflowId: $sourceCiWorkflowId, deliveryWorkflowId: $deliveryWorkflowId,
              deliveryRunId: $deliveryRunId, deliveryRunAttempt: $deliveryRunAttempt,
              deliveryRunNumber: $deliveryRunNumber}' > build/delivery/lane-context.json
          node tool/ci/backend_delivery_lanes.mjs verify-artifact \
            --context build/delivery/lane-context.json \
            --artifact-id "$DEV_COMPLETION_ARTIFACT_ID" \
            --artifact-digest "$DEV_COMPLETION_ARTIFACT_DIGEST" \
            --output build/delivery/dev-completion.json
          node tool/ci/backend_delivery_lanes.mjs verify-package \
            --context build/delivery/lane-context.json \
            --receipt build/delivery/dev-completion.json \
            --source-sha "$SOURCE_SHA" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --base-sha "$BASE_SHA" \
            --package build/delivery/source/firebase-backend.tar.gz \
            --provenance build/delivery/source/firebase-provenance.json \
            --output build/delivery/verified-dev-package.json

      - name: Recompute automatic production eligibility before authentication
        if: ${{ inputs.approval_environment == 'prod-backend' }}
        run: |
          set -euo pipefail
          jq -e '.environment == "prod-backend"' \
            build/delivery/production-approval.json > /dev/null
          jq -e '.stages == ["functions"]' \
            build/delivery/execution-plan.json > /dev/null

      - id: restore
        name: Resolve resumable checkpoint
        env:
          EXPLICIT_ATTEMPT: ${{ inputs.resume_delivery_attempt }}
          EXPLICIT_RUN_ID: ${{ inputs.resume_delivery_run_id }}
          REPOSITORY_ID: ${{ github.repository_id }}
          GH_TOKEN: ${{ github.token }}
          PROJECT_ID: ${{ steps.verify.outputs.project_id }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          restore_run_id=""
          restore_attempt=""
          explicit=false
          if [[ -n "$EXPLICIT_RUN_ID" ]]; then
            [[ "$EXPLICIT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$EXPLICIT_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            restore_run_id="$EXPLICIT_RUN_ID"
            restore_attempt="$EXPLICIT_ATTEMPT"
            explicit=true
          fi
          artifact_name="firebase-checkpoint-${DEPLOY_ENVIRONMENT}-${PROJECT_ID}-${SOURCE_SHA}-${restore_attempt}"
          should_restore=false
          if [[ -n "$restore_run_id" ]]; then
            if [[ "$explicit" == "true" && "$restore_run_id" == "$GITHUB_RUN_ID" ]]; then
              echo "A Delivery run cannot resume a checkpoint from its current attempt."
              exit 64
            fi
            if [[ "$restore_run_id" != "$GITHUB_RUN_ID" ]]; then
              node tool/ci/backend_delivery_lanes.mjs verify-run \
                --repository "$GITHUB_REPOSITORY" --repository-id "$REPOSITORY_ID" \
                --run-id "$restore_run_id" --run-attempt "$restore_attempt" \
                --role delivery --output build/delivery/restore-producer.json
              jq -e '
                .status == "completed" and
                (.conclusion == "failure" or
                 .conclusion == "cancelled" or
                 .conclusion == "timed_out" or
                 .conclusion == "stale" or
                 .conclusion == "action_required" or
                 .conclusion == "startup_failure")
              ' build/delivery/restore-producer.json > /dev/null
            fi
            matching_artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$restore_run_id/artifacts" \
              --paginate --slurp | jq --arg name "$artifact_name" \
                '[.[].artifacts[] | select(.name == $name)]')"
            count="$(jq 'length' <<< "$matching_artifacts")"
            decision="$(node tool/ci/delivery_core.mjs restore-decision \
              --artifact-count "$count")"
            should_restore="$(jq -r '.shouldRestore' <<< "$decision")"
            if [[ "$should_restore" == "true" ]]; then
              echo "artifact_id=$(jq -er '.[0].id' <<< "$matching_artifacts")" >> "$GITHUB_OUTPUT"
              echo "artifact_digest=$(jq -er '.[0].digest' <<< "$matching_artifacts")" >> "$GITHUB_OUTPUT"
            fi
            if [[ "$(jq -r '.restartFromFirstStage' <<< "$decision")" == "true" ]]; then
              echo "No exact checkpoint exists for $DEPLOY_ENVIRONMENT; restarting its same verified package at the first stage."
            fi
          fi
          echo "run_id=$restore_run_id" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$restore_attempt" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "should_restore=$should_restore" >> "$GITHUB_OUTPUT"

      - name: Download and verify the exact prior checkpoint
        if: ${{ steps.restore.outputs.should_restore == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE_RUN_ID: ${{ steps.restore.outputs.run_id }}
          RESTORE_ATTEMPT: ${{ steps.restore.outputs.run_attempt }}
          ARTIFACT_ID: ${{ steps.restore.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.restore.outputs.artifact_digest }}
          CHECKPOINT_SCOPE: ${{ steps.verify.outputs.checkpoint_scope }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
        run: |
          node tool/ci/firebase_functions_checkpoint.mjs restore \
            --manifest build/delivery/source/firebase-provenance.json \
            --artifact build/delivery/source/firebase-backend.tar.gz \
            --source-sha "$SOURCE_SHA" --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" --scope "$CHECKPOINT_SCOPE" \
            --checkpoint build/delivery/checkpoint/checkpoint.json \
            --repository "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID" \
            --run-id "$RESTORE_RUN_ID" --run-attempt "$RESTORE_ATTEMPT" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Install authenticated Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify environment prerequisites for the approved targets
        if: ${{ steps.verify.outputs.has_targets == 'true' }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_TARGETS: ${{ steps.verify.outputs.targets }}
        run: >-
          node tool/firebase/check_environment_readiness.mjs
          --env "$DEPLOY_ENVIRONMENT"
          --targets "$DEPLOY_TARGETS"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@${{ steps.toolchain.outputs.firebase-tools-version }}

      - name: Create a separate deploy tree
        run: |
          test ! -e build/delivery/deploy-tree
          cp -a build/delivery/package build/delivery/deploy-tree

      - name: Install runtime dependencies only in the deploy tree
        if: ${{ steps.verify.outputs.has_functions == 'true' }}
        run: >-
          npm --prefix build/delivery/deploy-tree/functions ci
          --omit=dev --ignore-scripts

      - name: Reverify every authored byte immediately before deployment
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          node tool/ci/delivery_core.mjs verify \
            --manifest build/delivery/source/firebase-provenance.json \
            --artifact build/delivery/source/firebase-backend.tar.gz \
            --source-sha "$SOURCE_SHA" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT"
          node tool/ci/package_firebase_delivery.mjs verify \
            --source-root build/delivery/source-checkout \
            --package-dir build/delivery/package \
            --source-sha "$SOURCE_SHA" \
            --base-sha "$BASE_SHA" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --provenance-manifest build/delivery/source/firebase-provenance.json \
            --affected-functions true > build/delivery/reverified-plan.json
          cmp build/delivery/execution-plan.json build/delivery/reverified-plan.json
          node tool/ci/package_firebase_delivery.mjs verify \
            --source-root build/delivery/source-checkout \
            --package-dir build/delivery/deploy-tree \
            --source-sha "$SOURCE_SHA" \
            --base-sha "$BASE_SHA" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --provenance-manifest build/delivery/source/firebase-provenance.json \
            --allow-runtime-dependencies true \
            --trusted-package-dir build/delivery/package \
            --affected-functions true > build/delivery/reverified-plan.json
          cmp build/delivery/execution-plan.json build/delivery/reverified-plan.json

      - name: Remove only obsolete non-deployable indexes from the deploy copy
        run: |
          set -euo pipefail
          indexes=build/delivery/deploy-tree/firestore.indexes.json
          if [[ -f "$indexes" ]]; then
            node tool/firebase/sanitize_firestore_indexes_for_deploy.mjs \
              --indexes "$indexes" \
              --current-indexes firestore.indexes.json
          else
            echo "Verified package has no Firestore index payload; skipping index sanitization."
          fi

      - name: Materialize non-secret Functions params in the deploy copy
        env:
          ALGOLIA_APPLICATION_ID: ${{ vars.ALGOLIA_APPLICATION_ID }}
          RAZORPAY_PUBLIC_KEY_ID: ${{ vars.RAZORPAY_PUBLIC_KEY_ID }}
          META_WHATSAPP_APP_ID: ${{ vars.META_WHATSAPP_APP_ID }}
          META_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID: ${{ vars.META_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID }}
          META_WHATSAPP_GRAPH_VERSION: ${{ vars.META_WHATSAPP_GRAPH_VERSION }}
          META_WHATSAPP_ENABLED: ${{ vars.META_WHATSAPP_ENABLED }}
        run: |
          set -euo pipefail
          functions_dir=build/delivery/deploy-tree/functions
          if [[ -d "$functions_dir" ]]; then
            node tool/firebase/prepare_functions_params_for_deploy.mjs \
              --functions-dir "$functions_dir" \
              --project "${{ steps.verify.outputs.project_id }}"
          else
            echo "Verified package has no Functions payload; skipping Functions parameter materialization."
          fi

      - name: Preflight the whole backend plan before any deployment
        if: ${{ steps.verify.outputs.has_functions == 'true' }}
        env:
          CATCH_DEPLOY_ALLOW_BEHIND: ${{ inputs.require_current_main && '0' || '1' }}
          CATCH_DELIVERY_FUNCTIONS_DIR: build/delivery/deploy-tree/functions
          CATCH_FIREBASE_SOURCE_ROOT: build/delivery/source-checkout
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_TARGETS: ${{ steps.verify.outputs.targets }}
        run: >-
          ./tool/deploy_firebase_targets.sh --preflight
          "$DEPLOY_ENVIRONMENT" "$DEPLOY_TARGETS"

      - id: promote
        name: Resume ordered backend stages
        env:
          CHECKPOINT: build/delivery/checkpoint/checkpoint.json
          CHECKPOINT_SCOPE: ${{ steps.verify.outputs.checkpoint_scope }}
          CONTROL_PLANE_SHA: ${{ inputs.control_plane_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DELIVERY_FUNCTIONS_DIR: build/delivery/deploy-tree/functions
          PACKAGE_DIR: build/delivery/deploy-tree
          PROJECT_ID: ${{ steps.verify.outputs.project_id }}
          REQUIRE_CURRENT_MAIN: ${{ inputs.require_current_main }}
          SOURCE_CHECKOUT: build/delivery/source-checkout
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$CHECKPOINT")"
          while true; do
            next="$(node tool/ci/delivery_core.mjs next \
              --manifest build/delivery/source/firebase-provenance.json \
              --artifact build/delivery/source/firebase-backend.tar.gz \
              --source-sha "$SOURCE_SHA" \
              --ci-run-id "$SOURCE_CI_RUN_ID" \
              --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
              --scope "$CHECKPOINT_SCOPE" \
              --checkpoint "$CHECKPOINT")"
            if [[ "$(jq -r '.next.complete' <<< "$next")" == "true" ]]; then
              break
            fi
            stage="$(jq -er '.next.stage' <<< "$next")"
            target="$(jq -er --arg stage "$stage" '
              .stages as $stages |
              .targets as $targets |
              ($stages | index($stage)) as $index |
              select($index != null) |
              $targets[$index]
            ' build/delivery/execution-plan.json)"
            case "$stage" in
              firestore-indexes|functions|firestore-rules|storage-rules) ;;
              *) echo "Refusing unknown delivery stage: $stage"; exit 64 ;;
            esac
            stage_status=0
            failure_detail="Firebase CLI stage failed; safe to resume this stage."
            # The local-checkout guard cannot define freshness for an immutable
            # ordered artifact. Revalidate both pinned ancestors at every stage;
            # current-main snapshot recovery retains its stricter equality gate.
            test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_SHA"
            test "$(git -C "$SOURCE_CHECKOUT" rev-parse HEAD)" = "$SOURCE_SHA"
            git -C "$SOURCE_CHECKOUT" fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
            git -C "$SOURCE_CHECKOUT" merge-base --is-ancestor "$CONTROL_PLANE_SHA" refs/remotes/origin/main
            git -C "$SOURCE_CHECKOUT" merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
            if [[ "$REQUIRE_CURRENT_MAIN" == "true" ]]; then
              test "$(git -C "$SOURCE_CHECKOUT" rev-parse refs/remotes/origin/main)" = "$SOURCE_SHA"
              export CATCH_DEPLOY_ALLOW_BEHIND=0
            else
              export CATCH_DEPLOY_ALLOW_BEHIND=1
            fi
            deploy_args=(--config "$PACKAGE_DIR/firebase.json")
            if [[ "$stage" == "functions" && -n "$target" ]]; then
              IFS=',' read -r -a explicit_function_targets <<< "$target"
              (( "${#explicit_function_targets[@]}" > 0 ))
              for function_target in "${explicit_function_targets[@]}"; do
                if [[ ! "$function_target" =~ ^functions:[A-Za-z][A-Za-z0-9_-]*$ ]]; then
                  echo "Refusing --force without an exact named Function target: $function_target"
                  exit 64
                fi
              done
              # Firebase requires this acknowledgement when an exact target
              # newly enables retry-on-failure. Exact selectors keep unrelated
              # and environment-only Functions outside the mutation set.
              deploy_args+=(--force)
            fi
            if [[ "$stage" == "functions" && -z "$target" ]]; then
              echo "No Functions runtime dependency changed; recording the verified no-op stage."
            elif [[ "$stage" == "functions" ]]; then
              proof_args=(
                --manifest build/delivery/source/firebase-provenance.json
                --artifact build/delivery/source/firebase-backend.tar.gz
                --source-sha "$SOURCE_SHA" --ci-run-id "$SOURCE_CI_RUN_ID"
                --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" --scope "$CHECKPOINT_SCOPE"
                --checkpoint "$CHECKPOINT" --base-sha "$BASE_SHA" --targets "$target"
                --params-file "$DELIVERY_FUNCTIONS_DIR/.env.$PROJECT_ID"
              )
              recovery="$(node tool/ci/firebase_functions_checkpoint.mjs verify "${proof_args[@]}")"
              postconditions_only="$(jq -r '.postconditionsOnly | select(type == "boolean")' <<< "$recovery")"
              if [[ "$postconditions_only" != "true" && "$postconditions_only" != "false" ]]; then
                echo "Invalid Functions checkpoint recovery decision."
                exit 64
              fi
              if [[ "$postconditions_only" == "false" ]]; then
                CATCH_DELIVERY_FUNCTIONS_DIR="$DELIVERY_FUNCTIONS_DIR" \
                  CATCH_FIREBASE_SOURCE_ROOT="$SOURCE_CHECKOUT" \
                  ./tool/deploy_firebase_targets.sh --functions-deploy-only \
                    "$DEPLOY_ENVIRONMENT" "$target" "${deploy_args[@]}" || stage_status=$?
                if [[ "$stage_status" == "0" ]]; then
                  node tool/ci/firebase_functions_checkpoint.mjs record "${proof_args[@]}" || stage_status=$?
                fi
              else
                echo "Exact Functions deployment is still active; resuming callable permissions and parity only."
              fi
              if [[ "$stage_status" == "0" ]]; then
                CATCH_DELIVERY_FUNCTIONS_DIR="$DELIVERY_FUNCTIONS_DIR" \
                  CATCH_FIREBASE_SOURCE_ROOT="$SOURCE_CHECKOUT" \
                  ./tool/deploy_firebase_targets.sh --functions-postconditions-only \
                    "$DEPLOY_ENVIRONMENT" "$target" "${deploy_args[@]}" || stage_status=$?
              fi
              failure_detail="Functions deployment or postcondition failed; exact recovery proof determines the next subphase."
            else
              CATCH_DELIVERY_FUNCTIONS_DIR="$DELIVERY_FUNCTIONS_DIR" \
                CATCH_FIREBASE_SOURCE_ROOT="$SOURCE_CHECKOUT" \
                ./tool/deploy_firebase_targets.sh \
                  "$DEPLOY_ENVIRONMENT" "$target" \
                  "${deploy_args[@]}" || stage_status=$?
            fi
            if [[ "$stage_status" == "0" && "$stage" == "firestore-indexes" ]]; then
              node tool/firebase/wait_firestore_indexes_ready.mjs \
                --indexes "$PACKAGE_DIR/firestore.indexes.json" \
                --project "$PROJECT_ID" \
                --timeout-seconds 1800 \
                --poll-seconds 20 || stage_status=$?
              failure_detail="Firestore composite indexes did not reach READY; safe to resume the index stage."
            fi
            if [[ "$stage_status" == "0" ]]; then
              node tool/ci/delivery_core.mjs checkpoint \
                --manifest build/delivery/source/firebase-provenance.json \
                --artifact build/delivery/source/firebase-backend.tar.gz \
                --source-sha "$SOURCE_SHA" \
                --ci-run-id "$SOURCE_CI_RUN_ID" \
                --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
                --scope "$CHECKPOINT_SCOPE" \
                --checkpoint "$CHECKPOINT" \
                --stage "$stage" \
                --status passed
            else
              node tool/ci/delivery_core.mjs checkpoint \
                --manifest build/delivery/source/firebase-provenance.json \
                --artifact build/delivery/source/firebase-backend.tar.gz \
                --source-sha "$SOURCE_SHA" \
                --ci-run-id "$SOURCE_CI_RUN_ID" \
                --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
                --scope "$CHECKPOINT_SCOPE" \
                --checkpoint "$CHECKPOINT" \
                --stage "$stage" \
                --status failed \
                --detail "$failure_detail"
              exit "$stage_status"
            fi
          done

      - name: Verify active rules match the exact approved source
        env:
          PROJECT_ID: ${{ steps.verify.outputs.project_id }}
        run: >-
          node tool/firebase/check_rules_deployment_drift.mjs
          --project "$PROJECT_ID"
          --repo-root build/delivery/source-checkout
          --wait-seconds 180
          --poll-seconds 10

      - name: Upload resumable checkpoint
        if: ${{ always() && hashFiles('build/delivery/checkpoint/checkpoint.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: firebase-checkpoint-${{ inputs.environment }}-${{ steps.verify.outputs.project_id }}-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: |
            build/delivery/checkpoint/checkpoint.json
            build/delivery/checkpoint/functions-deployment.json
          if-no-files-found: error
          retention-days: 90
