name: Firebase Backend Promotion

on:
  workflow_call:
    inputs:
      environment:
        description: Firebase environment alias.
        required: true
        type: string
      approval_environment:
        description: Optional separately restricted routine production environment.
        required: false
        default: ""
        type: string
      dev_completion_artifact_id:
        description: Exact completed-dev receipt required for ordinary production delivery.
        required: false
        default: ""
        type: string
      dev_completion_artifact_digest:
        description: GitHub SHA-256 archive digest of the exact completed-dev receipt.
        required: false
        default: ""
        type: string
      dev_completion_receipt_sha256:
        description: Exact one-callable DEV receipt bytes from the trusted caller job output.
        required: false
        default: ""
        type: string
      base_sha:
        description: Exact base SHA recorded by the trusted CI impact plan.
        required: true
        type: string
      control_plane_sha:
        description: Exact commit containing the trusted Delivery workflow and helpers.
        required: true
        type: string
      source_ci_run_id:
        description: Trusted source CI run id.
        required: true
        type: string
      source_ci_run_attempt:
        description: Trusted source CI run attempt.
        required: true
        type: string
      source_sha:
        description: Exact CI-approved source SHA.
        required: true
        type: string
      require_current_main:
        description: Require the approved source to remain the exact current main head.
        required: false
        default: false
        type: boolean
      operator_release:
        description: One pinned, reviewer-protected PROD release of four Functions and five indexes.
        required: false
        default: false
        type: boolean
      whatsapp_five_release:
        description: One pinned, reviewer-protected PROD release of five Catch WhatsApp Functions.
        required: false
        default: false
        type: boolean
      sales_pr543_release:
        description: One pinned, reviewer-protected PROD release of 44 Sales Functions and Firestore rules.
        required: false
        default: false
        type: boolean
      intake_pr596_release:
        description: One immutable PR596 Intake Function under recorded human PROD approval.
        required: false
        default: false
        type: boolean
      wedding_phone_import_release:
        description: One pinned additive wedding import callable; DEV then human-approved PROD.
        required: false
        default: false
        type: boolean
      resume_delivery_run_id:
        description: Optional terminal non-success Delivery run id containing the exact recovery authorization/checkpoint.
        required: false
        type: string
      resume_delivery_attempt:
        description: Prior terminal non-success Delivery attempt containing the recovery state.
        required: false
        default: "1"
        type: string
    outputs:
      wedding_receipt_sha256:
        description: Exact one-callable completion JSON SHA-256.
        value: ${{ jobs.promote.outputs.wedding_receipt_sha256 }}
      wedding_artifact_id:
        description: Exact one-callable completion artifact.
        value: ${{ jobs.promote.outputs.wedding_artifact_id }}
      wedding_artifact_digest:
        description: Digest of the exact one-callable completion artifact.
        value: ${{ jobs.promote.outputs.wedding_artifact_digest }}

permissions:
  actions: read
  contents: read
  pull-requests: read
  id-token: write

jobs:
  promote:
    if: ${{ !inputs.intake_pr596_release }}
    name: Firebase ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      wedding_receipt_sha256: ${{ steps.wedding_proof.outputs.receipt_sha256 }}
      wedding_artifact_id: ${{ steps.wedding_receipt.outputs.artifact-id }}
      wedding_artifact_digest: ${{ steps.wedding_receipt.outputs.artifact-digest && format('sha256:{0}', steps.wedding_receipt.outputs.artifact-digest) || '' }}
    environment: ${{ inputs.approval_environment || inputs.environment }}
    concurrency:
      group: firebase-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Validate bounded promotion inputs
        env:
          CONTROL_PLANE_SHA: ${{ inputs.control_plane_sha }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          APPROVAL_ENVIRONMENT: ${{ inputs.approval_environment || inputs.environment }}
          RESUME_RUN_ID: ${{ inputs.resume_delivery_run_id }}
          BASE_SHA: ${{ inputs.base_sha }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REQUIRE_CURRENT_MAIN: ${{ inputs.require_current_main }}
          OPERATOR_RELEASE: ${{ inputs.operator_release }}
          WHATSAPP_FIVE_RELEASE: ${{ inputs.whatsapp_five_release }}
          SALES_PR543_RELEASE: ${{ inputs.sales_pr543_release }}
          WEDDING_RELEASE: ${{ inputs.wedding_phone_import_release }}
        run: |
          set -euo pipefail
          if (( GITHUB_RUN_ATTEMPT > 1 )); then
            echo "GitHub partial reruns may reuse stale authorize outputs. Start a fresh manual Delivery recovery run instead."
            exit 64
          fi
          [[ "$CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_ENVIRONMENT" =~ ^(dev|staging|prod)$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_CI_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUIRE_CURRENT_MAIN" =~ ^(true|false)$ ]]
          [[ "$WEDDING_RELEASE" =~ ^(true|false)$ ]]
          [[ "$WHATSAPP_FIVE_RELEASE" =~ ^(true|false)$ ]]
          [[ "$SALES_PR543_RELEASE" =~ ^(true|false)$ ]]
          if [[ "$WHATSAPP_FIVE_RELEASE" == true ]]; then
            test "$OPERATOR_RELEASE" = false
            test "$SALES_PR543_RELEASE" = false
            test "$WEDDING_RELEASE" = false
            test "$DEPLOY_ENVIRONMENT" = prod
            test "$APPROVAL_ENVIRONMENT" = prod
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/selective-backend-release.yml@refs/heads/main"
            test "$SOURCE_SHA" = 4dcd759a261f096bcf37d5f69e19eb625b0199b2
            test "$BASE_SHA" = 5c10b958da8d1774a29990d568a52bc2987b936e
            test "$SOURCE_CI_RUN_ID" = 37511803512
            test "$SOURCE_CI_RUN_ATTEMPT" = 1
            test "$REQUIRE_CURRENT_MAIN" = false
            test -z "$RESUME_RUN_ID"
          fi
          if [[ "$WEDDING_RELEASE" == true ]]; then
            test "$OPERATOR_RELEASE" = false
            test "$WHATSAPP_FIVE_RELEASE" = false
            test "$SALES_PR543_RELEASE" = false
            [[ "$DEPLOY_ENVIRONMENT" =~ ^(dev|prod)$ ]]
            test "$APPROVAL_ENVIRONMENT" = "$DEPLOY_ENVIRONMENT"
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/wedding-phone-import-release.yml@refs/heads/main"
            test "$SOURCE_SHA" = f509e144579403bd3dd66fc39ae0ee821ca0ab30
            test "$BASE_SHA" = f7d2605cabbef640212b88a95002f515028437a3
            test "$SOURCE_CI_RUN_ID" = 37349803226
            test "$SOURCE_CI_RUN_ATTEMPT" = 1
            test "$REQUIRE_CURRENT_MAIN" = false
            test -z "$RESUME_RUN_ID"
          fi
          if [[ "${OPERATOR_RELEASE:-false}" == true ]]; then
            test "$WHATSAPP_FIVE_RELEASE" = false
            test "$SALES_PR543_RELEASE" = false
            test "$DEPLOY_ENVIRONMENT" = prod
            test "$APPROVAL_ENVIRONMENT" = prod
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/selective-backend-release.yml@refs/heads/main"
            test "$SOURCE_SHA" = 656f093d1910afdbe4d93d31565d1782c39aab63
            test "$BASE_SHA" = ea518ad0576829dbc505293d4edbd9f6710a2b8f
            test "$SOURCE_CI_RUN_ID" = 37247348530
            test "$SOURCE_CI_RUN_ATTEMPT" = 1
            test -z "$RESUME_RUN_ID"
          fi
          if [[ "$SALES_PR543_RELEASE" == true ]]; then
            test "$OPERATOR_RELEASE" = false
            test "$WHATSAPP_FIVE_RELEASE" = false
            test "$WEDDING_RELEASE" = false
            test "$DEPLOY_ENVIRONMENT" = prod
            test "$APPROVAL_ENVIRONMENT" = prod
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/selective-backend-release.yml@refs/heads/main"
            test "$SOURCE_SHA" = c0a213bd9663f69ed1f8df3b5bad9284930e5339
            test "$BASE_SHA" = 63f13abe6fbc6051771ea6eeab1d147a956f0be5
            test "$SOURCE_CI_RUN_ID" = 37560236235
            test "$SOURCE_CI_RUN_ATTEMPT" = 1
            test "$REQUIRE_CURRENT_MAIN" = false
          fi
          if [[ "$APPROVAL_ENVIRONMENT" != "$DEPLOY_ENVIRONMENT" ]]; then
            test "$DEPLOY_ENVIRONMENT" = prod
            test "$APPROVAL_ENVIRONMENT" = prod-backend
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/delivery.yml@refs/heads/main"
            [[ "$GITHUB_EVENT_NAME" =~ ^(workflow_run|repository_dispatch)$ ]]
            test "$REQUIRE_CURRENT_MAIN" = false
            test -z "$RESUME_RUN_ID"
          fi

      - name: Require recorded human PROD environment approval for operator release
        if: ${{ inputs.operator_release || inputs.whatsapp_five_release || inputs.sales_pr543_release || (inputs.wedding_phone_import_release && inputs.environment == 'prod') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment="$(gh api "repos/$GITHUB_REPOSITORY/environments/prod")"
          history="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals")"
          jq -en --argjson environment "$environment" --argjson history "$history" '
            ([ $environment.protection_rules[]? | select(.type == "required_reviewers") |
              .reviewers[]? | select(.type == "User") | .reviewer.id ]) as $reviewers |
            ($reviewers | length) > 0 and
            ([ $history[]? | select(any(.environments[]?; .id == $environment.id and .name == "prod")) ]
              | length) > 0 and
            ([ $history[]? | select(any(.environments[]?; .id == $environment.id and .name == "prod")) |
              select(.state != "approved") ] | length) == 0 and
            any($history[]?;
              .state == "approved" and .user.id != null and
              (.user.id as $reviewer_id | ($reviewers | index($reviewer_id)) != null) and
              any(.environments[]?; .id == $environment.id and .name == "prod"))
          ' > /dev/null

      - name: Checkout the immutable Delivery control plane
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.control_plane_sha }}
          fetch-depth: 0

      - name: Checkout the exact CI-approved source as verification input
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: build/delivery/source-checkout

      - name: Require the control plane and ordered source to remain exact
        env:
          CONTROL_PLANE_SHA: ${{ inputs.control_plane_sha }}
          REQUIRE_CURRENT_MAIN: ${{ inputs.require_current_main }}
          SOURCE_CHECKOUT: build/delivery/source-checkout
          SOURCE_SHA: ${{ inputs.source_sha }}
          OPERATOR_RELEASE: ${{ inputs.operator_release }}
          WHATSAPP_FIVE_RELEASE: ${{ inputs.whatsapp_five_release }}
          SALES_PR543_RELEASE: ${{ inputs.sales_pr543_release }}
          SALES_CHECKPOINT_ONLY: ${{ inputs.sales_pr543_release && inputs.resume_delivery_run_id != '' }}
          RESUME_RUN_ID: ${{ inputs.resume_delivery_run_id }}
          RESUME_ATTEMPT: ${{ inputs.resume_delivery_attempt }}
          WEDDING_RELEASE: ${{ inputs.wedding_phone_import_release }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_SHA"
          test "$(git -C "$SOURCE_CHECKOUT" rev-parse HEAD)" = "$SOURCE_SHA"
          git -C "$SOURCE_CHECKOUT" fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          git -C "$SOURCE_CHECKOUT" merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          if [[ "${OPERATOR_RELEASE:-false}" == true ]]; then
            node tool/ci/operator_source_compatibility.mjs "$SOURCE_SHA" \
              "$(git -C "$SOURCE_CHECKOUT" rev-parse refs/remotes/origin/main)" "$SOURCE_CHECKOUT"
          fi
          if [[ "${WEDDING_RELEASE:-false}" == true ]]; then
            node tool/ci/wedding_phone_import_release.mjs source \
              --current-main "$(git -C "$SOURCE_CHECKOUT" rev-parse refs/remotes/origin/main)" \
              --source-root "$SOURCE_CHECKOUT"
          fi
          if [[ "${WHATSAPP_FIVE_RELEASE:-false}" == true ]]; then
            git -C "$SOURCE_CHECKOUT" diff --quiet "$SOURCE_SHA" refs/remotes/origin/main -- \
              functions/src functions/package.json functions/package-lock.json \
              functions/scripts/set-callable-invokers-public.cjs firebase.json .firebaserc
          fi
          if [[ "${SALES_PR543_RELEASE:-false}" == true ]]; then
            source_command=source
            resume_args=()
            if [[ "${SALES_CHECKPOINT_ONLY:-false}" == true ]]; then
              source_command=checkpoint-source
              resume_args=(--run-id "$RESUME_RUN_ID" --run-attempt "$RESUME_ATTEMPT")
            fi
            node tool/ci/selective_backend_release.mjs "$source_command" \
              --source-sha "$SOURCE_SHA" \
              --current-main "$(git -C "$SOURCE_CHECKOUT" rev-parse refs/remotes/origin/main)" \
              --source-root "$SOURCE_CHECKOUT" "${resume_args[@]}"
          fi
          if [[ "$REQUIRE_CURRENT_MAIN" == "true" ]]; then
            test "$(git -C "$SOURCE_CHECKOUT" rev-parse refs/remotes/origin/main)" = "$SOURCE_SHA"
          fi

      - name: Download only the source CI artifact
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_ci_run_id }}
          name: firebase-delivery-${{ inputs.source_sha }}-${{ inputs.source_ci_run_attempt }}
          path: build/delivery/source

      - name: Verify the pinned accepted PROD baseline receipt
        if: ${{ inputs.operator_release || (inputs.wedding_phone_import_release && inputs.environment == 'prod') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11311489270" | jq -e '
            .id == 11311489270 and
            .name == "firebase-checkpoint-prod-catch-dating-app-64e51-647e39e4476693d6565318cb1d5c5223f3b781f7-1" and
            .digest == "sha256:fd120a9874da4c2fb3e0016e7bbdfbef3a8c818bc873f69f403c3575eaa853ff" and
            .expired == false and .workflow_run.id == 37206844099
          ' > /dev/null

      - name: Download the exact accepted PROD baseline checkpoint
        if: ${{ inputs.operator_release || (inputs.wedding_phone_import_release && inputs.environment == 'prod') }}
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 37206844099
          name: firebase-checkpoint-prod-catch-dating-app-64e51-647e39e4476693d6565318cb1d5c5223f3b781f7-1
          path: build/delivery/operator-baseline

      - name: Bind downloaded baseline receipt bytes and completed scope
        if: ${{ inputs.operator_release || (inputs.wedding_phone_import_release && inputs.environment == 'prod') }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            06ab3ea780b0a6ba057b7b3ea29dc8e2dad42a88a070e2755d08ec543eb1f8ba \
            build/delivery/operator-baseline/checkpoint.json \
            9f411302df3f0c913157893ec7aba8dbf3a6172926311f085f617f316c8b2875 \
            build/delivery/operator-baseline/functions-deployment.json | sha256sum --check --status
          jq -e '
            .schema == "catch.delivery-checkpoints/v2" and
            .scope == "firebase:prod:catch-dating-app-64e51" and
            .provenance.sourceSha == "647e39e4476693d6565318cb1d5c5223f3b781f7" and
            any(.stageCheckpoints[]; .stage == "functions" and .postcondition.status == "passed")
          ' build/delivery/operator-baseline/checkpoint.json > /dev/null

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the pinned source-analysis parser
        run: npm ci --ignore-scripts --workspaces=false

      - id: verify
        name: Verify artifact provenance and packaged CI plan before mutation
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ inputs.base_sha }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          OPERATOR_RELEASE: ${{ inputs.operator_release }}
          WHATSAPP_FIVE_RELEASE: ${{ inputs.whatsapp_five_release }}
          SALES_PR543_RELEASE: ${{ inputs.sales_pr543_release }}
          WEDDING_RELEASE: ${{ inputs.wedding_phone_import_release }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          node tool/ci/delivery_core.mjs verify \
            --manifest build/delivery/source/firebase-provenance.json \
            --artifact build/delivery/source/firebase-backend.tar.gz \
            --source-sha "$SOURCE_SHA" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT"
          if [[ "${OPERATOR_RELEASE:-false}" == true ]]; then
            printf '%s  %s\n' \
              8d96961ceca63f4959b25097168ebddf01cb5280568f1b09829421c0ef089af1 \
              build/delivery/source/firebase-backend.tar.gz | sha256sum --check --status
          fi
          if [[ "${WEDDING_RELEASE:-false}" == true ]]; then
            printf '%s  %s\n' \
              b9c6be577d1aab3d95189c104387580baa46e32c6df01b70da62fc63edf18ac9 \
              build/delivery/source/firebase-backend.tar.gz | sha256sum --check --status
          fi
          if [[ "${WHATSAPP_FIVE_RELEASE:-false}" == true ]]; then
            printf '%s  %s\n' \
              8081e1b83a091286b9d34c78f682b3bc985f3fcd4c19cf7c119d7e5238970a88 \
              build/delivery/source/firebase-backend.tar.gz | sha256sum --check --status
          fi
          if [[ "${SALES_PR543_RELEASE:-false}" == true ]]; then
            printf '%s  %s\n' \
              594dcd96b724a1a81c0545a015c6099277e35475d30aa0969e4540b1dee319e5 \
              build/delivery/source/firebase-backend.tar.gz | sha256sum --check --status
          fi
          mkdir -p build/delivery/package
          tar -tzf build/delivery/source/firebase-backend.tar.gz | \
            awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
          tar -xzf build/delivery/source/firebase-backend.tar.gz \
            -C build/delivery/package
          result="$(node tool/ci/package_firebase_delivery.mjs verify \
            --source-root build/delivery/source-checkout \
            --package-dir build/delivery/package \
            --source-sha "$SOURCE_SHA" \
            --base-sha "$BASE_SHA" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --provenance-manifest build/delivery/source/firebase-provenance.json \
            --affected-functions true)"
          reviewed_result="$(node tool/ci/backend_source_review.mjs \
            --source-root build/delivery/source-checkout \
            --repository "$GITHUB_REPOSITORY" <<< "$result")"
          project_id="$(jq -er --arg environment "$DEPLOY_ENVIRONMENT" \
            '.projects[$environment]' build/delivery/package/.firebaserc)"
          control_project_id="$(jq -er --arg environment "$DEPLOY_ENVIRONMENT" \
            '.projects[$environment]' .firebaserc)"
          [[ "$project_id" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          test "$control_project_id" = "$project_id"
          # Keep live approval evidence separate from the deterministic package
          # plan compared again at each deployment boundary.
          printf '%s\n' "$result" > build/delivery/package-plan.json
          if [[ "${OPERATOR_RELEASE:-false}" == true ]]; then
            git -C build/delivery/source-checkout show \
              647e39e4476693d6565318cb1d5c5223f3b781f7:firestore.indexes.json \
              > build/delivery/operator-baseline/indexes.json
            node tool/ci/operator_prod_release.mjs prepare \
              --package-plan build/delivery/package-plan.json \
              --baseline-indexes build/delivery/operator-baseline/indexes.json \
              --candidate-indexes build/delivery/package/firestore.indexes.json \
              --baseline-deployment build/delivery/operator-baseline/functions-deployment.json \
              --output-plan build/delivery/execution-plan.json \
              --output-preparation build/delivery/operator-preparation.json
          elif [[ "${WHATSAPP_FIVE_RELEASE:-false}" == true ]]; then
            node tool/ci/whatsapp_five_release.mjs prepare \
              --manifest build/delivery/source/firebase-provenance.json \
              --package-plan build/delivery/package-plan.json \
              --output build/delivery/execution-plan.json
          elif [[ "${SALES_PR543_RELEASE:-false}" == true ]]; then
            node tool/ci/selective_backend_release.mjs prepare \
              --manifest build/delivery/source/firebase-provenance.json \
              --package-plan build/delivery/package-plan.json \
              --output build/delivery/execution-plan.json
          elif [[ "${WEDDING_RELEASE:-false}" == true ]]; then
            node tool/ci/wedding_phone_import_release.mjs prepare \
              --manifest build/delivery/source/firebase-provenance.json \
              --package-plan build/delivery/package/delivery-plan.json \
              --verified-plan build/delivery/package-plan.json \
              --output build/delivery/execution-plan.json
          else
            cp build/delivery/package-plan.json build/delivery/execution-plan.json
          fi
          jq '.productionPromotion' <<< "$reviewed_result" > build/delivery/production-approval.json
          jq '{stages, targets}' build/delivery/execution-plan.json
          echo "targets=$(jq -r '.targets | map(select(length > 0)) | join(",")' build/delivery/execution-plan.json)" >> "$GITHUB_OUTPUT"
          echo "has_targets=$(jq -r '.targets | any(length > 0)' build/delivery/execution-plan.json)" >> "$GITHUB_OUTPUT"
          echo "has_functions=$(jq -r '.targets | any(startswith("functions:"))' build/delivery/execution-plan.json)" >> "$GITHUB_OUTPUT"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "checkpoint_scope=firebase:${DEPLOY_ENVIRONMENT}:${project_id}" >> "$GITHUB_OUTPUT"

      - name: Verify same-run exact one-callable DEV receipt before PROD authentication
        if: ${{ inputs.wedding_phone_import_release && inputs.environment == 'prod' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.dev_completion_artifact_id }}
          ARTIFACT_DIGEST: ${{ inputs.dev_completion_artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" | jq -e \
            --arg digest "$ARTIFACT_DIGEST" --argjson id "$ARTIFACT_ID" --argjson run "$GITHUB_RUN_ID" \
            '.id == $id and .digest == $digest and .expired == false and
             .workflow_run.id == $run and
             .name == "wedding-phone-import-dev-f509e144579403bd3dd66fc39ae0ee821ca0ab30-1"' > /dev/null

      - name: Download exact same-run one-callable DEV receipt
        if: ${{ inputs.wedding_phone_import_release && inputs.environment == 'prod' }}
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ inputs.dev_completion_artifact_id }}
          path: build/delivery/wedding-dev
          merge-multiple: true

      - name: Verify one-callable DEV package and serving receipt
        if: ${{ inputs.wedding_phone_import_release && inputs.environment == 'prod' }}
        env:
          EXPECTED_RECEIPT_SHA256: ${{ inputs.dev_completion_receipt_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum build/delivery/wedding-dev/wedding-phone-import-receipt.json | cut -d ' ' -f1)" = "$EXPECTED_RECEIPT_SHA256"
          node tool/ci/wedding_phone_import_release.mjs verify-dev \
            --manifest build/delivery/source/firebase-provenance.json \
            --package-plan build/delivery/package/delivery-plan.json \
            --verified-plan build/delivery/package-plan.json \
            --receipt build/delivery/wedding-dev/wedding-phone-import-receipt.json

      - name: Independently verify exact dev completion before production authentication
        if: ${{ inputs.environment == 'prod' && endsWith(github.workflow_ref, '/.github/workflows/delivery.yml@refs/heads/main') }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_COMPLETION_ARTIFACT_ID: ${{ inputs.dev_completion_artifact_id }}
          DEV_COMPLETION_ARTIFACT_DIGEST: ${{ inputs.dev_completion_artifact_digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "$DEV_COMPLETION_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DEV_COMPLETION_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          current_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          source_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID/attempts/$SOURCE_CI_RUN_ATTEMPT")"
          jq -n \
            --arg environment prod \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson repositoryId "$GITHUB_REPOSITORY_ID" \
            --argjson sourceCiWorkflowId "$(jq -er '.workflow_id' <<< "$source_run")" \
            --argjson deliveryWorkflowId "$(jq -er '.workflow_id' <<< "$current_run")" \
            --arg deliveryRunId "$GITHUB_RUN_ID" \
            --arg deliveryRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --argjson deliveryRunNumber "$GITHUB_RUN_NUMBER" \
            '{environment: $environment, repository: $repository, repositoryId: $repositoryId,
              sourceCiWorkflowId: $sourceCiWorkflowId, deliveryWorkflowId: $deliveryWorkflowId,
              deliveryRunId: $deliveryRunId, deliveryRunAttempt: $deliveryRunAttempt,
              deliveryRunNumber: $deliveryRunNumber}' > build/delivery/lane-context.json
          node tool/ci/backend_delivery_lanes.mjs verify-artifact \
            --context build/delivery/lane-context.json \
            --artifact-id "$DEV_COMPLETION_ARTIFACT_ID" \
            --artifact-digest "$DEV_COMPLETION_ARTIFACT_DIGEST" \
            --output build/delivery/dev-completion.json
          node tool/ci/backend_delivery_lanes.mjs verify-package \
            --context build/delivery/lane-context.json \
            --receipt build/delivery/dev-completion.json \
            --source-sha "$SOURCE_SHA" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --base-sha "$BASE_SHA" \
            --package build/delivery/source/firebase-backend.tar.gz \
            --provenance build/delivery/source/firebase-provenance.json \
            --output build/delivery/verified-dev-package.json

      - name: Recompute automatic production eligibility before authentication
        if: ${{ inputs.approval_environment == 'prod-backend' }}
        run: |
          set -euo pipefail
          jq -e '.environment == "prod-backend"' \
            build/delivery/production-approval.json > /dev/null
          jq -e '.stages == ["functions"]' \
            build/delivery/execution-plan.json > /dev/null

      - id: restore
        name: Resolve resumable checkpoint
        env:
          EXPLICIT_ATTEMPT: ${{ inputs.resume_delivery_attempt }}
          EXPLICIT_RUN_ID: ${{ inputs.resume_delivery_run_id }}
          REPOSITORY_ID: ${{ github.repository_id }}
          GH_TOKEN: ${{ github.token }}
          PROJECT_ID: ${{ steps.verify.outputs.project_id }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          SALES_PR543_RELEASE: ${{ inputs.sales_pr543_release }}
        run: |
          set -euo pipefail
          restore_run_id=""
          restore_attempt=""
          explicit=false
          if [[ -n "$EXPLICIT_RUN_ID" ]]; then
            [[ "$EXPLICIT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$EXPLICIT_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            restore_run_id="$EXPLICIT_RUN_ID"
            restore_attempt="$EXPLICIT_ATTEMPT"
            explicit=true
          fi
          artifact_prefix=firebase-checkpoint
          if [[ "$SALES_PR543_RELEASE" == true ]]; then
            artifact_prefix=sales-pr543-firebase-checkpoint
          fi
          artifact_name="${artifact_prefix}-${DEPLOY_ENVIRONMENT}-${PROJECT_ID}-${SOURCE_SHA}-${restore_attempt}"
          should_restore=false
          if [[ -n "$restore_run_id" ]]; then
            if [[ "$explicit" == "true" && "$restore_run_id" == "$GITHUB_RUN_ID" ]]; then
              echo "A Delivery run cannot resume a checkpoint from its current attempt."
              exit 64
            fi
            if [[ "$restore_run_id" != "$GITHUB_RUN_ID" ]]; then
              if [[ "$SALES_PR543_RELEASE" == true ]]; then
                node tool/ci/backend_delivery_lanes.mjs verify-run \
                  --repository "$GITHUB_REPOSITORY" --repository-id "$REPOSITORY_ID" \
                  --run-id "$restore_run_id" --run-attempt "$restore_attempt" \
                  --role selective --output build/delivery/restore-producer.json
              else
                node tool/ci/backend_delivery_lanes.mjs verify-run \
                  --repository "$GITHUB_REPOSITORY" --repository-id "$REPOSITORY_ID" \
                  --run-id "$restore_run_id" --run-attempt "$restore_attempt" \
                  --role delivery --output build/delivery/restore-producer.json
              fi
              jq -e '
                .status == "completed" and
                (.conclusion == "failure" or
                 .conclusion == "cancelled" or
                 .conclusion == "timed_out" or
                 .conclusion == "stale" or
                 .conclusion == "action_required" or
                 .conclusion == "startup_failure")
              ' build/delivery/restore-producer.json > /dev/null
            fi
            matching_artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$restore_run_id/artifacts" \
              --paginate --slurp | jq --arg name "$artifact_name" \
                '[.[].artifacts[] | select(.name == $name)]')"
            count="$(jq 'length' <<< "$matching_artifacts")"
            decision="$(node tool/ci/delivery_core.mjs restore-decision \
              --artifact-count "$count")"
            should_restore="$(jq -r '.shouldRestore' <<< "$decision")"
            if [[ "$SALES_PR543_RELEASE" == true ]]; then
              test "$restore_run_id" = 37576714164
              test "$restore_attempt" = 1
              test "$should_restore" = true
              test "$(jq -er '.[0].id' <<< "$matching_artifacts")" = 11463988816
              test "$(jq -er '.[0].digest' <<< "$matching_artifacts")" = sha256:5c64be7605a46cff585e7d334878d329360aaff253e43f713710f8732c579341
            fi
            if [[ "$should_restore" == "true" ]]; then
              echo "artifact_id=$(jq -er '.[0].id' <<< "$matching_artifacts")" >> "$GITHUB_OUTPUT"
              echo "artifact_digest=$(jq -er '.[0].digest' <<< "$matching_artifacts")" >> "$GITHUB_OUTPUT"
            fi
            if [[ "$(jq -r '.restartFromFirstStage' <<< "$decision")" == "true" ]]; then
              echo "No exact checkpoint exists for $DEPLOY_ENVIRONMENT; restarting its same verified package at the first stage."
            fi
            if [[ "$SALES_PR543_RELEASE" == true ]]; then
              before_name="sales-pr543-before-${SOURCE_SHA}-${restore_attempt}"
              before_artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$restore_run_id/artifacts" \
                --paginate --slurp | jq --arg name "$before_name" \
                  '[.[].artifacts[] | select(.name == $name)]')"
              test "$(jq 'length' <<< "$before_artifacts")" = 1
              test "$(jq -er '.[0].id' <<< "$before_artifacts")" = 11463298945
              test "$(jq -er '.[0].digest' <<< "$before_artifacts")" = sha256:e557f76637abc20b097ba1d2451d626f9f044ad2f9eff5482e5da2726453be49
              echo "sales_before_artifact_id=$(jq -er '.[0].id' <<< "$before_artifacts")" >> "$GITHUB_OUTPUT"
              echo "sales_before_artifact_digest=$(jq -er '.[0].digest' <<< "$before_artifacts")" >> "$GITHUB_OUTPUT"
              echo "sales_before_artifact_name=$before_name" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "run_id=$restore_run_id" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$restore_attempt" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "should_restore=$should_restore" >> "$GITHUB_OUTPUT"

      - name: Download and verify the exact prior checkpoint
        if: ${{ steps.restore.outputs.should_restore == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE_RUN_ID: ${{ steps.restore.outputs.run_id }}
          RESTORE_ATTEMPT: ${{ steps.restore.outputs.run_attempt }}
          ARTIFACT_ID: ${{ steps.restore.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.restore.outputs.artifact_digest }}
          CHECKPOINT_SCOPE: ${{ steps.verify.outputs.checkpoint_scope }}
          PRODUCER_ROLE: ${{ inputs.sales_pr543_release && 'selective' || 'delivery' }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
        run: |
          node tool/ci/firebase_functions_checkpoint.mjs restore \
            --manifest build/delivery/source/firebase-provenance.json \
            --artifact build/delivery/source/firebase-backend.tar.gz \
            --source-sha "$SOURCE_SHA" --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" --scope "$CHECKPOINT_SCOPE" \
            --checkpoint build/delivery/checkpoint/checkpoint.json \
            --repository "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID" \
            --run-id "$RESTORE_RUN_ID" --run-attempt "$RESTORE_ATTEMPT" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" \
            --producer-role "$PRODUCER_ROLE"

      - name: Verify the exact prior Sales before-proof artifact
        if: ${{ inputs.sales_pr543_release && inputs.resume_delivery_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.restore.outputs.sales_before_artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.restore.outputs.sales_before_artifact_digest }}
          ARTIFACT_NAME: ${{ steps.restore.outputs.sales_before_artifact_name }}
          RESTORE_RUN_ID: ${{ steps.restore.outputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" | jq -e \
            --arg digest "$ARTIFACT_DIGEST" --arg name "$ARTIFACT_NAME" \
            --argjson id "$ARTIFACT_ID" --argjson run "$RESTORE_RUN_ID" '
              .id == $id and .name == $name and .digest == $digest and .expired == false and
              .workflow_run.id == $run and .workflow_run.head_branch == "main"
            ' > /dev/null

      - name: Download the exact prior Sales before proof
        if: ${{ inputs.sales_pr543_release && inputs.resume_delivery_run_id != '' }}
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_delivery_run_id }}
          artifact-ids: ${{ steps.restore.outputs.sales_before_artifact_id }}
          path: build/delivery/sales-pr543-restore
          merge-multiple: true

      - name: Restore and validate the original Sales before proof
        if: ${{ inputs.sales_pr543_release && inputs.resume_delivery_run_id != '' }}
        run: |
          set -euo pipefail
          node tool/ci/selective_backend_release.mjs verify-before \
            --manifest build/delivery/source/firebase-provenance.json \
            --package-plan build/delivery/package-plan.json \
            --before build/delivery/sales-pr543-restore/sales-pr543-before.json
          install -m 0600 build/delivery/sales-pr543-restore/sales-pr543-before.json \
            build/delivery/sales-pr543-before.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Install authenticated Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Prove the accepted PROD baseline is still serving
        if: ${{ inputs.operator_release }}
        run: |
          set -euo pipefail
          node tool/ci/operator_prod_release.mjs before \
            --package-plan build/delivery/package-plan.json \
            --baseline-indexes build/delivery/operator-baseline/indexes.json \
            --candidate-indexes build/delivery/package/firestore.indexes.json \
            --baseline-deployment build/delivery/operator-baseline/functions-deployment.json

      - name: Capture the five currently serving PROD identities
        if: ${{ inputs.whatsapp_five_release }}
        run: |
          set -euo pipefail
          node tool/ci/whatsapp_five_release.mjs before \
            --manifest build/delivery/source/firebase-provenance.json \
            --package-plan build/delivery/package-plan.json \
            --output build/delivery/whatsapp-five-before.json

      - name: Prove additive Sales absence and capture existing Sales identities
        if: ${{ inputs.sales_pr543_release && inputs.resume_delivery_run_id == '' }}
        run: |
          set -euo pipefail
          node tool/ci/selective_backend_release.mjs before \
            --manifest build/delivery/source/firebase-provenance.json \
            --package-plan build/delivery/package-plan.json \
            --output build/delivery/sales-pr543-before.json

      - name: Preserve exact Sales before proof for bounded recovery
        if: ${{ inputs.sales_pr543_release }}
        uses: actions/upload-artifact@v7
        with:
          name: sales-pr543-before-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: build/delivery/sales-pr543-before.json
          if-no-files-found: error
          retention-days: 90

      - name: Require existing public invocation on three WhatsApp HTTP entrypoints
        if: ${{ inputs.whatsapp_five_release }}
        run: |
          set -euo pipefail
          umask 077
          : > build/delivery/whatsapp-five-invoker-policy-hashes.txt
          for callable in adminReviewCatchWhatsappInbound adminSendCatchWhatsappReply catchWhatsappWebhook; do
            service="$(jq -er --arg target "functions:$callable" '
              (.selectedTargets | index($target)) as $index |
              .functions[$index].service | split("/")[-1]
            ' build/delivery/whatsapp-five-before.json)"
            policy="$(gcloud run services get-iam-policy "$service" \
              --project catch-dating-app-64e51 --region asia-south1 --format=json)"
            jq -e 'any(.bindings[]?; .role == "roles/run.invoker" and .condition == null and
              ((.members // []) | index("allUsers") != null))' <<< "$policy" > /dev/null
            policy_hash="$(jq -cS 'del(.etag) | .bindings |= ((. // []) | map(.members |= ((. // []) | sort)) |
              sort_by(.role, (.condition.expression // "")))' <<< "$policy" | sha256sum | cut -d ' ' -f1)"
            printf '%s %s\n' "$callable" "$policy_hash" >> build/delivery/whatsapp-five-invoker-policy-hashes.txt
          done

      - name: Snapshot additive callable absence and every retained resource
        if: ${{ inputs.wedding_phone_import_release }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          baseline=()
          if [[ "$DEPLOY_ENVIRONMENT" == prod ]]; then
            baseline=(--baseline-deployment build/delivery/operator-baseline/functions-deployment.json)
          fi
          node tool/ci/wedding_phone_import_release.mjs before \
            --manifest build/delivery/source/firebase-provenance.json \
            --package-plan build/delivery/package/delivery-plan.json \
            --verified-plan build/delivery/package-plan.json \
            --environment "$DEPLOY_ENVIRONMENT" "${baseline[@]}" \
            --output build/delivery/wedding-before.json

      - name: Record names-only Functions parameter provenance
        if: ${{ steps.verify.outputs.has_functions == 'true' }}
        env:
          ALGOLIA_APPLICATION_ID: ${{ vars.ALGOLIA_APPLICATION_ID }}
          RAZORPAY_PUBLIC_KEY_ID: ${{ vars.RAZORPAY_PUBLIC_KEY_ID }}
          FLIGHT_PROVIDER_CONFIG_VERSION: ${{ vars.FLIGHT_PROVIDER_CONFIG_VERSION }}
          FLIGHT_WEBHOOK_BASE_URL: ${{ vars.FLIGHT_WEBHOOK_BASE_URL }}
          FORM_RAZORPAY_PARTNER_CONFIG_VERSION: ${{ vars.FORM_RAZORPAY_PARTNER_CONFIG_VERSION }}
          RAZORPAY_PLATFORM_PAYMENT_CONFIG_VERSION: ${{ vars.RAZORPAY_PLATFORM_PAYMENT_CONFIG_VERSION }}
          META_WHATSAPP_APP_ID: ${{ vars.META_WHATSAPP_APP_ID }}
          META_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID: ${{ vars.META_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID }}
          META_WHATSAPP_GRAPH_VERSION: ${{ vars.META_WHATSAPP_GRAPH_VERSION }}
          META_WHATSAPP_ENABLED: ${{ vars.META_WHATSAPP_ENABLED }}
          CATCH_WHATSAPP_WEBHOOK_ENABLED: ${{ vars.CATCH_WHATSAPP_WEBHOOK_ENABLED }}
          # Non-secret scoped settings only; runtime readiness remains mandatory.
          CATCH_WHATSAPP_RECEIPT_CONSUMERS_ENABLED: ${{ vars.CATCH_WHATSAPP_RECEIPT_CONSUMERS_ENABLED }}
          CATCH_WHATSAPP_REPLIES_ENABLED: ${{ vars.CATCH_WHATSAPP_REPLIES_ENABLED }}
          CATCH_WHATSAPP_ATOMIC_STOP_INGRESS_READY: ${{ vars.CATCH_WHATSAPP_ATOMIC_STOP_INGRESS_READY }}
          CATCH_WHATSAPP_REPLY_ACTOR_UID: ${{ vars.CATCH_WHATSAPP_REPLY_ACTOR_UID }}
          CATCH_WHATSAPP_REPLY_RECIPIENT_UID: ${{ vars.CATCH_WHATSAPP_REPLY_RECIPIENT_UID }}
          CATCH_WHATSAPP_REPLY_RECIPIENT_E164: ${{ vars.CATCH_WHATSAPP_REPLY_RECIPIENT_E164 }}
          CATCH_WHATSAPP_REPLY_CREDENTIAL_VERSION: ${{ vars.CATCH_WHATSAPP_REPLY_CREDENTIAL_VERSION }}
          CATCH_WHATSAPP_REPLY_GRAPH_VERSION: ${{ vars.CATCH_WHATSAPP_REPLY_GRAPH_VERSION }}
          CATCH_WHATSAPP_REPLY_EVIDENCE_SHA256: ${{ vars.CATCH_WHATSAPP_REPLY_EVIDENCE_SHA256 }}
          CATCH_WHATSAPP_WABA_ID: ${{ vars.CATCH_WHATSAPP_WABA_ID }}
          CATCH_WHATSAPP_PHONE_NUMBER_ID: ${{ vars.CATCH_WHATSAPP_PHONE_NUMBER_ID }}
          EVENT_ASSISTANCE_GUEST_KEY_VERSION: ${{ vars.EVENT_ASSISTANCE_GUEST_KEY_VERSION }}
          EVENT_ASSISTANCE_RCS_WEBHOOK_KEY_VERSION: ${{ vars.EVENT_ASSISTANCE_RCS_WEBHOOK_KEY_VERSION }}
          EVENT_ASSISTANCE_RCS_ENABLED: ${{ vars.EVENT_ASSISTANCE_RCS_ENABLED }}
          EVENT_ASSISTANCE_RCS_WEBHOOK_ENABLED: ${{ vars.EVENT_ASSISTANCE_RCS_WEBHOOK_ENABLED }}
          EVENT_ASSISTANCE_SMS_REPORTS_ENABLED: ${{ vars.EVENT_ASSISTANCE_SMS_REPORTS_ENABLED }}
        run: |
          set -euo pipefail
          node tool/firebase/prepare_functions_params_for_deploy.mjs \
            --provenance-only --project "${{ steps.verify.outputs.project_id }}" \
            --source-sha "${{ inputs.source_sha }}" \
            --output build/delivery/params-provenance.json

      - name: Verify environment prerequisites for the approved targets
        if: ${{ steps.verify.outputs.has_targets == 'true' }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_TARGETS: ${{ steps.verify.outputs.targets }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          HAS_FUNCTIONS: ${{ steps.verify.outputs.has_functions }}
        run: |
          set -euo pipefail
          args=(--env "$DEPLOY_ENVIRONMENT" --targets "$DEPLOY_TARGETS"
            --source-root build/delivery/source-checkout --source-sha "$SOURCE_SHA")
          if [[ "$HAS_FUNCTIONS" == "true" ]]; then
            args+=(--phase candidate --params-provenance build/delivery/params-provenance.json
              --write-candidate build/delivery/secret-bindings.json)
          fi
          node tool/firebase/check_environment_readiness.mjs "${args[@]}"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@${{ steps.toolchain.outputs.firebase-tools-version }}

      - name: Create a separate deploy tree
        run: |
          test ! -e build/delivery/deploy-tree
          cp -a build/delivery/package build/delivery/deploy-tree

      - name: Install runtime dependencies only in the deploy tree
        if: ${{ steps.verify.outputs.has_functions == 'true' }}
        run: >-
          npm --prefix build/delivery/deploy-tree/functions ci
          --omit=dev --ignore-scripts

      - name: Reverify every authored byte immediately before deployment
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          OPERATOR_RELEASE: ${{ inputs.operator_release }}
          WHATSAPP_FIVE_RELEASE: ${{ inputs.whatsapp_five_release }}
          SALES_PR543_RELEASE: ${{ inputs.sales_pr543_release }}
          WEDDING_RELEASE: ${{ inputs.wedding_phone_import_release }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          node tool/ci/delivery_core.mjs verify \
            --manifest build/delivery/source/firebase-provenance.json \
            --artifact build/delivery/source/firebase-backend.tar.gz \
            --source-sha "$SOURCE_SHA" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT"
          node tool/ci/package_firebase_delivery.mjs verify \
            --source-root build/delivery/source-checkout \
            --package-dir build/delivery/package \
            --source-sha "$SOURCE_SHA" \
            --base-sha "$BASE_SHA" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --provenance-manifest build/delivery/source/firebase-provenance.json \
            --affected-functions true > build/delivery/reverified-plan.json
          cmp build/delivery/package-plan.json build/delivery/reverified-plan.json
          node tool/ci/package_firebase_delivery.mjs verify \
            --source-root build/delivery/source-checkout \
            --package-dir build/delivery/deploy-tree \
            --source-sha "$SOURCE_SHA" \
            --base-sha "$BASE_SHA" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --provenance-manifest build/delivery/source/firebase-provenance.json \
            --allow-runtime-dependencies true \
            --trusted-package-dir build/delivery/package \
            --affected-functions true > build/delivery/reverified-plan.json
          cmp build/delivery/package-plan.json build/delivery/reverified-plan.json
          if [[ "${OPERATOR_RELEASE:-false}" == true ]]; then
            node tool/ci/operator_prod_release.mjs prepare \
              --package-plan build/delivery/reverified-plan.json \
              --baseline-indexes build/delivery/operator-baseline/indexes.json \
              --candidate-indexes build/delivery/package/firestore.indexes.json \
              --baseline-deployment build/delivery/operator-baseline/functions-deployment.json \
              --output-plan build/delivery/operator-reverified-execution.json \
              --output-preparation build/delivery/operator-reverified-preparation.json
            cmp build/delivery/execution-plan.json build/delivery/operator-reverified-execution.json
            cmp build/delivery/operator-preparation.json build/delivery/operator-reverified-preparation.json
          elif [[ "${WHATSAPP_FIVE_RELEASE:-false}" == true ]]; then
            node tool/ci/whatsapp_five_release.mjs prepare \
              --manifest build/delivery/source/firebase-provenance.json \
              --package-plan build/delivery/reverified-plan.json \
              --output build/delivery/whatsapp-reverified-execution.json
            cmp build/delivery/execution-plan.json build/delivery/whatsapp-reverified-execution.json
          elif [[ "${SALES_PR543_RELEASE:-false}" == true ]]; then
            node tool/ci/selective_backend_release.mjs prepare \
              --manifest build/delivery/source/firebase-provenance.json \
              --package-plan build/delivery/reverified-plan.json \
              --output build/delivery/sales-pr543-reverified-execution.json
            cmp build/delivery/execution-plan.json build/delivery/sales-pr543-reverified-execution.json
          elif [[ "${WEDDING_RELEASE:-false}" == true ]]; then
            node tool/ci/wedding_phone_import_release.mjs prepare \
              --manifest build/delivery/source/firebase-provenance.json \
              --package-plan build/delivery/package/delivery-plan.json \
              --verified-plan build/delivery/package-plan.json \
              --output build/delivery/wedding-reverified-execution.json
            cmp build/delivery/execution-plan.json build/delivery/wedding-reverified-execution.json
          else
            cmp build/delivery/execution-plan.json build/delivery/reverified-plan.json
          fi

      - name: Remove obsolete and identical duplicate indexes from the deploy copy
        run: |
          set -euo pipefail
          indexes=build/delivery/deploy-tree/firestore.indexes.json
          if [[ -f "$indexes" ]]; then
            node tool/firebase/sanitize_firestore_indexes_for_deploy.mjs \
              --indexes "$indexes" \
              --current-indexes firestore.indexes.json
          else
            echo "Verified package has no Firestore index payload; skipping index sanitization."
          fi

      - name: Materialize non-secret Functions params in the deploy copy
        if: ${{ steps.verify.outputs.has_functions == 'true' }}
        env:
          ALGOLIA_APPLICATION_ID: ${{ vars.ALGOLIA_APPLICATION_ID }}
          RAZORPAY_PUBLIC_KEY_ID: ${{ vars.RAZORPAY_PUBLIC_KEY_ID }}
          FLIGHT_PROVIDER_CONFIG_VERSION: ${{ vars.FLIGHT_PROVIDER_CONFIG_VERSION }}
          FLIGHT_WEBHOOK_BASE_URL: ${{ vars.FLIGHT_WEBHOOK_BASE_URL }}
          FORM_RAZORPAY_PARTNER_CONFIG_VERSION: ${{ vars.FORM_RAZORPAY_PARTNER_CONFIG_VERSION }}
          RAZORPAY_PLATFORM_PAYMENT_CONFIG_VERSION: ${{ vars.RAZORPAY_PLATFORM_PAYMENT_CONFIG_VERSION }}
          META_WHATSAPP_APP_ID: ${{ vars.META_WHATSAPP_APP_ID }}
          META_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID: ${{ vars.META_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID }}
          META_WHATSAPP_GRAPH_VERSION: ${{ vars.META_WHATSAPP_GRAPH_VERSION }}
          META_WHATSAPP_ENABLED: ${{ vars.META_WHATSAPP_ENABLED }}
          CATCH_WHATSAPP_WEBHOOK_ENABLED: ${{ vars.CATCH_WHATSAPP_WEBHOOK_ENABLED }}
          # Non-secret scoped settings only; runtime readiness remains mandatory.
          CATCH_WHATSAPP_RECEIPT_CONSUMERS_ENABLED: ${{ vars.CATCH_WHATSAPP_RECEIPT_CONSUMERS_ENABLED }}
          CATCH_WHATSAPP_REPLIES_ENABLED: ${{ vars.CATCH_WHATSAPP_REPLIES_ENABLED }}
          CATCH_WHATSAPP_ATOMIC_STOP_INGRESS_READY: ${{ vars.CATCH_WHATSAPP_ATOMIC_STOP_INGRESS_READY }}
          CATCH_WHATSAPP_REPLY_ACTOR_UID: ${{ vars.CATCH_WHATSAPP_REPLY_ACTOR_UID }}
          CATCH_WHATSAPP_REPLY_RECIPIENT_UID: ${{ vars.CATCH_WHATSAPP_REPLY_RECIPIENT_UID }}
          CATCH_WHATSAPP_REPLY_RECIPIENT_E164: ${{ vars.CATCH_WHATSAPP_REPLY_RECIPIENT_E164 }}
          CATCH_WHATSAPP_REPLY_CREDENTIAL_VERSION: ${{ vars.CATCH_WHATSAPP_REPLY_CREDENTIAL_VERSION }}
          CATCH_WHATSAPP_REPLY_GRAPH_VERSION: ${{ vars.CATCH_WHATSAPP_REPLY_GRAPH_VERSION }}
          CATCH_WHATSAPP_REPLY_EVIDENCE_SHA256: ${{ vars.CATCH_WHATSAPP_REPLY_EVIDENCE_SHA256 }}
          CATCH_WHATSAPP_WABA_ID: ${{ vars.CATCH_WHATSAPP_WABA_ID }}
          CATCH_WHATSAPP_PHONE_NUMBER_ID: ${{ vars.CATCH_WHATSAPP_PHONE_NUMBER_ID }}
          EVENT_ASSISTANCE_GUEST_KEY_VERSION: ${{ vars.EVENT_ASSISTANCE_GUEST_KEY_VERSION }}
          EVENT_ASSISTANCE_RCS_WEBHOOK_KEY_VERSION: ${{ vars.EVENT_ASSISTANCE_RCS_WEBHOOK_KEY_VERSION }}
          EVENT_ASSISTANCE_RCS_ENABLED: ${{ vars.EVENT_ASSISTANCE_RCS_ENABLED }}
          EVENT_ASSISTANCE_RCS_WEBHOOK_ENABLED: ${{ vars.EVENT_ASSISTANCE_RCS_WEBHOOK_ENABLED }}
          EVENT_ASSISTANCE_SMS_REPORTS_ENABLED: ${{ vars.EVENT_ASSISTANCE_SMS_REPORTS_ENABLED }}
        run: |
          set -euo pipefail
          functions_dir=build/delivery/deploy-tree/functions
          if [[ -d "$functions_dir" ]]; then
            node tool/firebase/prepare_functions_params_for_deploy.mjs \
              --functions-dir "$functions_dir" \
              --project "${{ steps.verify.outputs.project_id }}" \
              --source-sha "${{ inputs.source_sha }}" \
              --provenance build/delivery/params-provenance.json
          else
            echo "Verified package has no Functions payload; skipping Functions parameter materialization."
          fi

      - id: whatsapp_params
        name: Prove four Catch gates remain closed in generated deploy params
        if: ${{ inputs.whatsapp_five_release }}
        run: |
          set -euo pipefail
          result="$(node tool/ci/whatsapp_five_release.mjs params \
            --params-file build/delivery/deploy-tree/functions/.env.catch-dating-app-64e51)"
          test "$(jq -r '.catchGatesClosed' <<< "$result")" = true
          echo "sha256=$(jq -er '.paramsSha256' <<< "$result")" >> "$GITHUB_OUTPUT"

      - id: sales_pr543_params
        name: Bind generated Sales deploy params without reading values
        if: ${{ inputs.sales_pr543_release }}
        run: |
          set -euo pipefail
          result="$(node tool/ci/selective_backend_release.mjs params \
            --params-file build/delivery/deploy-tree/functions/.env.catch-dating-app-64e51)"
          echo "sha256=$(jq -er '.paramsSha256' <<< "$result")" >> "$GITHUB_OUTPUT"

      - name: Gate Functions param coverage before any deploy mutation
        if: ${{ steps.verify.outputs.has_functions == 'true' }}
        env:
          PROJECT_ID: ${{ steps.verify.outputs.project_id }}
        run: |
          set -euo pipefail
          functions_dir=build/delivery/deploy-tree/functions
          if [[ -d "$functions_dir" ]]; then
            node tool/firebase/check_functions_params_coverage.mjs \
              --functions-dir build/delivery/source-checkout/functions \
              --env-file "$functions_dir/.env.$PROJECT_ID"
          else
            echo "Verified package has no Functions payload; skipping Functions parameter coverage gate."
          fi

      - name: Preflight the whole backend plan before any deployment
        if: ${{ steps.verify.outputs.has_functions == 'true' }}
        env:
          CATCH_DEPLOY_ALLOW_BEHIND: ${{ inputs.require_current_main && '0' || '1' }}
          CATCH_DELIVERY_FUNCTIONS_DIR: build/delivery/deploy-tree/functions
          CATCH_FIREBASE_SOURCE_ROOT: build/delivery/source-checkout
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_TARGETS: ${{ steps.verify.outputs.targets }}
        run: >-
          ./tool/deploy_firebase_targets.sh --preflight
          "$DEPLOY_ENVIRONMENT" "$DEPLOY_TARGETS"

      - id: promote
        name: Resume ordered backend stages
        env:
          CHECKPOINT: build/delivery/checkpoint/checkpoint.json
          CHECKPOINT_SCOPE: ${{ steps.verify.outputs.checkpoint_scope }}
          CONTROL_PLANE_SHA: ${{ inputs.control_plane_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DELIVERY_FUNCTIONS_DIR: build/delivery/deploy-tree/functions
          PACKAGE_DIR: build/delivery/deploy-tree
          PROJECT_ID: ${{ steps.verify.outputs.project_id }}
          REQUIRE_CURRENT_MAIN: ${{ inputs.require_current_main }}
          SOURCE_CHECKOUT: build/delivery/source-checkout
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          OPERATOR_RELEASE: ${{ inputs.operator_release }}
          WHATSAPP_FIVE_RELEASE: ${{ inputs.whatsapp_five_release }}
          SALES_PR543_RELEASE: ${{ inputs.sales_pr543_release }}
          SALES_CHECKPOINT_ONLY: ${{ inputs.sales_pr543_release && inputs.resume_delivery_run_id != '' }}
          RESUME_RUN_ID: ${{ inputs.resume_delivery_run_id }}
          RESUME_ATTEMPT: ${{ inputs.resume_delivery_attempt }}
          WEDDING_RELEASE: ${{ inputs.wedding_phone_import_release }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$CHECKPOINT")"
          while true; do
            next="$(node tool/ci/delivery_core.mjs next \
              --manifest build/delivery/source/firebase-provenance.json \
              --artifact build/delivery/source/firebase-backend.tar.gz \
              --source-sha "$SOURCE_SHA" \
              --ci-run-id "$SOURCE_CI_RUN_ID" \
              --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
              --scope "$CHECKPOINT_SCOPE" \
              --checkpoint "$CHECKPOINT")"
            if [[ "$(jq -r '.next.complete' <<< "$next")" == "true" ]]; then
              break
            fi
            stage="$(jq -er '.next.stage' <<< "$next")"
            target="$(jq -er --arg stage "$stage" '
              .stages as $stages |
              .targets as $targets |
              ($stages | index($stage)) as $index |
              select($index != null) |
              $targets[$index]
            ' build/delivery/execution-plan.json)"
            case "$stage" in
              firestore-indexes|functions|firestore-rules|storage-rules) ;;
              *) echo "Refusing unknown delivery stage: $stage"; exit 64 ;;
            esac
            stage_status=0
            failure_detail="Firebase CLI stage failed; safe to resume this stage."
            # The local-checkout guard cannot define freshness for an immutable
            # ordered artifact. Revalidate both pinned ancestors at every stage;
            # current-main snapshot recovery retains its stricter equality gate.
            test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_SHA"
            test "$(git -C "$SOURCE_CHECKOUT" rev-parse HEAD)" = "$SOURCE_SHA"
            git -C "$SOURCE_CHECKOUT" fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
            git -C "$SOURCE_CHECKOUT" merge-base --is-ancestor "$CONTROL_PLANE_SHA" refs/remotes/origin/main
            git -C "$SOURCE_CHECKOUT" merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
            if [[ "${OPERATOR_RELEASE:-false}" == true ]]; then
              node tool/ci/operator_source_compatibility.mjs "$SOURCE_SHA" \
                "$(git -C "$SOURCE_CHECKOUT" rev-parse refs/remotes/origin/main)" "$SOURCE_CHECKOUT"
              node tool/ci/operator_prod_release.mjs before \
                --package-plan build/delivery/package-plan.json \
                --baseline-indexes build/delivery/operator-baseline/indexes.json \
                --candidate-indexes build/delivery/package/firestore.indexes.json \
                --baseline-deployment build/delivery/operator-baseline/functions-deployment.json
            fi
            if [[ "${WEDDING_RELEASE:-false}" == true ]]; then
            node tool/ci/wedding_phone_import_release.mjs source \
              --current-main "$(git -C "$SOURCE_CHECKOUT" rev-parse refs/remotes/origin/main)" \
              --source-root "$SOURCE_CHECKOUT"
          fi
            if [[ "${WHATSAPP_FIVE_RELEASE:-false}" == true ]]; then
              git -C "$SOURCE_CHECKOUT" diff --quiet "$SOURCE_SHA" refs/remotes/origin/main -- \
                functions/src functions/package.json functions/package-lock.json \
                functions/scripts/set-callable-invokers-public.cjs firebase.json .firebaserc
              test "$stage" = functions
              test "$target" = 'functions:adminReviewCatchWhatsappInbound,functions:adminSendCatchWhatsappReply,functions:catchWhatsappWebhook,functions:onCatchWhatsappReplyOperationWritten,functions:onCatchWhatsappWebhookEventCreated'
              result="$(node tool/ci/whatsapp_five_release.mjs params \
                --params-file "$DELIVERY_FUNCTIONS_DIR/.env.$PROJECT_ID")"
              test "$(jq -r '.catchGatesClosed' <<< "$result")" = true
              test "$(jq -er '.paramsSha256' <<< "$result")" = "${{ steps.whatsapp_params.outputs.sha256 }}"
            fi
            if [[ "${SALES_PR543_RELEASE:-false}" == true ]]; then
              source_command=source
              resume_args=()
              if [[ "$SALES_CHECKPOINT_ONLY" == true ]]; then
                source_command=checkpoint-source
                resume_args=(--run-id "$RESUME_RUN_ID" --run-attempt "$RESUME_ATTEMPT")
              fi
              node tool/ci/selective_backend_release.mjs "$source_command" \
                --source-sha "$SOURCE_SHA" \
                --current-main "$(git -C "$SOURCE_CHECKOUT" rev-parse refs/remotes/origin/main)" \
                --source-root "$SOURCE_CHECKOUT" "${resume_args[@]}"
              node tool/ci/selective_backend_release.mjs stage --stage "$stage" --target "$target" > /dev/null
              if [[ "$stage" == functions ]]; then
                result="$(node tool/ci/selective_backend_release.mjs params \
                  --params-file "$DELIVERY_FUNCTIONS_DIR/.env.$PROJECT_ID")"
                test "$(jq -er '.paramsSha256' <<< "$result")" = "${{ steps.sales_pr543_params.outputs.sha256 }}"
              fi
            fi
            if [[ "${WEDDING_RELEASE:-false}" == true ]]; then
              test "$stage" = functions
              test "$target" = functions:importWeddingPhoneContacts
              baseline=()
              if [[ "$DEPLOY_ENVIRONMENT" == prod ]]; then
                baseline=(--baseline-deployment build/delivery/operator-baseline/functions-deployment.json)
              fi
              node tool/ci/wedding_phone_import_release.mjs unchanged \
                --manifest build/delivery/source/firebase-provenance.json \
                --package-plan build/delivery/package/delivery-plan.json \
                --verified-plan build/delivery/package-plan.json \
                --environment "$DEPLOY_ENVIRONMENT" "${baseline[@]}" \
                --before build/delivery/wedding-before.json
            fi
            if [[ "$REQUIRE_CURRENT_MAIN" == "true" ]]; then
              test "$(git -C "$SOURCE_CHECKOUT" rev-parse refs/remotes/origin/main)" = "$SOURCE_SHA"
              export CATCH_DEPLOY_ALLOW_BEHIND=0
            else
              export CATCH_DEPLOY_ALLOW_BEHIND=1
            fi
            deploy_args=(--config "$PACKAGE_DIR/firebase.json")
            if [[ "$stage" == "functions" && -n "$target" ]]; then
              IFS=',' read -r -a explicit_function_targets <<< "$target"
              (( "${#explicit_function_targets[@]}" > 0 ))
              for function_target in "${explicit_function_targets[@]}"; do
                if [[ ! "$function_target" =~ ^functions:[A-Za-z][A-Za-z0-9_-]*$ ]]; then
                  echo "Refusing --force without an exact named Function target: $function_target"
                  exit 64
                fi
              done
              # Firebase requires this acknowledgement when an exact target
              # newly enables retry-on-failure. Exact selectors keep unrelated
              # and environment-only Functions outside the mutation set.
              if [[ "${WEDDING_RELEASE:-false}" != true ]]; then
                deploy_args+=(--force)
              fi
            fi
            if [[ "$SALES_CHECKPOINT_ONLY" == true ]]; then
              # This branch has no Functions deploy or callable IAM repair.
              # Repeat all live checks even when Functions was already passed.
              node tool/ci/selective_backend_release.mjs checkpoint-only \
                --manifest build/delivery/source/firebase-provenance.json \
                --package-plan build/delivery/package-plan.json \
                --before build/delivery/sales-pr543-before.json \
                --deployment build/delivery/checkpoint/functions-deployment.json \
                --checkpoint "$CHECKPOINT" --stage "$stage" \
                --params-file "$DELIVERY_FUNCTIONS_DIR/.env.$PROJECT_ID" \
                --source-root "$SOURCE_CHECKOUT" --package-root "$PACKAGE_DIR" \
                --current-main "$(git -C "$SOURCE_CHECKOUT" rev-parse refs/remotes/origin/main)" \
                --run-id "$RESUME_RUN_ID" --run-attempt "$RESUME_ATTEMPT" \
                --readiness-candidate build/delivery/secret-bindings.json
              if [[ "$stage" == firestore-rules ]]; then
                test "$target" = firestore:rules
                CATCH_FIREBASE_SOURCE_ROOT="$SOURCE_CHECKOUT" \
                  ./tool/deploy_firebase_targets.sh "$DEPLOY_ENVIRONMENT" firestore:rules \
                    "${deploy_args[@]}" || stage_status=$?
              else
                test "$stage" = functions
                node tool/ci/selective_backend_release.mjs stage --stage functions --target "$target" > /dev/null
              fi
            elif [[ "$stage" == "functions" && -z "$target" ]]; then
              echo "No Functions runtime dependency changed; recording the verified no-op stage."
            elif [[ "$stage" == "functions" ]]; then
              proof_args=(
                --manifest build/delivery/source/firebase-provenance.json
                --artifact build/delivery/source/firebase-backend.tar.gz
                --source-sha "$SOURCE_SHA" --ci-run-id "$SOURCE_CI_RUN_ID"
                --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" --scope "$CHECKPOINT_SCOPE"
                --checkpoint "$CHECKPOINT" --base-sha "$BASE_SHA" --targets "$target"
                --params-file "$DELIVERY_FUNCTIONS_DIR/.env.$PROJECT_ID"
              )
              recovery="$(node tool/ci/firebase_functions_checkpoint.mjs verify "${proof_args[@]}")"
              postconditions_only="$(jq -r '.postconditionsOnly | select(type == "boolean")' <<< "$recovery")"
              if [[ "$postconditions_only" != "true" && "$postconditions_only" != "false" ]]; then
                echo "Invalid Functions checkpoint recovery decision."
                exit 64
              fi
              if [[ "$postconditions_only" == "false" ]]; then
                CATCH_DELIVERY_FUNCTIONS_DIR="$DELIVERY_FUNCTIONS_DIR" \
                  CATCH_FIREBASE_SOURCE_ROOT="$SOURCE_CHECKOUT" \
                  ./tool/deploy_firebase_targets.sh --functions-deploy-only \
                    "$DEPLOY_ENVIRONMENT" "$target" "${deploy_args[@]}" || stage_status=$?
                if [[ "$stage_status" == "0" ]]; then
                  node tool/ci/firebase_functions_checkpoint.mjs record "${proof_args[@]}" || stage_status=$?
                fi
              else
                echo "Exact Functions deployment is still active; resuming callable permissions and parity only."
              fi
              # The additive caller requires the source-declared public IAM
              # policy already established by Firebase deployment. It never runs
              # an IAM repair command or relaxes ordinary full parity.
              if [[ "$stage_status" == "0" && "${WEDDING_RELEASE:-false}" != true && "${WHATSAPP_FIVE_RELEASE:-false}" != true ]]; then
                CATCH_DELIVERY_FUNCTIONS_DIR="$DELIVERY_FUNCTIONS_DIR" \
                  CATCH_FIREBASE_SOURCE_ROOT="$SOURCE_CHECKOUT" \
                  ./tool/deploy_firebase_targets.sh --functions-postconditions-only \
                    "$DEPLOY_ENVIRONMENT" "$target" "${deploy_args[@]}" || stage_status=$?
              fi
              if [[ "$stage_status" == "0" && "${WHATSAPP_FIVE_RELEASE:-false}" == true ]]; then
                # The five-selector rollout has no authority to repair IAM or
                # assert full-export parity. Check the three existing HTTP
                # entrypoints without writing Cloud Run policy.
                for callable in adminReviewCatchWhatsappInbound adminSendCatchWhatsappReply catchWhatsappWebhook; do
                  service="$(jq -er --arg target "functions:$callable" '
                    (.targets | index($target)) as $index |
                    .functions[$index].service | split("/")[-1]
                  ' build/delivery/checkpoint/functions-deployment.json)" || stage_status=$?
                  if [[ "$stage_status" != "0" ]]; then break; fi
                  policy="$(gcloud run services get-iam-policy "$service" \
                    --project "$PROJECT_ID" --region asia-south1 --format=json)" || stage_status=$?
                  if [[ "$stage_status" != "0" ]]; then break; fi
                  jq -e 'any(.bindings[]?; .role == "roles/run.invoker" and .condition == null and
                    ((.members // []) | index("allUsers") != null))' <<< "$policy" > /dev/null || stage_status=$?
                  if [[ "$stage_status" != "0" ]]; then break; fi
                  policy_hash="$(jq -cS 'del(.etag) | .bindings |= ((. // []) | map(.members |= ((. // []) | sort)) |
                    sort_by(.role, (.condition.expression // "")))' <<< "$policy" | sha256sum | cut -d ' ' -f1)" || stage_status=$?
                  if [[ "$stage_status" != "0" ]]; then break; fi
                  expected_hash="$(awk -v target="$callable" '$1 == target {print $2}' \
                    build/delivery/whatsapp-five-invoker-policy-hashes.txt)"
                  test "$policy_hash" = "$expected_hash" || stage_status=$?
                  if [[ "$stage_status" != "0" ]]; then break; fi
                done
              fi
              if [[ "$stage_status" == "0" ]]; then
                node tool/firebase/check_environment_readiness.mjs \
                  --env "$DEPLOY_ENVIRONMENT" --targets "$target" \
                  --source-root "$SOURCE_CHECKOUT" --source-sha "$SOURCE_SHA" \
                  --candidate build/delivery/secret-bindings.json --phase deployed || stage_status=$?
              fi
              failure_detail="Functions deployment or postcondition failed; exact recovery proof determines the next subphase."
            else
              CATCH_DELIVERY_FUNCTIONS_DIR="$DELIVERY_FUNCTIONS_DIR" \
                CATCH_FIREBASE_SOURCE_ROOT="$SOURCE_CHECKOUT" \
                ./tool/deploy_firebase_targets.sh \
                  "$DEPLOY_ENVIRONMENT" "$target" \
                  "${deploy_args[@]}" || stage_status=$?
            fi
            if [[ "$stage_status" == "0" && "$stage" == "firestore-indexes" ]]; then
              node tool/firebase/wait_firestore_indexes_ready.mjs \
                --indexes "$PACKAGE_DIR/firestore.indexes.json" \
                --project "$PROJECT_ID" \
                --timeout-seconds 1800 \
                --poll-seconds 20 || stage_status=$?
              failure_detail="Firestore composite indexes did not reach READY; safe to resume the index stage."
            fi
            if [[ "$stage_status" == "0" ]]; then
              node tool/ci/delivery_core.mjs checkpoint \
                --manifest build/delivery/source/firebase-provenance.json \
                --artifact build/delivery/source/firebase-backend.tar.gz \
                --source-sha "$SOURCE_SHA" \
                --ci-run-id "$SOURCE_CI_RUN_ID" \
                --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
                --scope "$CHECKPOINT_SCOPE" \
                --checkpoint "$CHECKPOINT" \
                --stage "$stage" \
                --status passed
            else
              node tool/ci/delivery_core.mjs checkpoint \
                --manifest build/delivery/source/firebase-provenance.json \
                --artifact build/delivery/source/firebase-backend.tar.gz \
                --source-sha "$SOURCE_SHA" \
                --ci-run-id "$SOURCE_CI_RUN_ID" \
                --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
                --scope "$CHECKPOINT_SCOPE" \
                --checkpoint "$CHECKPOINT" \
                --stage "$stage" \
                --status failed \
                --detail "$failure_detail"
              exit "$stage_status"
            fi
          done

      - name: Verify deployed configuration including restored completed Functions
        if: ${{ steps.verify.outputs.has_functions == 'true' }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_TARGETS: ${{ steps.verify.outputs.targets }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          CHECKPOINT_SCOPE: ${{ steps.verify.outputs.checkpoint_scope }}
          PROJECT_ID: ${{ steps.verify.outputs.project_id }}
        run: |
          set -euo pipefail
          function_targets="$(jq -er '.stages as $stages | .targets as $targets |
            ($stages | index("functions")) as $index | select($index != null) |
            $targets[$index] | select(length > 0)' build/delivery/execution-plan.json)"
          proof="$(node tool/ci/firebase_functions_checkpoint.mjs verify-completed \
            --manifest build/delivery/source/firebase-provenance.json \
            --artifact build/delivery/source/firebase-backend.tar.gz \
            --source-sha "$SOURCE_SHA" --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" --scope "$CHECKPOINT_SCOPE" \
            --checkpoint build/delivery/checkpoint/checkpoint.json \
            --base-sha "$BASE_SHA" --targets "$function_targets" \
            --params-file "build/delivery/deploy-tree/functions/.env.$PROJECT_ID")"
          test "$(jq -r '.verifiedCompleted' <<< "$proof")" = "true"
          node tool/firebase/check_environment_readiness.mjs \
            --env "$DEPLOY_ENVIRONMENT" --targets "$DEPLOY_TARGETS" \
            --source-root build/delivery/source-checkout --source-sha "$SOURCE_SHA" \
            --candidate build/delivery/secret-bindings.json --phase deployed

      - name: Prove exact-five serving revisions and selected-only completion
        if: ${{ inputs.whatsapp_five_release }}
        run: |
          set -euo pipefail
          node tool/ci/whatsapp_five_release.mjs complete \
            --manifest build/delivery/source/firebase-provenance.json \
            --package-plan build/delivery/package-plan.json \
            --before build/delivery/whatsapp-five-before.json \
            --deployment build/delivery/checkpoint/functions-deployment.json \
            --params-sha256 '${{ steps.whatsapp_params.outputs.sha256 }}' \
            --output build/delivery/whatsapp-five-selected-receipt.json

      - name: Upload selected-only five-Function receipt
        if: ${{ inputs.whatsapp_five_release && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: whatsapp-five-selected-prod-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: build/delivery/whatsapp-five-selected-receipt.json
          if-no-files-found: error
          retention-days: 90

      - id: wedding_proof
        name: Prove exact-one serving identity and unchanged retained state
        if: ${{ inputs.wedding_phone_import_release }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          PROJECT_ID: ${{ steps.verify.outputs.project_id }}
        run: |
          set -euo pipefail
          node tool/ci/wedding_phone_import_release.mjs complete \
            --manifest build/delivery/source/firebase-provenance.json \
            --package-plan build/delivery/package/delivery-plan.json \
            --verified-plan build/delivery/package-plan.json \
            --environment "$DEPLOY_ENVIRONMENT" \
            --before build/delivery/wedding-before.json \
            --deployment build/delivery/checkpoint/functions-deployment.json \
            --params-file "build/delivery/deploy-tree/functions/.env.$PROJECT_ID" \
            --output build/delivery/wedding-phone-import-receipt.json
          echo "receipt_sha256=$(sha256sum build/delivery/wedding-phone-import-receipt.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - id: wedding_receipt
        name: Upload isolated exact-one completion receipt
        if: ${{ inputs.wedding_phone_import_release && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: wedding-phone-import-${{ inputs.environment }}-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: build/delivery/wedding-phone-import-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify active rules match the exact approved source
        if: ${{ !inputs.wedding_phone_import_release && !inputs.whatsapp_five_release }}
        env:
          PROJECT_ID: ${{ steps.verify.outputs.project_id }}
        run: >-
          node tool/firebase/check_rules_deployment_drift.mjs
          --project "$PROJECT_ID"
          --repo-root build/delivery/source-checkout
          --wait-seconds 180
          --poll-seconds 10

      - name: Prove exact Sales serving revisions and rules completion
        if: ${{ inputs.sales_pr543_release }}
        run: |
          set -euo pipefail
          node tool/ci/selective_backend_release.mjs complete \
            --manifest build/delivery/source/firebase-provenance.json \
            --package-plan build/delivery/package-plan.json \
            --before build/delivery/sales-pr543-before.json \
            --deployment build/delivery/checkpoint/functions-deployment.json \
            --params-sha256 '${{ steps.sales_pr543_params.outputs.sha256 }}' \
            --output build/delivery/sales-pr543-selected-receipt.json

      - name: Upload exact Sales and rules completion receipt
        if: ${{ inputs.sales_pr543_release && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: sales-pr543-selected-prod-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: build/delivery/sales-pr543-selected-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Prove mixed-source PROD serving state without restamping retained Functions
        if: ${{ inputs.operator_release }}
        run: |
          set -euo pipefail
          node tool/ci/operator_prod_release.mjs complete \
            --package-plan build/delivery/package-plan.json \
            --baseline-indexes build/delivery/operator-baseline/indexes.json \
            --candidate-indexes build/delivery/package/firestore.indexes.json \
            --baseline-deployment build/delivery/operator-baseline/functions-deployment.json \
            --candidate-deployment build/delivery/checkpoint/functions-deployment.json \
            --output build/delivery/operator-prod-receipt.json

      - name: Upload exact selective PROD receipt
        if: ${{ inputs.operator_release && hashFiles('build/delivery/operator-prod-receipt.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: operator-prod-selective-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: build/delivery/operator-prod-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload resumable checkpoint
        if: ${{ always() && hashFiles('build/delivery/checkpoint/checkpoint.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.sales_pr543_release && 'sales-pr543-firebase-checkpoint' || inputs.whatsapp_five_release && 'whatsapp-five-firebase-checkpoint' || inputs.wedding_phone_import_release && 'wedding-firebase-checkpoint' || inputs.operator_release && 'operator-firebase-checkpoint' || 'firebase-checkpoint' }}-${{ inputs.environment }}-${{ steps.verify.outputs.project_id }}-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: |
            build/delivery/checkpoint/checkpoint.json
            build/delivery/checkpoint/functions-deployment.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload names-only configuration provenance
        if: ${{ always() && hashFiles('build/delivery/params-provenance.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: firebase-config-provenance-${{ inputs.environment }}-${{ steps.verify.outputs.project_id }}-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: |
            build/delivery/params-provenance.json
            build/delivery/secret-bindings.json
          if-no-files-found: error
          retention-days: 90

  promote-intake-pr596:
    name: Protected PR596 one-Function PROD promotion
    if: ${{ inputs.intake_pr596_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: prod
    concurrency:
      group: firebase-prod
      cancel-in-progress: false
    steps:
      - name: Validate the fixed Intake caller and prohibit recovery or other modes
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/selective-backend-release.yml@refs/heads/main"
          jq -e '
            .intake_pr596_release == true and .operator_release == false and
            .whatsapp_five_release == false and .sales_pr543_release == false and
            .wedding_phone_import_release == false and .require_current_main == false and
            .environment == "prod" and (.approval_environment == "" or .approval_environment == "prod") and
            .control_plane_sha == env.GITHUB_SHA and
            .source_sha == "ceab9d8abf5de7ad383260739032e0e1603d45ff" and
            .base_sha == "6f3532cdff471f8025a03d38516aeada7c207cfc" and
            .source_ci_run_id == "37777899024" and .source_ci_run_attempt == "1" and
            (.resume_delivery_run_id // "") == "" and .resume_delivery_attempt == "1" and
            .dev_completion_artifact_id == "" and .dev_completion_artifact_digest == "" and
            .dev_completion_receipt_sha256 == ""
          ' <<< "$INPUTS" > /dev/null

      - name: Require recorded human PROD environment approval for operator release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment="$(gh api "repos/$GITHUB_REPOSITORY/environments/prod")"
          history="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals")"
          jq -en --argjson environment "$environment" --argjson history "$history" '
            ([ $environment.protection_rules[]? | select(.type == "required_reviewers") |
              .reviewers[]? | select(.type == "User") | .reviewer.id ]) as $reviewers |
            ($reviewers | length) > 0 and
            ([ $history[]? | select(any(.environments[]?; .id == $environment.id and .name == "prod")) ]
              | length) > 0 and
            ([ $history[]? | select(any(.environments[]?; .id == $environment.id and .name == "prod")) |
              select(.state != "approved") ] | length) == 0 and
            any($history[]?;
              .state == "approved" and .user.id != null and
              (.user.id as $reviewer_id | ($reviewers | index($reviewer_id)) != null) and
              any(.environments[]?; .id == $environment.id and .name == "prod"))
          ' > /dev/null


      - name: Checkout the immutable Intake control plane
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.control_plane_sha }}
          fetch-depth: 0
      - name: Checkout the exact CI-approved Intake source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: build/delivery/source-checkout
      - name: Verify current control plane, reviewed source compatibility and immutable producer
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_PLANE_SHA: ${{ inputs.control_plane_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_SHA"
          git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          test "$(git rev-parse refs/remotes/origin/main)" = "$CONTROL_PLANE_SHA"
          test "$(git -C build/delivery/source-checkout rev-parse HEAD)" = ceab9d8abf5de7ad383260739032e0e1603d45ff
          git -C build/delivery/source-checkout fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          node tool/ci/selective_backend_release.mjs intake-source \
            --current-main "$CONTROL_PLANE_SHA" --source-root build/delivery/source-checkout
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/37777899024/attempts/1" | jq -e '
            .status == "completed" and .conclusion == "success" and .event == "push" and
            .head_branch == "main" and .head_sha == "ceab9d8abf5de7ad383260739032e0e1603d45ff" and
            .run_attempt == 1 and .workflow_id == 320377139
          ' > /dev/null
          mkdir -p build/delivery/source
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11551444925" > build/delivery/intake-artifact.json
          node tool/ci/selective_backend_release.mjs intake-artifact --metadata build/delivery/intake-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11551444925/zip" > build/delivery/intake.zip
          node tool/ci/selective_backend_release.mjs intake-archive --archive build/delivery/intake.zip
          test "$(unzip -Z1 build/delivery/intake.zip | LC_ALL=C sort)" = "$(printf '%s\n' firebase-backend.tar.gz firebase-provenance.json)"
          unzip -q build/delivery/intake.zip -d build/delivery/source
          node tool/ci/selective_backend_release.mjs intake-provenance --manifest build/delivery/source/firebase-provenance.json

      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the pinned source-analysis parser
        run: npm ci --ignore-scripts --workspaces=false
      - id: verify
        name: Verify the complete immutable package and derive only the Intake target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tool/ci/delivery_core.mjs verify \
            --manifest build/delivery/source/firebase-provenance.json --artifact build/delivery/source/firebase-backend.tar.gz \
            --source-sha ceab9d8abf5de7ad383260739032e0e1603d45ff --ci-run-id 37777899024 --ci-run-attempt 1
          mkdir -p build/delivery/package
          tar -tzf build/delivery/source/firebase-backend.tar.gz | awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
          tar -xzf build/delivery/source/firebase-backend.tar.gz -C build/delivery/package
          node tool/ci/package_firebase_delivery.mjs verify \
            --source-root build/delivery/source-checkout --package-dir build/delivery/package \
            --source-sha ceab9d8abf5de7ad383260739032e0e1603d45ff --base-sha 6f3532cdff471f8025a03d38516aeada7c207cfc \
            --ci-run-id 37777899024 --ci-run-attempt 1 --provenance-manifest build/delivery/source/firebase-provenance.json \
            --affected-functions true > build/delivery/package-plan.json
          node tool/ci/backend_source_review.mjs --source-root build/delivery/source-checkout \
            --repository "$GITHUB_REPOSITORY" < build/delivery/package-plan.json > build/delivery/intake-source-review.json
          node tool/ci/selective_backend_release.mjs intake-prepare \
            --manifest build/delivery/source/firebase-provenance.json --package-plan build/delivery/package-plan.json \
            --output build/delivery/execution-plan.json
          test "$(jq -er '.projects.prod' build/delivery/package/.firebaserc)" = catch-dating-app-64e51
          test "$(jq -er '.projects.prod' .firebaserc)" = catch-dating-app-64e51
          echo 'project_id=catch-dating-app-64e51' >> "$GITHUB_OUTPUT"
          echo 'targets=functions:adminListIntakeOperations' >> "$GITHUB_OUTPUT"
          echo 'has_targets=true' >> "$GITHUB_OUTPUT"
          echo 'has_functions=true' >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud after protected approval and provenance
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      - name: Install authenticated Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Capture all retained Functions, Extensions and protected configuration
        run: node tool/ci/selective_backend_release.mjs intake-before --output build/delivery/intake-before.json
      - name: Retain the immutable predeployment proof
        uses: actions/upload-artifact@v6
        with:
          name: intake-pr596-before-${{ github.run_id }}-1
          path: build/delivery/intake-before.json
          if-no-files-found: error
          retention-days: 90

      - name: Record names-only Functions parameter provenance
        if: ${{ steps.verify.outputs.has_functions == 'true' }}
        env:
          ALGOLIA_APPLICATION_ID: ${{ vars.ALGOLIA_APPLICATION_ID }}
          RAZORPAY_PUBLIC_KEY_ID: ${{ vars.RAZORPAY_PUBLIC_KEY_ID }}
          FLIGHT_PROVIDER_CONFIG_VERSION: ${{ vars.FLIGHT_PROVIDER_CONFIG_VERSION }}
          FLIGHT_WEBHOOK_BASE_URL: ${{ vars.FLIGHT_WEBHOOK_BASE_URL }}
          FORM_RAZORPAY_PARTNER_CONFIG_VERSION: ${{ vars.FORM_RAZORPAY_PARTNER_CONFIG_VERSION }}
          RAZORPAY_PLATFORM_PAYMENT_CONFIG_VERSION: ${{ vars.RAZORPAY_PLATFORM_PAYMENT_CONFIG_VERSION }}
          META_WHATSAPP_APP_ID: ${{ vars.META_WHATSAPP_APP_ID }}
          META_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID: ${{ vars.META_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID }}
          META_WHATSAPP_GRAPH_VERSION: ${{ vars.META_WHATSAPP_GRAPH_VERSION }}
          META_WHATSAPP_ENABLED: ${{ vars.META_WHATSAPP_ENABLED }}
          CATCH_WHATSAPP_WEBHOOK_ENABLED: ${{ vars.CATCH_WHATSAPP_WEBHOOK_ENABLED }}
          # Non-secret scoped settings only; runtime readiness remains mandatory.
          CATCH_WHATSAPP_RECEIPT_CONSUMERS_ENABLED: ${{ vars.CATCH_WHATSAPP_RECEIPT_CONSUMERS_ENABLED }}
          CATCH_WHATSAPP_REPLIES_ENABLED: ${{ vars.CATCH_WHATSAPP_REPLIES_ENABLED }}
          CATCH_WHATSAPP_ATOMIC_STOP_INGRESS_READY: ${{ vars.CATCH_WHATSAPP_ATOMIC_STOP_INGRESS_READY }}
          CATCH_WHATSAPP_REPLY_ACTOR_UID: ${{ vars.CATCH_WHATSAPP_REPLY_ACTOR_UID }}
          CATCH_WHATSAPP_REPLY_RECIPIENT_UID: ${{ vars.CATCH_WHATSAPP_REPLY_RECIPIENT_UID }}
          CATCH_WHATSAPP_REPLY_RECIPIENT_E164: ${{ vars.CATCH_WHATSAPP_REPLY_RECIPIENT_E164 }}
          CATCH_WHATSAPP_REPLY_CREDENTIAL_VERSION: ${{ vars.CATCH_WHATSAPP_REPLY_CREDENTIAL_VERSION }}
          CATCH_WHATSAPP_REPLY_GRAPH_VERSION: ${{ vars.CATCH_WHATSAPP_REPLY_GRAPH_VERSION }}
          CATCH_WHATSAPP_REPLY_EVIDENCE_SHA256: ${{ vars.CATCH_WHATSAPP_REPLY_EVIDENCE_SHA256 }}
          CATCH_WHATSAPP_WABA_ID: ${{ vars.CATCH_WHATSAPP_WABA_ID }}
          CATCH_WHATSAPP_PHONE_NUMBER_ID: ${{ vars.CATCH_WHATSAPP_PHONE_NUMBER_ID }}
          EVENT_ASSISTANCE_GUEST_KEY_VERSION: ${{ vars.EVENT_ASSISTANCE_GUEST_KEY_VERSION }}
          EVENT_ASSISTANCE_RCS_WEBHOOK_KEY_VERSION: ${{ vars.EVENT_ASSISTANCE_RCS_WEBHOOK_KEY_VERSION }}
          EVENT_ASSISTANCE_RCS_ENABLED: ${{ vars.EVENT_ASSISTANCE_RCS_ENABLED }}
          EVENT_ASSISTANCE_RCS_WEBHOOK_ENABLED: ${{ vars.EVENT_ASSISTANCE_RCS_WEBHOOK_ENABLED }}
          EVENT_ASSISTANCE_SMS_REPORTS_ENABLED: ${{ vars.EVENT_ASSISTANCE_SMS_REPORTS_ENABLED }}
        run: |
          set -euo pipefail
          node tool/firebase/prepare_functions_params_for_deploy.mjs \
            --provenance-only --project "${{ steps.verify.outputs.project_id }}" \
            --source-sha "${{ inputs.source_sha }}" \
