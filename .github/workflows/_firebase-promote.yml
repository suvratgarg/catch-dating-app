        run: |
          set -euo pipefail
          functions_dir=build/delivery/deploy-tree/functions
          if [[ -d "$functions_dir" ]]; then
            node tool/firebase/check_functions_params_coverage.mjs \
              --functions-dir build/delivery/source-checkout/functions \
              --env-file "$functions_dir/.env.$PROJECT_ID"
          else
