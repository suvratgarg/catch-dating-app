name: PR feedback

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-feedback-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  feedback:
    name: Inexpensive source feedback
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tool/harness.mjs
            /tool/harness/verify_local.mjs
            /tool/harness/compare_selectors.mjs
            /tool/ci/main_ci_baseline.mjs
            /tool/ci/toolchain.env
            /tool/harness/component_graph.json
            /tool/harness/lib/component_graph.mjs
            /tool/harness/lib/git_changes.mjs
            /tool/harness/lib/workflow_steps.mjs
            /tool/lib/path_glob.mjs
            /tool/lib/repo_paths.mjs
            /tool/lib/repository_snapshot.mjs
            /tool/lib/tool_impact.mjs
            /tool/lib/tool_platform.mjs
            /tool/run.mjs
            /tool/tools_manifest.json
            /.github/actions/load-toolchain/action.yml
            /tool/design/build_host_feature_responsibilities.mjs
            /design/features/host_feature_responsibilities.json
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Plan affected checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p build/ci
          node tool/harness/compare_selectors.mjs --base "$BASE_SHA" --head HEAD --mode pr > build/ci/selector-comparison.json
          node tool/harness/verify_local.mjs --preflight --base "$BASE_SHA" --head HEAD --mode pr
          echo 'This is inexpensive feedback, not merge approval. Full validation requires the sole ci:admitted label.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload selector comparison
        uses: actions/upload-artifact@v7
        with:
          name: selector-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/selector-comparison.json
          if-no-files-found: error
          retention-days: 7
