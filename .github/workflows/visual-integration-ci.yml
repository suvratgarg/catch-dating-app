name: Flutter Visual & Integration CI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  visual-and-integration:
    name: macOS goldens, Widgetbook corpus & native smoke
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: ./.github/actions/setup-flutter

      - run: flutter config --enable-macos-desktop

      - run: flutter pub get

      - name: Resolve Widgetbook dependencies
        run: (cd widgetbook && flutter pub get)

      - name: Generate Widgetbook directories
        run: (cd widgetbook && dart run build_runner build --delete-conflicting-outputs)

      - name: Package generated Widgetbook directories
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess

          source_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if source_sha != os.environ['SOURCE_SHA']:
              raise SystemExit('Checkout does not match the workflow source SHA')
          output = pathlib.Path('build/ci/generated-widgetbook-directories')
          output.mkdir(parents=True, exist_ok=True)
          generated = pathlib.Path('widgetbook/lib/main.directories.g.dart')
          sources = [pathlib.Path('widgetbook/pubspec.yaml'), pathlib.Path('widgetbook/pubspec.lock')]
          sources += sorted(path for path in pathlib.Path('widgetbook/lib').rglob('*.dart')
                            if not path.name.endswith('.g.dart'))
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          shutil.copy2(generated, output / generated.name)
          manifest = {
              'sourceSha': source_sha,
              'runId': os.environ['RUN_ID'],
              'runAttempt': os.environ['RUN_ATTEMPT'],
              'sourceHashes': {str(path): digest(path) for path in sources},
              'generatedHashes': {str(generated): digest(generated)},
              'kind': 'generated Widgetbook directory; source artifact, not visual proof',
          }
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload generated Widgetbook directories
        uses: actions/upload-artifact@v7
        with:
          name: generated-widgetbook-directories-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: build/ci/generated-widgetbook-directories/
          if-no-files-found: error
          retention-days: 7

      - name: Verify committed Widgetbook directories are current
        run: git diff --exit-code -- widgetbook/lib/main.directories.g.dart

      - name: Widgetbook corpus contract gates
        run: >-
          node tool/run.mjs check
          design:widgetbook-use-case-triage
          design:golden-coverage

      - name: Flutter goldens (0.30% raster tolerance)
        run: flutter test --concurrency=1 test/goldens

      - name: Widgetbook corpus goldens (pass 1)
        run: >-
          (cd widgetbook &&
          flutter test --concurrency=1 test/primitive_goldens_test.dart)

      - name: Widgetbook corpus goldens (pass 2, determinism)
        run: >-
          (cd widgetbook &&
          flutter test --concurrency=1 test/primitive_goldens_test.dart)

      - name: Deterministic app-shell integration suites
        run: bash tool/test_app_shell_integration.sh

      - name: Restore CocoaPods downloads
        uses: ./.github/actions/cache-cocoapods
        with:
          cocoapods-version: ${{ steps.toolchain.outputs.cocoapods-version }}
          lockfiles: macos/Podfile.lock

      - name: Hosted native app-shell smoke
        run: bash tool/test_app_shell_integration.sh macos smoke

      - name: Retain golden failure diffs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: flutter-golden-failures-${{ github.run_id }}
          path: test/goldens/failures/
          if-no-files-found: ignore
          retention-days: 14
