name: Protected Host account-deletion release
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Confirm the fixed reviewed Host deletion source.
        required: true
        type: string
      reason:
        description: Single-line reason for the bounded account-deletion release.
        required: true
        type: string
      confirm_account_deletion:
        description: Deploy only requestAccountDeletion through DEV and protected PROD.
        required: true
        default: false
        type: boolean
permissions:
  actions: read
  contents: read
  pull-requests: read
  id-token: write
concurrency:
  group: backend-delivery
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bind the fixed source and successful immutable producer
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          jq -e '
            (keys | sort) == (["source_sha", "reason", "confirm_account_deletion"] | sort) and
            .source_sha == "171c1cb07e5b8b405904ad8e3504b6e1ea93607b" and .confirm_account_deletion == true and
            (.reason | type) == "string" and (.reason | length) >= 12 and (.reason | length) <= 240 and
            (.reason | test("[\\r\\n]") | not) and (.reason | test("[^\\s]"))
          ' <<< "$INPUTS" > /dev/null
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          node tool/ci/host_deletion_release.mjs source --current-main "$GITHUB_SHA" --source-root .
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39447727509/attempts/1" | jq -e '
            .status == "completed" and .conclusion == "success" and .event == "push" and .head_branch == "main" and
            .head_sha == "171c1cb07e5b8b405904ad8e3504b6e1ea93607b" and .run_attempt == 1 and .workflow_id == 320377139' > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12278103855" > /tmp/host-deletion-artifact.json
          node tool/ci/host_deletion_release.mjs artifact --metadata /tmp/host-deletion-artifact.json
  dev:
    needs: authorize
    uses: ./.github/workflows/_host-deletion-promote.yml
    with:
      environment: dev
      control_plane_sha: ${{ github.sha }}
    secrets: inherit
  prod:
    needs: [authorize, dev]
    if: ${{ needs.dev.result == 'success' }}
    uses: ./.github/workflows/_host-deletion-promote.yml
    with:
      environment: prod
      control_plane_sha: ${{ github.sha }}
      dev_completion_receipt_sha256: ${{ needs.dev.outputs.receipt_sha256 }}
      dev_completion_artifact_id: ${{ needs.dev.outputs.artifact_id }}
      dev_completion_artifact_digest: ${{ needs.dev.outputs.artifact_digest }}
    secrets: inherit
