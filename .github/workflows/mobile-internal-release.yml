name: Mobile Internal Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: catch-mobile-package-producer-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Verify exact successful CI authority
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_ci_workflow_id: ${{ steps.source.outputs.source_ci_workflow_id }}
      source_ci_run_number: ${{ steps.source.outputs.source_ci_run_number }}
      source_ci_run_id: ${{ steps.source.outputs.source_ci_run_id }}
      source_ci_run_attempt: ${{ steps.source.outputs.source_ci_run_attempt }}
      source_ci_utc_date: ${{ steps.source.outputs.source_ci_utc_date }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      release_targets: ${{ steps.source.outputs.release_targets }}
      release_roles: ${{ steps.source.outputs.release_roles }}
      ios_targets: ${{ steps.source.outputs.ios_targets }}
      android_targets: ${{ steps.source.outputs.android_targets }}
      has_ios_targets: ${{ steps.source.outputs.has_ios_targets }}
      has_android_targets: ${{ steps.source.outputs.has_android_targets }}
      release_required: ${{ steps.source.outputs.release_required }}
      source_bundle_name: ${{ steps.source.outputs.source_bundle_name }}
    steps:
      - id: source
        name: Verify CI attempt, authority, and exact impact plan
        env:
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_HEAD_REPOSITORY_ID: ${{ github.event.workflow_run.head_repository.id }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          EVENT_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          for numeric in \
            "$EVENT_RUN_ATTEMPT" \
            "$EVENT_RUN_ID" \
            "$EVENT_RUN_NUMBER" \
            "$EVENT_WORKFLOW_ID" \
            "$REPOSITORY_ID"; do
            [[ "$numeric" =~ ^[1-9][0-9]*$ ]]
          done
          if [[ "$EVENT_CONCLUSION" != "success" || \
                "$EVENT_NAME" != "push" || \
                "$EVENT_HEAD_BRANCH" != "main" || \
                "$EVENT_HEAD_REPOSITORY_ID" != "$REPOSITORY_ID" || \
                ! "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Mobile packages require a successful same-repository main push CI attempt."
            exit 64
          fi

          current_workflow="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml")"
          current_workflow_id="$(jq -er '
            select(
              (.id | type == "number" and . > 0 and floor == .) and
              (.path | split("@")[0]) == ".github/workflows/ci.yml"
            ) | .id
          ' <<< "$current_workflow")"
          test "$EVENT_WORKFLOW_ID" = "$current_workflow_id"

          latest_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EVENT_RUN_ID")"
          if ! jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$EVENT_RUN_ID" \
            --arg source_sha "$EVENT_HEAD_SHA" \
            --argjson run_attempt "$EVENT_RUN_ATTEMPT" \
            --argjson run_number "$EVENT_RUN_NUMBER" \
            --argjson workflow_id "$current_workflow_id" '
              .name == "CI" and
              (.path | split("@")[0]) == ".github/workflows/ci.yml" and
              .workflow_id == $workflow_id and
              .event == "push" and
              .head_branch == "main" and
              .head_repository.full_name == $repository and
              (.id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              .run_number == $run_number and
              .head_sha == $source_sha and
              .status == "completed" and
              .conclusion == "success"
            ' <<< "$latest_run" > /dev/null; then
            echo "The successful historical CI attempt is no longer the current attempt."
            exit 64
          fi

          historical_attempt="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$EVENT_RUN_ID/attempts/$EVENT_RUN_ATTEMPT")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$EVENT_RUN_ID" \
            --arg source_sha "$EVENT_HEAD_SHA" \
            --argjson run_attempt "$EVENT_RUN_ATTEMPT" \
            --argjson run_number "$EVENT_RUN_NUMBER" \
            --argjson workflow_id "$current_workflow_id" '
              .name == "CI" and
              (.path | split("@")[0]) == ".github/workflows/ci.yml" and
              .workflow_id == $workflow_id and
              .event == "push" and
              .head_branch == "main" and
              .head_repository.full_name == $repository and
              (.id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              .run_number == $run_number and
              .head_sha == $source_sha and
              .status == "completed" and
              .conclusion == "success"
            ' <<< "$historical_attempt" > /dev/null
          source_ci_utc_date="$(date -u -d "$(jq -er '.created_at' <<< "$historical_attempt")" +%Y%m%d)"
          [[ "$source_ci_utc_date" =~ ^[0-9]{8}$ ]]

          artifact_pages="$(gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$EVENT_RUN_ID/artifacts?per_page=100")"
          authority_name="harness-success-v3-${current_workflow_id}-${EVENT_RUN_NUMBER}-${EVENT_RUN_ID}-${EVENT_HEAD_SHA}-${EVENT_RUN_ATTEMPT}"
          plan_name="harness-plan-${EVENT_RUN_NUMBER}-${EVENT_RUN_ID}-${EVENT_HEAD_SHA}-${EVENT_RUN_ATTEMPT}"
          for artifact_name in "$authority_name" "$plan_name"; do
            count="$(jq -r --arg name "$artifact_name" \
              '[.[].artifacts[] | select(.expired == false and .name == $name)] | length' \
              <<< "$artifact_pages")"
            if [[ "$count" != "1" ]]; then
              echo "Expected exactly one unexpired source artifact named $artifact_name; found $count."
              exit 64
            fi
          done

          mkdir -p build/mobile/source/authority build/mobile/source/plan
          authority_metadata="$(jq -c --arg name "$authority_name" \
            '[.[].artifacts[] | select(.expired == false and .name == $name)][0]' \
            <<< "$artifact_pages")"
          authority_id="$(jq -er '.id' <<< "$authority_metadata")"
          authority_digest="$(jq -er '.digest' <<< "$authority_metadata")"
          [[ "$authority_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$authority_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$authority_id/zip" \
            > build/mobile/source/authority.zip
          test "sha256:$(sha256sum build/mobile/source/authority.zip | awk '{print $1}')" = \
            "$authority_digest"
          unzip -Z1 build/mobile/source/authority.zip | \
            awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
          unzip -q build/mobile/source/authority.zip -d build/mobile/source/authority
          test "$(find build/mobile/source/authority -type l | wc -l | tr -d ' ')" = "0"
          authority_file=build/mobile/source/authority/ci-delivery-authority.json
          test -f "$authority_file"
          test "$(find build/mobile/source/authority -type f | wc -l | tr -d ' ')" = "1"

          plan_metadata="$(jq -c --arg name "$plan_name" \
            '[.[].artifacts[] | select(.expired == false and .name == $name)][0]' \
            <<< "$artifact_pages")"
          plan_id="$(jq -er '.id' <<< "$plan_metadata")"
          plan_digest="$(jq -er '.digest' <<< "$plan_metadata")"
          [[ "$plan_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$plan_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          expected_package="firebase-delivery-${EVENT_HEAD_SHA}-${EVENT_RUN_ATTEMPT}"
          jq -e \
            --arg authority_name "$authority_name" \
            --arg expected_package "$expected_package" \
            --arg plan_digest "$plan_digest" \
            --arg plan_name "$plan_name" \
            --arg run_attempt "$EVENT_RUN_ATTEMPT" \
            --arg run_id "$EVENT_RUN_ID" \
            --arg source_sha "$EVENT_HEAD_SHA" \
            --argjson plan_id "$plan_id" \
            --argjson run_number "$EVENT_RUN_NUMBER" \
            --argjson workflow_id "$current_workflow_id" '
              (keys | sort) == [
                "deployRequired", "packageArtifact", "planArtifact", "schema",
                "sourceCiRunAttempt", "sourceCiRunId", "sourceCiRunNumber",
                "sourceCiWorkflowId", "sourceSha"
              ] and
              .schema == "catch.ci-delivery-authority/v3" and
              .sourceCiWorkflowId == $workflow_id and
              .sourceCiRunNumber == $run_number and
              .sourceCiRunId == $run_id and
              .sourceCiRunAttempt == $run_attempt and
              .sourceSha == $source_sha and
              (.deployRequired | type == "boolean") and
              (.planArtifact | keys | sort) == ["digest", "id", "name"] and
              .planArtifact.id == $plan_id and
              .planArtifact.name == $plan_name and
              .planArtifact.digest == $plan_digest and
              ((.deployRequired == true and
                (.packageArtifact | keys | sort) == ["digest", "id", "name"] and
                (.packageArtifact.id | type == "number" and . > 0 and floor == .) and
                (.packageArtifact.digest | type == "string" and
                  test("^sha256:[0-9a-f]{64}$")) and
                .packageArtifact.name == $expected_package) or
               (.deployRequired == false and .packageArtifact == null)) and
              $authority_name == (
                "harness-success-v3-" + (.sourceCiWorkflowId | tostring) + "-" +
                (.sourceCiRunNumber | tostring) + "-" + .sourceCiRunId + "-" +
                .sourceSha + "-" + .sourceCiRunAttempt
              )
            ' "$authority_file" > /dev/null

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$plan_id/zip" \
            > build/mobile/source/plan.zip
          test "sha256:$(sha256sum build/mobile/source/plan.zip | awk '{print $1}')" = \
            "$plan_digest"
          unzip -Z1 build/mobile/source/plan.zip | \
            awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
          unzip -q build/mobile/source/plan.zip -d build/mobile/source/plan
          test "$(find build/mobile/source/plan -type l | wc -l | tr -d ' ')" = "0"
          plan_file=build/mobile/source/plan/impact-plan.json
          test -f "$plan_file"
          test "$(find build/mobile/source/plan -type f | wc -l | tr -d ' ')" = "1"
          jq -e \
            --arg run_attempt "$EVENT_RUN_ATTEMPT" \
            --arg run_id "$EVENT_RUN_ID" \
            --arg source_sha "$EVENT_HEAD_SHA" '
              .complete == true and
              .mode == "main" and
              .sourceSha == $source_sha and
              .sourceCiRunId == $run_id and
              .sourceCiRunAttempt == $run_attempt and
              (.operations.releaseTargets | type == "array") and
              (.operations.releaseRoles | type == "array") and
              (.operations.releaseTargets == (.operations.releaseTargets | unique | sort)) and
              (.operations.releaseRoles == (.operations.releaseRoles | unique | sort)) and
              all(.operations.releaseTargets[];
                test("^(consumer|host)-(android|ios)$")) and
              ([.operations.releaseTargets[] | split("-")[0]] | unique | sort) ==
                .operations.releaseRoles
            ' "$plan_file" > /dev/null

          release_targets="$(jq -c '.operations.releaseTargets' "$plan_file")"
          release_roles="$(jq -c '.operations.releaseRoles' "$plan_file")"
          ios_targets="$(jq -c '[.operations.releaseTargets[] | select(endswith("-ios"))]' \
            "$plan_file")"
          android_targets="$(jq -c \
            '[.operations.releaseTargets[] | select(endswith("-android"))]' "$plan_file")"
          source_bundle_name="mobile-source-v1-${EVENT_RUN_ID}-${EVENT_RUN_ATTEMPT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p build/mobile/source-bundle
          cp "$authority_file" build/mobile/source-bundle/ci-delivery-authority.json
          cp "$plan_file" build/mobile/source-bundle/impact-plan.json
          {
            echo "source_ci_workflow_id=$current_workflow_id"
            echo "source_ci_run_number=$EVENT_RUN_NUMBER"
            echo "source_ci_run_id=$EVENT_RUN_ID"
            echo "source_ci_run_attempt=$EVENT_RUN_ATTEMPT"
            echo "source_ci_utc_date=$source_ci_utc_date"
            echo "source_sha=$EVENT_HEAD_SHA"
            echo "release_targets=$release_targets"
            echo "release_roles=$release_roles"
            echo "ios_targets=$ios_targets"
            echo "android_targets=$android_targets"
            echo "has_ios_targets=$([[ "$ios_targets" == "[]" ]] && echo false || echo true)"
            echo "has_android_targets=$([[ "$android_targets" == "[]" ]] && echo false || echo true)"
            echo "release_required=$([[ "$release_targets" == "[]" ]] && echo false || echo true)"
            echo "source_bundle_name=$source_bundle_name"
          } >> "$GITHUB_OUTPUT"

      - name: Upload verified source binding for selected build jobs
        if: ${{ steps.source.outputs.release_required == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.source.outputs.source_bundle_name }}
          path: build/mobile/source-bundle
          if-no-files-found: error
          retention-days: 1

  prod-ios:
    name: Build signed package (${{ matrix.release_target }})
    needs: authorize
    if: ${{ needs.authorize.outputs.has_ios_targets == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        release_target: ${{ fromJSON(needs.authorize.outputs.ios_targets) }}
    runs-on: macos-26
    environment: prod-mobile
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}

      - name: Verify exact source checkout
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Download verified CI source binding
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.authorize.outputs.source_bundle_name }}
          path: build/mobile/source

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - name: Validate installable app-target contract
        run: node tool/run.mjs check platform:app-targets platform:app-package-graphs platform:verify-ios-release-identity

      - id: release-target
        name: Resolve release target
        env:
          RELEASE_TARGET_INPUT: ${{ matrix.release_target }}
          SOURCE_CI_RUN_ATTEMPT: ${{ needs.authorize.outputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_NUMBER: ${{ needs.authorize.outputs.source_ci_run_number }}
          SOURCE_CI_UTC_DATE: ${{ needs.authorize.outputs.source_ci_utc_date }}
        run: |
          set -euo pipefail

          case "$RELEASE_TARGET_INPUT" in
            consumer-ios) app_role=consumer ;;
            host-ios) app_role=host ;;
            *) echo "Unsupported iOS release target: $RELEASE_TARGET_INPUT"; exit 64 ;;
          esac

          target_fields="$(node tool/platform/resolve_app_target.mjs \
            --role "$app_role" \
            --environment prod \
            --fields id,projectRoot,ios.bundleId,ios.configurations.release,ios.scheme,release.appStoreConnectAppId)"
          IFS=$'\t' read -r target_id app_project_root expected_bundle_id ios_configuration ios_scheme app_store_connect_app_id <<< "$target_fields"
          if [[ -z "$target_id" || -z "$app_project_root" || -z "$expected_bundle_id" || -z "$ios_configuration" || -z "$ios_scheme" || -z "$app_store_connect_app_id" ]]; then
            echo "Could not resolve complete prod iOS target metadata for role '$app_role'."
            exit 1
          fi
          archive_name="${target_id//-/_}"
          export_path="build/ios/export/$target_id"

          version_line="$(awk '/^version: / { print $2; exit }' "$app_project_root/pubspec.yaml")"
          build_name="${version_line%%+*}"
          build_number="$(node tool/platform/compute_mobile_build_number.mjs \
            --platform ios \
            --utc-date "$SOURCE_CI_UTC_DATE" \
            --run-number "$SOURCE_CI_RUN_NUMBER" \
            --run-attempt "$SOURCE_CI_RUN_ATTEMPT")"

          {
            echo "APP_ROLE=$app_role"
            echo "RELEASE_TARGET=$RELEASE_TARGET_INPUT"
            echo "APP_PROJECT_ROOT=$app_project_root"
            echo "ARCHIVE_NAME=$archive_name"
            echo "EXPECTED_BUNDLE_ID=$expected_bundle_id"
            echo "EXPORT_PATH=$export_path"
            echo "IOS_CONFIGURATION=$ios_configuration"
            echo "IOS_SCHEME=$ios_scheme"
            echo "APP_STORE_CONNECT_APP_ID=$app_store_connect_app_id"
            echo "FLUTTER_BUILD_NAME=$build_name"
            echo "FLUTTER_BUILD_NUMBER=$build_number"
          } >> "$GITHUB_ENV"

      - name: Verify client callable dependencies
        run: |
          node tool/firebase/check_client_callable_dependencies.mjs \
            --role "$APP_ROLE" \
            --environment prod \
            --verify-live

      - uses: ./.github/actions/setup-flutter

      - run: flutter pub get

      - name: Configure archive path
        run: echo "ARCHIVE_PATH=$RUNNER_TEMP/${ARCHIVE_NAME}.xcarchive" >> "$GITHUB_ENV"

      - name: Write prod iOS Maps key
        env:
          GOOGLE_MAPS_IOS_API_KEY_PROD: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY_PROD }}
        run: ./tool/write_ios_maps_key_xcconfig.sh prod "$APP_PROJECT_ROOT/ios/Flutter/GoogleMapsKeys.xcconfig"

      - name: Install reusable iOS CI development identity
        env:
          IOS_CI_DEVELOPMENT_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CI_DEVELOPMENT_CERTIFICATE_P12_BASE64 }}
          IOS_CI_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CI_DEVELOPMENT_CERTIFICATE_PASSWORD }}
          IOS_CI_DEVELOPMENT_CERTIFICATE_ID: ${{ vars.IOS_CI_DEVELOPMENT_CERTIFICATE_ID }}
          IOS_CI_DEVELOPMENT_CERTIFICATE_SHA256: ${{ vars.IOS_CI_DEVELOPMENT_CERTIFICATE_SHA256 }}
          IOS_CI_DEVELOPMENT_CERTIFICATE_EXPIRES_AT: ${{ vars.IOS_CI_DEVELOPMENT_CERTIFICATE_EXPIRES_AT }}
        run: |
          set -euo pipefail

          keychain_path="$RUNNER_TEMP/catch-ios-ci-signing.keychain-db"
          p12_path="$RUNNER_TEMP/catch-ios-ci-development.p12"
          certificate_pem_path="$RUNNER_TEMP/catch-ios-ci-development.pem"
          {
            echo "IOS_CI_KEYCHAIN_PATH=$keychain_path"
            echo "IOS_CI_P12_PATH=$p12_path"
            echo "IOS_CI_CERTIFICATE_PEM_PATH=$certificate_pem_path"
          } >> "$GITHUB_ENV"

          if [[ -z "${IOS_CI_DEVELOPMENT_CERTIFICATE_P12_BASE64:-}" || \
                -z "${IOS_CI_DEVELOPMENT_CERTIFICATE_PASSWORD:-}" || \
                -z "${IOS_CI_DEVELOPMENT_CERTIFICATE_ID:-}" || \
                -z "${IOS_CI_DEVELOPMENT_CERTIFICATE_SHA256:-}" || \
                -z "${IOS_CI_DEVELOPMENT_CERTIFICATE_EXPIRES_AT:-}" ]]; then
            echo "Missing reusable iOS CI development identity inputs."
            exit 1
          fi

          /usr/bin/printf '%s' "$IOS_CI_DEVELOPMENT_CERTIFICATE_P12_BASE64" | \
            /usr/bin/base64 -D > "$p12_path"
          chmod 600 "$p12_path"

          keychain_password="$(openssl rand -base64 48)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$p12_path" \
            -k "$keychain_path" \
            -f pkcs12 \
            -P "$IOS_CI_DEVELOPMENT_CERTIFICATE_PASSWORD" \
            -x \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          rm -f "$p12_path"

          identity_count="$(security find-identity -v -p codesigning "$keychain_path" | \
            grep -c '"Apple Development:' || true)"
          if [[ "$identity_count" != "1" ]]; then
            echo "Expected exactly one valid Apple Development identity; found $identity_count."
            exit 1
          fi

          security find-certificate -a -p "$keychain_path" > "$certificate_pem_path"
          certificate_subject="$(openssl x509 -in "$certificate_pem_path" -noout -subject -nameopt RFC2253)"
          expected_team_id="$(/usr/libexec/PlistBuddy -c 'Print :teamID' "$APP_PROJECT_ROOT/ios/ExportOptions.prod.plist")"
          if [[ "$certificate_subject" != *"CN=Apple Development:"* || \
                "$certificate_subject" != *"OU=$expected_team_id"* ]]; then
            echo "The reusable identity is not an Apple Development certificate for team $expected_team_id."
            exit 1
          fi

          expected_sha256="$(/usr/bin/printf '%s' "$IOS_CI_DEVELOPMENT_CERTIFICATE_SHA256" | \
            tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          actual_sha256="$(openssl x509 -in "$certificate_pem_path" -noout -fingerprint -sha256 | \
            cut -d= -f2 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$expected_sha256" =~ ^[A-F0-9]{64}$ || "$actual_sha256" != "$expected_sha256" ]]; then
            echo "The reusable iOS CI certificate fingerprint does not match prod-mobile configuration."
            exit 1
          fi

          configured_expiry_epoch="$(node -e '
            const value = Date.parse(process.argv[1]);
            if (!Number.isFinite(value)) process.exit(1);
            process.stdout.write(String(Math.floor(value / 1000)));
          ' "$IOS_CI_DEVELOPMENT_CERTIFICATE_EXPIRES_AT")"
          actual_expiry_epoch="$(node -e '
            const fs = require("node:fs");
            const {X509Certificate} = require("node:crypto");
            const certificate = new X509Certificate(fs.readFileSync(process.argv[1]));
            process.stdout.write(String(Math.floor(Date.parse(certificate.validTo) / 1000)));
          ' "$certificate_pem_path")"
          if [[ "$actual_expiry_epoch" != "$configured_expiry_epoch" ]]; then
            echo "The reusable iOS CI certificate expiry does not match prod-mobile configuration."
            exit 1
          fi

          if ! openssl x509 -in "$certificate_pem_path" -checkend 2592000 -noout; then
            echo "The reusable iOS CI development certificate expires within 30 days."
            exit 1
          fi

          {
            echo "## Reusable iOS development identity"
            echo
            echo "- Certificate id: \`$IOS_CI_DEVELOPMENT_CERTIFICATE_ID\`"
            echo "- Team: \`$expected_team_id\`"
            echo "- SHA-256: \`$actual_sha256\`"
            echo "- Expires: \`$IOS_CI_DEVELOPMENT_CERTIFICATE_EXPIRES_AT\`"
            echo "- Remaining validity: more than 30 days"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare prod Flutter iOS configuration
        run: ./tool/flutter_with_env.sh prod --role "$APP_ROLE" build ios --release --config-only --build-name="$FLUTTER_BUILD_NAME" --build-number="$FLUTTER_BUILD_NUMBER"

      - name: Archive prod iOS app
        env:
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${ASC_KEY_ID:-}" || -z "${ASC_ISSUER_ID:-}" || -z "${ASC_KEY_BASE64:-}" ]]; then
            echo "Missing App Store Connect API key secrets."
            exit 1
          fi
          asc_key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -f "$asc_key_path"' EXIT
          /usr/bin/printf '%s' "$ASC_KEY_BASE64" | /usr/bin/base64 -D > "$asc_key_path"
          chmod 600 "$asc_key_path"
          node tool/platform/verify_app_store_build.mjs \
            --app-id "$APP_STORE_CONNECT_APP_ID" \
            --build-number "$FLUTTER_BUILD_NUMBER" \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-path "$asc_key_path" \
            --check-candidate
          xcodebuild \
            -workspace "$APP_PROJECT_ROOT/ios/Runner.xcworkspace" \
            -scheme "$IOS_SCHEME" \
            -configuration "$IOS_CONFIGURATION" \
            -destination generic/platform=iOS \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$asc_key_path" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -hideShellScriptEnvironment \
            archive

      - name: Verify archived release identity and Maps key
        run: |
          set -euo pipefail
          mkdir -p build/ios/release-evidence
          node tool/platform/verify_ios_release_identity.mjs \
            --archive "$ARCHIVE_PATH" \
            --role "$APP_ROLE" \
            --environment prod \
            --expected-version "$FLUTTER_BUILD_NAME" \
            --expected-build "$FLUTTER_BUILD_NUMBER" \
            --receipt "build/ios/release-evidence/${APP_ROLE}-archive.json"

          archived_app="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$archived_app" ]]; then
            echo "Could not find archived app in $ARCHIVE_PATH/Products/Applications."
            exit 1
          fi

          node tool/firebase/validate_google_maps_config.mjs \
            --env prod \
            --platform ios \
            --project-root "$APP_PROJECT_ROOT" \
            --ios-built-plist "$archived_app/Info.plist"

      - name: Export prod IPA
        env:
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${ASC_KEY_ID:-}" || -z "${ASC_ISSUER_ID:-}" || -z "${ASC_KEY_BASE64:-}" ]]; then
            echo "Missing App Store Connect API key secrets."
            exit 1
          fi
          asc_key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -f "$asc_key_path"' EXIT
          /usr/bin/printf '%s' "$ASC_KEY_BASE64" | /usr/bin/base64 -D > "$asc_key_path"
          chmod 600 "$asc_key_path"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$APP_PROJECT_ROOT/ios/ExportOptions.prod.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$asc_key_path" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Verify exported release identity
        run: |
          set -euo pipefail
          ipa_path="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)"

          if [[ -z "$ipa_path" ]]; then
            echo "Could not find exported IPA under $EXPORT_PATH."
            exit 1
          fi

          node tool/platform/verify_ios_release_identity.mjs \
            --ipa "$ipa_path" \
            --role "$APP_ROLE" \
            --environment prod \
            --expected-version "$FLUTTER_BUILD_NAME" \
            --expected-build "$FLUTTER_BUILD_NUMBER" \
            --receipt "build/ios/release-evidence/${APP_ROLE}-export.json"

          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"
          /usr/bin/shasum -a 256 "$ipa_path" > "build/ios/release-evidence/${APP_ROLE}-ipa.sha256"

          {
            echo "## iOS export verification"
            echo
            echo "- App role: \`$APP_ROLE\`"
            echo "- IPA: \`$ipa_path\`"
            echo "- Target: \`$IOS_SCHEME\` / \`$IOS_CONFIGURATION\`"
            echo "- Bundle ID: \`$EXPECTED_BUNDLE_ID\`"
            echo "- Version/build: \`$FLUTTER_BUILD_NAME ($FLUTTER_BUILD_NUMBER)\`"
            echo "- Role-specific signed entitlements: verified from \`tool/app_targets.json\`"
            echo "- Identity receipts: \`build/ios/release-evidence/${APP_ROLE}-{archive,export}.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce iOS package size and payload policy
        run: |
          node tool/platform/check_mobile_package.mjs \
            --artifact "$IPA_PATH" \
            --role "$APP_ROLE" \
            --platform ios \
            --output "build/ios/release-evidence/${APP_ROLE}-package.json"

      - name: Package exact signed iOS artifact and source receipts
        env:
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
        run: |
          node tool/ci/package_mobile_release.mjs prepare \
            --source-root . \
            --artifact "$IPA_PATH" \
            --release-target "$RELEASE_TARGET" \
            --impact-plan build/mobile/source/impact-plan.json \
            --ci-authority build/mobile/source/ci-delivery-authority.json \
            --identity-receipt "build/ios/release-evidence/${APP_ROLE}-export.json" \
            --package-policy-receipt "build/ios/release-evidence/${APP_ROLE}-package.json" \
            --package-dir "build/mobile/packages/${RELEASE_TARGET}" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT"

      - id: upload-package
        name: Upload immutable iOS package
        uses: actions/upload-artifact@v7
        with:
          name: mobile-package-v1-${{ matrix.release_target }}-${{ needs.authorize.outputs.source_ci_run_id }}-${{ needs.authorize.outputs.source_ci_run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mobile/packages/${{ matrix.release_target }}
          if-no-files-found: error
          retention-days: 90

      - name: Bind immutable package artifact metadata
        env:
          PACKAGE_ARTIFACT_DIGEST: ${{ format('sha256:{0}', steps.upload-package.outputs.artifact-digest) }}
          PACKAGE_ARTIFACT_ID: ${{ steps.upload-package.outputs.artifact-id }}
          PACKAGE_ARTIFACT_NAME: mobile-package-v1-${{ matrix.release_target }}-${{ needs.authorize.outputs.source_ci_run_id }}-${{ needs.authorize.outputs.source_ci_run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node tool/ci/package_mobile_release.mjs bind-upload \
            --source-root . \
            --package-dir "build/mobile/packages/${RELEASE_TARGET}" \
            --receipt-dir "build/mobile/upload-receipts/${RELEASE_TARGET}" \
            --package-artifact-id "$PACKAGE_ARTIFACT_ID" \
            --package-artifact-name "$PACKAGE_ARTIFACT_NAME" \
            --package-artifact-digest "$PACKAGE_ARTIFACT_DIGEST"

      - name: Upload iOS package receipt
        uses: actions/upload-artifact@v7
        with:
          name: mobile-package-receipt-v1-${{ matrix.release_target }}-${{ needs.authorize.outputs.source_ci_run_id }}-${{ needs.authorize.outputs.source_ci_run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mobile/upload-receipts/${{ matrix.release_target }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove ephemeral iOS signing material
        if: ${{ always() }}
        run: |
          set +e
          if [[ -n "${IOS_CI_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$IOS_CI_KEYCHAIN_PATH" 2>/dev/null || true
          fi
          for secret_path in \
            "${IOS_CI_P12_PATH:-}" \
            "${IOS_CI_CERTIFICATE_PEM_PATH:-}"; do
            if [[ -n "$secret_path" ]]; then
              rm -f "$secret_path"
            fi
          done

  prod-android:
    name: Build signed package (${{ matrix.release_target }})
    needs: authorize
    if: ${{ needs.authorize.outputs.has_android_targets == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        release_target: ${{ fromJSON(needs.authorize.outputs.android_targets) }}
    runs-on: ubuntu-latest
    environment: prod-mobile
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}

      - name: Verify exact source checkout
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Download verified CI source binding
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.authorize.outputs.source_bundle_name }}
          path: build/mobile/source

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java-version }}

      - name: Install pinned bundletool
        env:
          BUNDLETOOL_VERSION: 1.18.3
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          set -euo pipefail
          bundletool_path="$RUNNER_TEMP/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl --fail --location --retry 3 \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "$bundletool_path"
          printf '%s  %s\n' "$BUNDLETOOL_SHA256" "$bundletool_path" | sha256sum --check --status
          echo "BUNDLETOOL_JAR=$bundletool_path" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-flutter

      - run: flutter pub get

      - name: Validate installable app-target contract
        run: node tool/run.mjs check platform:app-targets platform:app-package-graphs platform:verify-android-release-identity

      - name: Resolve release target
        env:
          RELEASE_TARGET_INPUT: ${{ matrix.release_target }}
          SOURCE_CI_RUN_ATTEMPT: ${{ needs.authorize.outputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_NUMBER: ${{ needs.authorize.outputs.source_ci_run_number }}
          SOURCE_CI_UTC_DATE: ${{ needs.authorize.outputs.source_ci_utc_date }}
        run: |
          set -euo pipefail
          case "$RELEASE_TARGET_INPUT" in
            consumer-android) app_role=consumer ;;
            host-android) app_role=host ;;
            *) echo "Unsupported Android release target: $RELEASE_TARGET_INPUT"; exit 64 ;;
          esac
          target_fields="$(node tool/platform/resolve_app_target.mjs \
            --role "$app_role" \
            --environment prod \
            --fields id,projectRoot,android.applicationId,android.flavor)"
          IFS=$'\t' read -r target_id app_project_root application_id android_flavor <<< "$target_fields"
          if [[ -z "$target_id" || -z "$app_project_root" || -z "$application_id" || -z "$android_flavor" ]]; then
            echo "Could not resolve complete prod Android target metadata for '$app_role'."
            exit 1
          fi

          version_line="$(awk '/^version: / { print $2; exit }' "$app_project_root/pubspec.yaml")"
          build_name="${version_line%%+*}"
          build_number="$(node tool/platform/compute_mobile_build_number.mjs \
            --platform android \
            --utc-date "$SOURCE_CI_UTC_DATE" \
            --run-number "$SOURCE_CI_RUN_NUMBER" \
            --run-attempt "$SOURCE_CI_RUN_ATTEMPT")"

          {
            echo "APP_ROLE=$app_role"
            echo "RELEASE_TARGET=$RELEASE_TARGET_INPUT"
            echo "APP_PROJECT_ROOT=$app_project_root"
            echo "APP_TARGET_ID=$target_id"
            echo "ANDROID_APPLICATION_ID=$application_id"
            echo "ANDROID_FLAVOR=$android_flavor"
            echo "FLUTTER_BUILD_NAME=$build_name"
            echo "FLUTTER_BUILD_NUMBER=$build_number"
          } >> "$GITHUB_ENV"

      - name: Verify client callable dependencies
        run: |
          node tool/firebase/check_client_callable_dependencies.mjs \
            --role "$APP_ROLE" \
            --environment prod \
            --verify-live

      - name: Materialize Android upload signing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_UPLOAD_STORE_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS \
            ANDROID_UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing protected secret: $variable"
              exit 1
            fi
          done
          mkdir -p "$APP_PROJECT_ROOT/android/keystore"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$APP_PROJECT_ROOT/android/keystore/upload-keystore.jks"
          chmod 600 "$APP_PROJECT_ROOT/android/keystore/upload-keystore.jks"
          {
            echo 'storeFile=../keystore/upload-keystore.jks'
            printf 'storePassword=%s\n' "$ANDROID_UPLOAD_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_UPLOAD_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_UPLOAD_KEY_PASSWORD"
          } > "$APP_PROJECT_ROOT/android/key.properties"
          chmod 600 "$APP_PROJECT_ROOT/android/key.properties"

      - name: Write prod Android Maps key
        env:
          GOOGLE_MAPS_ANDROID_API_KEY_PROD: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY_PROD }}
        run: |
          if [[ -z "${GOOGLE_MAPS_ANDROID_API_KEY_PROD:-}" ]]; then
            echo "Missing GOOGLE_MAPS_ANDROID_API_KEY_PROD secret."
            exit 1
          fi
          printf '\nGOOGLE_MAPS_ANDROID_API_KEY_PROD=%s\n' "$GOOGLE_MAPS_ANDROID_API_KEY_PROD" >> "$APP_PROJECT_ROOT/android/local.properties"

      - name: Build signed prod Android App Bundle
        env:
          CATCH_GRADLE_WRAPPER_MAX_ATTEMPTS: 5
          CATCH_GRADLE_WRAPPER_RETRY_DELAY_SECONDS: 20
        run: |
          ./tool/flutter_with_env.sh prod --role "$APP_ROLE" build appbundle --release \
            --build-name="$FLUTTER_BUILD_NAME" \
            --build-number="$FLUTTER_BUILD_NUMBER"

      - name: Verify signed Android release identity
        env:
          GOOGLE_MAPS_ANDROID_API_KEY_PROD: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY_PROD }}
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find "$APP_PROJECT_ROOT/build/app/outputs/bundle" -type f -name '*.aab' -print)
          if (( ${#bundles[@]} != 1 )); then
            printf 'Expected exactly one Android App Bundle; found %s\n' "${#bundles[@]}"
            printf '%s\n' "${bundles[@]:-none}"
            exit 1
          fi
          mkdir -p build/android/release-evidence
          echo "ANDROID_BUNDLE_PATH=${bundles[0]}" >> "$GITHUB_ENV"
          node tool/platform/verify_android_release_bundle.mjs \
            --bundle "${bundles[0]}" \
            --role "$APP_ROLE" \
            --environment prod \
            --expected-version "$FLUTTER_BUILD_NAME" \
            --expected-build "$FLUTTER_BUILD_NUMBER" \
            --bundletool "$BUNDLETOOL_JAR" \
            --receipt "build/android/release-evidence/${APP_ROLE}-bundle.json"

      - name: Enforce Android package size and payload policy
        run: |
          node tool/platform/check_mobile_package.mjs \
            --artifact "$ANDROID_BUNDLE_PATH" \
            --role "$APP_ROLE" \
            --platform android \
            --output "build/android/release-evidence/${APP_ROLE}-package.json"

      - name: Package exact signed Android artifact and source receipts
        env:
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
        run: |
          node tool/ci/package_mobile_release.mjs prepare \
            --source-root . \
            --artifact "$ANDROID_BUNDLE_PATH" \
            --release-target "$RELEASE_TARGET" \
            --impact-plan build/mobile/source/impact-plan.json \
            --ci-authority build/mobile/source/ci-delivery-authority.json \
            --identity-receipt "build/android/release-evidence/${APP_ROLE}-bundle.json" \
            --package-policy-receipt "build/android/release-evidence/${APP_ROLE}-package.json" \
            --package-dir "build/mobile/packages/${RELEASE_TARGET}" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT"

      - id: upload-package
        name: Upload immutable Android package
        uses: actions/upload-artifact@v7
        with:
          name: mobile-package-v1-${{ matrix.release_target }}-${{ needs.authorize.outputs.source_ci_run_id }}-${{ needs.authorize.outputs.source_ci_run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mobile/packages/${{ matrix.release_target }}
          if-no-files-found: error
          retention-days: 90

      - name: Bind immutable package artifact metadata
        env:
          PACKAGE_ARTIFACT_DIGEST: ${{ format('sha256:{0}', steps.upload-package.outputs.artifact-digest) }}
          PACKAGE_ARTIFACT_ID: ${{ steps.upload-package.outputs.artifact-id }}
          PACKAGE_ARTIFACT_NAME: mobile-package-v1-${{ matrix.release_target }}-${{ needs.authorize.outputs.source_ci_run_id }}-${{ needs.authorize.outputs.source_ci_run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node tool/ci/package_mobile_release.mjs bind-upload \
            --source-root . \
            --package-dir "build/mobile/packages/${RELEASE_TARGET}" \
            --receipt-dir "build/mobile/upload-receipts/${RELEASE_TARGET}" \
            --package-artifact-id "$PACKAGE_ARTIFACT_ID" \
            --package-artifact-name "$PACKAGE_ARTIFACT_NAME" \
            --package-artifact-digest "$PACKAGE_ARTIFACT_DIGEST"

      - name: Upload Android package receipt
        uses: actions/upload-artifact@v7
        with:
          name: mobile-package-receipt-v1-${{ matrix.release_target }}-${{ needs.authorize.outputs.source_ci_run_id }}-${{ needs.authorize.outputs.source_ci_run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mobile/upload-receipts/${{ matrix.release_target }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove ephemeral Android signing and Maps material
        if: ${{ always() }}
        run: |
          set +e
          rm -f \
            "$APP_PROJECT_ROOT/android/key.properties" \
            "$APP_PROJECT_ROOT/android/keystore/upload-keystore.jks"
          if [[ -f "$APP_PROJECT_ROOT/android/local.properties" ]]; then
            sed -i.bak '/^GOOGLE_MAPS_ANDROID_API_KEY_PROD=/d' \
              "$APP_PROJECT_ROOT/android/local.properties"
            rm -f "$APP_PROJECT_ROOT/android/local.properties.bak"
          fi

  compare-role-packages:
    name: Compare Consumer and Host packages
    needs: [authorize, prod-ios, prod-android]
    if: >-
      always() &&
      needs.authorize.result == 'success' &&
      needs.authorize.outputs.release_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - name: Require selected package builds
        env:
          ANDROID_RESULT: ${{ needs.prod-android.result }}
          HAS_ANDROID_TARGETS: ${{ needs.authorize.outputs.has_android_targets }}
          HAS_IOS_TARGETS: ${{ needs.authorize.outputs.has_ios_targets }}
          IOS_RESULT: ${{ needs.prod-ios.result }}
        run: |
          set -euo pipefail
          if [[ "$HAS_IOS_TARGETS" == "true" && "$IOS_RESULT" != "success" ]]; then
            echo "Selected iOS package build ended with: $IOS_RESULT"
            exit 1
          fi
          if [[ "$HAS_ANDROID_TARGETS" == "true" && "$ANDROID_RESULT" != "success" ]]; then
            echo "Selected Android package build ended with: $ANDROID_RESULT"
            exit 1
          fi

      - name: Require a complete current producer attempt
        env:
          EXPECTED_SOURCE_BUNDLE_NAME: ${{ needs.authorize.outputs.source_bundle_name }}
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          RELEASE_TARGETS: ${{ needs.authorize.outputs.release_targets }}
          SOURCE_CI_RUN_ATTEMPT: ${{ needs.authorize.outputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ needs.authorize.outputs.source_ci_run_id }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          partial_attempt() {
            echo "::error::This mobile producer attempt is incomplete. Partial job reruns cannot mix evidence across attempts."
            echo "::error::Use Re-run all jobs for Mobile Internal Release."
            exit 64
          }

          current_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$PRODUCER_RUN_ID" \
            --argjson run_attempt "$PRODUCER_RUN_ATTEMPT" '
              .name == "Mobile Internal Release" and
              (.path | split("@")[0]) == ".github/workflows/mobile-internal-release.yml" and
              .event == "workflow_run" and
              .repository.full_name == $repository and
              (.id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              .status == "in_progress"
            ' <<< "$current_run" > /dev/null || partial_attempt

          suffix="${SOURCE_CI_RUN_ID}-${SOURCE_CI_RUN_ATTEMPT}-${PRODUCER_RUN_ID}-${PRODUCER_RUN_ATTEMPT}"
          source_bundle_name="mobile-source-v1-${SOURCE_CI_RUN_ID}-${SOURCE_CI_RUN_ATTEMPT}-${PRODUCER_RUN_ID}-${PRODUCER_RUN_ATTEMPT}"
          [[ "$EXPECTED_SOURCE_BUNDLE_NAME" == "$source_bundle_name" ]] || partial_attempt
          artifact_pages="$(gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/artifacts?per_page=100")"
          source_count="$(jq -r --arg name "$source_bundle_name" \
            '[.[].artifacts[] | select(.expired == false and .name == $name)] | length' \
            <<< "$artifact_pages")"
          [[ "$source_count" == "1" ]] || partial_attempt

          mkdir -p build/mobile/attempt/entries
          while IFS= read -r release_target; do
            package_name="mobile-package-v1-${release_target}-${suffix}"
            receipt_name="mobile-package-receipt-v1-${release_target}-${suffix}"
            package_count="$(jq -r --arg name "$package_name" \
              '[.[].artifacts[] | select(.expired == false and .name == $name)] | length' \
              <<< "$artifact_pages")"
            receipt_count="$(jq -r --arg name "$receipt_name" \
              '[.[].artifacts[] | select(.expired == false and .name == $name)] | length' \
              <<< "$artifact_pages")"
            [[ "$package_count" == "1" && "$receipt_count" == "1" ]] || partial_attempt
            package_metadata="$(jq -c --arg name "$package_name" \
              '[.[].artifacts[] | select(.expired == false and .name == $name)][0]' \
              <<< "$artifact_pages")"
            receipt_metadata="$(jq -c --arg name "$receipt_name" \
              '[.[].artifacts[] | select(.expired == false and .name == $name)][0]' \
              <<< "$artifact_pages")"
            package_id="$(jq -er '.id' <<< "$package_metadata")"
            package_digest="$(jq -er '.digest' <<< "$package_metadata")"
            receipt_id="$(jq -er '.id' <<< "$receipt_metadata")"
            receipt_digest="$(jq -er '.digest' <<< "$receipt_metadata")"
            [[ "$package_id" =~ ^[1-9][0-9]*$ && \
               "$receipt_id" =~ ^[1-9][0-9]*$ && \
               "$package_digest" =~ ^sha256:[0-9a-f]{64}$ && \
               "$receipt_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || partial_attempt
            jq -n \
              --arg package_digest "$package_digest" \
              --arg package_name "$package_name" \
              --arg receipt_digest "$receipt_digest" \
              --arg receipt_name "$receipt_name" \
              --arg release_target "$release_target" \
              --argjson package_id "$package_id" \
              --argjson receipt_id "$receipt_id" '{
                releaseTarget: $release_target,
                packageArtifact: {
                  id: $package_id,
                  name: $package_name,
                  digest: $package_digest
                },
                receiptArtifact: {
                  id: $receipt_id,
                  name: $receipt_name,
                  digest: $receipt_digest
                }
              }' > "build/mobile/attempt/entries/${release_target}.json"
          done < <(jq -r '.[]' <<< "$RELEASE_TARGETS")

      - name: Download exact package receipt artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: mobile-package-receipt-v1-*-${{ needs.authorize.outputs.source_ci_run_id }}-${{ needs.authorize.outputs.source_ci_run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mobile/compare

      - name: Verify every selected package receipt
        env:
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          RELEASE_TARGETS: ${{ needs.authorize.outputs.release_targets }}
          SOURCE_CI_RUN_ATTEMPT: ${{ needs.authorize.outputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ needs.authorize.outputs.source_ci_run_id }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          expected_count="$(jq -r 'length' <<< "$RELEASE_TARGETS")"
          actual_count="$(find build/mobile/compare -name mobile-package-upload-receipt.json \
            -type f | wc -l | tr -d ' ')"
          test "$actual_count" = "$expected_count"
          while IFS= read -r release_target; do
            receipt_file="$(find build/mobile/compare -path \
              "*/mobile-package-receipt-v1-${release_target}-${SOURCE_CI_RUN_ID}-${SOURCE_CI_RUN_ATTEMPT}-${PRODUCER_RUN_ID}-${PRODUCER_RUN_ATTEMPT}/mobile-package-upload-receipt.json" \
              -type f -print -quit)"
            test -n "$receipt_file"
            receipt_dir="$(dirname "$receipt_file")"
            package_id="$(jq -er '.packageArtifact.id' "$receipt_file")"
            package_name="$(jq -er '.packageArtifact.name' "$receipt_file")"
            package_digest="$(jq -er '.packageArtifact.digest' "$receipt_file")"
            node tool/ci/package_mobile_release.mjs verify-upload \
              --receipt-dir "$receipt_dir" \
              --release-target "$release_target" \
              --source-sha "$SOURCE_SHA" \
              --ci-run-id "$SOURCE_CI_RUN_ID" \
              --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
              --producer-run-id "$PRODUCER_RUN_ID" \
              --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
              --package-artifact-id "$package_id" \
              --package-artifact-name "$package_name" \
              --package-artifact-digest "$package_digest"
          done < <(jq -r '.[]' <<< "$RELEASE_TARGETS")

      - name: Compare every selected cross-role platform pair
        env:
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          RELEASE_TARGETS: ${{ needs.authorize.outputs.release_targets }}
          SOURCE_CI_RUN_ATTEMPT: ${{ needs.authorize.outputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ needs.authorize.outputs.source_ci_run_id }}
        run: |
          set -euo pipefail
          suffix="${SOURCE_CI_RUN_ID}-${SOURCE_CI_RUN_ATTEMPT}-${PRODUCER_RUN_ID}-${PRODUCER_RUN_ATTEMPT}"
          for platform in ios android; do
            if jq -e --arg platform "$platform" '
              (index("consumer-" + $platform) != null) and
              (index("host-" + $platform) != null)
            ' <<< "$RELEASE_TARGETS" > /dev/null; then
              consumer="$(find build/mobile/compare -path \
                "*/mobile-package-receipt-v1-consumer-${platform}-${suffix}/package-policy-receipt.json" \
                -type f -print -quit)"
              host="$(find build/mobile/compare -path \
                "*/mobile-package-receipt-v1-host-${platform}-${suffix}/package-policy-receipt.json" \
                -type f -print -quit)"
              test -n "$consumer"
              test -n "$host"
              node tool/platform/check_mobile_package.mjs --compare "$consumer,$host"
            fi
          done

      - name: Create current-attempt completeness authority
        env:
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          RELEASE_TARGETS: ${{ needs.authorize.outputs.release_targets }}
          SOURCE_CI_RUN_ATTEMPT: ${{ needs.authorize.outputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ needs.authorize.outputs.source_ci_run_id }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          artifacts="$(jq -s 'sort_by(.releaseTarget)' build/mobile/attempt/entries/*.json)"
          ios_comparison="$(jq -r '
            if (index("consumer-ios") != null and index("host-ios") != null)
            then "passed" else "not-required" end
          ' <<< "$RELEASE_TARGETS")"
          android_comparison="$(jq -r '
            if (index("consumer-android") != null and index("host-android") != null)
            then "passed" else "not-required" end
          ' <<< "$RELEASE_TARGETS")"
          jq -n \
            --arg android_comparison "$android_comparison" \
            --arg ios_comparison "$ios_comparison" \
            --arg producer_attempt "$PRODUCER_RUN_ATTEMPT" \
            --arg producer_run_id "$PRODUCER_RUN_ID" \
            --arg source_attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --arg source_run_id "$SOURCE_CI_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --argjson artifacts "$artifacts" \
            --argjson release_targets "$RELEASE_TARGETS" '{
              schema: "catch.mobile-attempt-completeness-authority/v1",
              sourceCiRunId: $source_run_id,
              sourceCiRunAttempt: $source_attempt,
              sourceSha: $source_sha,
              producerRunId: $producer_run_id,
              producerRunAttempt: $producer_attempt,
              releaseTargets: $release_targets,
              crossRoleComparisons: {
                ios: $ios_comparison,
                android: $android_comparison
              },
              artifacts: $artifacts
            }' > build/mobile/attempt/mobile-attempt-completeness-authority.json
          node tool/ci/package_mobile_release.mjs verify-attempt \
            --authority build/mobile/attempt/mobile-attempt-completeness-authority.json \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --source-sha "$SOURCE_SHA" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --release-targets "$RELEASE_TARGETS"

      - name: Upload current-attempt completeness authority
        uses: actions/upload-artifact@v7
        with:
          name: mobile-attempt-completeness-v1-${{ needs.authorize.outputs.source_ci_run_id }}-${{ needs.authorize.outputs.source_ci_run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mobile/attempt/mobile-attempt-completeness-authority.json
          if-no-files-found: error
          retention-days: 90

  publish-authority:
    name: Publish verified mobile build authority
    needs: [authorize, compare-role-packages]
    if: >-
      always() &&
      needs.authorize.result == 'success' &&
      needs.authorize.outputs.release_required == 'true' &&
      needs.compare-role-packages.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      authority_artifact_id: ${{ steps.upload-authority.outputs.artifact-id }}
      authority_artifact_sha256: ${{ steps.upload-authority.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - name: Verify exact package and receipt artifact metadata
        env:
          EXPECTED_SOURCE_BUNDLE_NAME: ${{ needs.authorize.outputs.source_bundle_name }}
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          RELEASE_TARGETS: ${{ needs.authorize.outputs.release_targets }}
          SOURCE_CI_RUN_ATTEMPT: ${{ needs.authorize.outputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ needs.authorize.outputs.source_ci_run_id }}
          SOURCE_CI_RUN_NUMBER: ${{ needs.authorize.outputs.source_ci_run_number }}
          SOURCE_CI_WORKFLOW_ID: ${{ needs.authorize.outputs.source_ci_workflow_id }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          partial_attempt() {
            echo "::error::This mobile producer attempt is incomplete. Partial job reruns cannot mix evidence across attempts."
            echo "::error::Use Re-run all jobs for Mobile Internal Release."
            exit 64
          }
          current_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$PRODUCER_RUN_ID" \
            --argjson run_attempt "$PRODUCER_RUN_ATTEMPT" '
              .name == "Mobile Internal Release" and
              (.path | split("@")[0]) == ".github/workflows/mobile-internal-release.yml" and
              .event == "workflow_run" and
              .repository.full_name == $repository and
              (.id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              .status == "in_progress"
            ' <<< "$current_run" > /dev/null || partial_attempt

          mkdir -p \
            build/mobile/final/attempt \
            build/mobile/final/entries \
            build/mobile/final/packages \
            build/mobile/final/receipts
          artifact_pages="$(gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")"
          suffix="${SOURCE_CI_RUN_ID}-${SOURCE_CI_RUN_ATTEMPT}-${PRODUCER_RUN_ID}-${PRODUCER_RUN_ATTEMPT}"
          source_bundle_name="mobile-source-v1-${SOURCE_CI_RUN_ID}-${SOURCE_CI_RUN_ATTEMPT}-${PRODUCER_RUN_ID}-${PRODUCER_RUN_ATTEMPT}"
          attempt_name="mobile-attempt-completeness-v1-${suffix}"
          [[ "$EXPECTED_SOURCE_BUNDLE_NAME" == "$source_bundle_name" ]] || partial_attempt
          for artifact_name in "$source_bundle_name" "$attempt_name"; do
            count="$(jq -r --arg name "$artifact_name" \
              '[.[].artifacts[] | select(.expired == false and .name == $name)] | length' \
              <<< "$artifact_pages")"
            [[ "$count" == "1" ]] || partial_attempt
          done

          attempt_metadata="$(jq -c --arg name "$attempt_name" \
            '[.[].artifacts[] | select(.expired == false and .name == $name)][0]' \
            <<< "$artifact_pages")"
          attempt_id="$(jq -er '.id' <<< "$attempt_metadata")"
          attempt_digest="$(jq -er '.digest' <<< "$attempt_metadata")"
          [[ "$attempt_id" =~ ^[1-9][0-9]*$ && \
             "$attempt_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || partial_attempt
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$attempt_id/zip" \
            > build/mobile/final/attempt/attempt.zip
          test "sha256:$(sha256sum build/mobile/final/attempt/attempt.zip | awk '{print $1}')" = \
            "$attempt_digest"
          unzip -Z1 build/mobile/final/attempt/attempt.zip | \
            awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
          unzip -q build/mobile/final/attempt/attempt.zip -d build/mobile/final/attempt/content
          test "$(find build/mobile/final/attempt/content -type l | wc -l | tr -d ' ')" = "0"
          test "$(find build/mobile/final/attempt/content -type f | wc -l | tr -d ' ')" = "1"
          attempt_authority="build/mobile/final/attempt/content/mobile-attempt-completeness-authority.json"
          test -f "$attempt_authority"
          node tool/ci/package_mobile_release.mjs verify-attempt \
            --authority "$attempt_authority" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --source-sha "$SOURCE_SHA" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --release-targets "$RELEASE_TARGETS"

          expected_count="$(( $(jq -r 'length' <<< "$RELEASE_TARGETS") * 2 ))"
          current_count="$(jq -r --arg suffix "$suffix" '
            [.[].artifacts[] |
              select(
                .expired == false and
                ((.name | startswith("mobile-package-v1-")) or
                 (.name | startswith("mobile-package-receipt-v1-"))) and
                (.name | endswith($suffix))
              )
            ] | length
          ' <<< "$artifact_pages")"
          if [[ "$current_count" != "$expected_count" ]]; then
            partial_attempt
          fi

          while IFS= read -r release_target; do
            package_name="mobile-package-v1-${release_target}-${suffix}"
            receipt_name="mobile-package-receipt-v1-${release_target}-${suffix}"
            for artifact_name in "$package_name" "$receipt_name"; do
              count="$(jq -r --arg name "$artifact_name" \
                '[.[].artifacts[] | select(.expired == false and .name == $name)] | length' \
                <<< "$artifact_pages")"
              if [[ "$count" != "1" ]]; then
                echo "Expected exactly one artifact named $artifact_name; found $count."
                exit 64
              fi
            done
            package_metadata="$(jq -c --arg name "$package_name" \
              '[.[].artifacts[] | select(.expired == false and .name == $name)][0]' \
              <<< "$artifact_pages")"
            receipt_metadata="$(jq -c --arg name "$receipt_name" \
              '[.[].artifacts[] | select(.expired == false and .name == $name)][0]' \
              <<< "$artifact_pages")"
            package_id="$(jq -er '.id' <<< "$package_metadata")"
            package_digest="$(jq -er '.digest' <<< "$package_metadata")"
            receipt_id="$(jq -er '.id' <<< "$receipt_metadata")"
            receipt_digest="$(jq -er '.digest' <<< "$receipt_metadata")"
            [[ "$package_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$receipt_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$package_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$receipt_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

            jq -e \
              --arg package_digest "$package_digest" \
              --arg package_name "$package_name" \
              --arg receipt_digest "$receipt_digest" \
              --arg receipt_name "$receipt_name" \
              --arg release_target "$release_target" \
              --argjson package_id "$package_id" \
              --argjson receipt_id "$receipt_id" '
                [.artifacts[] | select(.releaseTarget == $release_target)] as $entry |
                ($entry | length) == 1 and
                $entry[0].packageArtifact == {
                  id: $package_id,
                  name: $package_name,
                  digest: $package_digest
                } and
                $entry[0].receiptArtifact == {
                  id: $receipt_id,
                  name: $receipt_name,
                  digest: $receipt_digest
                }
              ' "$attempt_authority" > /dev/null || partial_attempt

            package_root="build/mobile/final/packages/$release_target"
            mkdir -p "$package_root/content"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$package_id/zip" \
              > "$package_root/package.zip"
            test "sha256:$(sha256sum "$package_root/package.zip" | awk '{print $1}')" = \
              "$package_digest"
            unzip -Z1 "$package_root/package.zip" | \
              awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
            unzip -q "$package_root/package.zip" -d "$package_root/content"
            test "$(find "$package_root/content" -type l | wc -l | tr -d ' ')" = "0"
            node tool/ci/package_mobile_release.mjs verify \
              --package-dir "$package_root/content" \
              --release-target "$release_target" \
              --source-sha "$SOURCE_SHA" \
              --ci-run-id "$SOURCE_CI_RUN_ID" \
              --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
              --producer-run-id "$PRODUCER_RUN_ID" \
              --producer-run-attempt "$PRODUCER_RUN_ATTEMPT"

            receipt_root="build/mobile/final/receipts/$release_target"
            mkdir -p "$receipt_root/content"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$receipt_id/zip" \
              > "$receipt_root/receipt.zip"
            test "sha256:$(sha256sum "$receipt_root/receipt.zip" | awk '{print $1}')" = \
              "$receipt_digest"
            unzip -Z1 "$receipt_root/receipt.zip" | \
              awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
            unzip -q "$receipt_root/receipt.zip" -d "$receipt_root/content"
            test "$(find "$receipt_root/content" -type l | wc -l | tr -d ' ')" = "0"
            test "$(find "$receipt_root/content" -type f | wc -l | tr -d ' ')" = "2"
            node tool/ci/package_mobile_release.mjs verify-upload \
              --receipt-dir "$receipt_root/content" \
              --release-target "$release_target" \
              --source-sha "$SOURCE_SHA" \
              --ci-run-id "$SOURCE_CI_RUN_ID" \
              --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
              --producer-run-id "$PRODUCER_RUN_ID" \
              --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
              --package-artifact-id "$package_id" \
              --package-artifact-name "$package_name" \
              --package-artifact-digest "$package_digest"
            upload_receipt="$receipt_root/content/mobile-package-upload-receipt.json"
            jq -S . "$package_root/content/mobile-package-receipt.json" \
              > "$package_root/package-receipt.sorted.json"
            jq -S '.packageReceipt' "$upload_receipt" \
              > "$receipt_root/upload-package-receipt.sorted.json"
            cmp "$package_root/package-receipt.sorted.json" \
              "$receipt_root/upload-package-receipt.sorted.json"
            jq -n \
              --arg package_digest "$package_digest" \
              --arg package_name "$package_name" \
              --arg receipt_digest "$receipt_digest" \
              --arg receipt_name "$receipt_name" \
              --arg release_target "$release_target" \
              --argjson package_id "$package_id" \
              --argjson receipt_id "$receipt_id" \
              --slurpfile package_receipt \
                "$package_root/content/mobile-package-receipt.json" '{
                releaseTarget: $release_target,
                artifactSha256: $package_receipt[0].artifact.sha256,
                provenanceManifestSha256:
                  $package_receipt[0].provenance.manifestSha256,
                packageArtifact: {
                  id: $package_id,
                  name: $package_name,
                  digest: $package_digest
                },
                receiptArtifact: {
                  id: $receipt_id,
                  name: $receipt_name,
                  digest: $receipt_digest
                }
              }' > "build/mobile/final/entries/${release_target}.json"
          done < <(jq -r '.[]' <<< "$RELEASE_TARGETS")

          for platform in ios android; do
            if jq -e --arg platform "$platform" '
              (index("consumer-" + $platform) != null) and
              (index("host-" + $platform) != null)
            ' <<< "$RELEASE_TARGETS" > /dev/null; then
              node tool/platform/check_mobile_package.mjs --compare \
                "build/mobile/final/packages/consumer-${platform}/content/package-policy-receipt.json,build/mobile/final/packages/host-${platform}/content/package-policy-receipt.json"
            fi
          done

          packages="$(jq -s 'sort_by(.releaseTarget)' build/mobile/final/entries/*.json)"
          ios_comparison="$(jq -r '
            if (index("consumer-ios") != null and index("host-ios") != null)
            then "passed" else "not-required" end
          ' <<< "$RELEASE_TARGETS")"
          android_comparison="$(jq -r '
            if (index("consumer-android") != null and index("host-android") != null)
            then "passed" else "not-required" end
          ' <<< "$RELEASE_TARGETS")"
          jq -n \
            --arg android_comparison "$android_comparison" \
            --arg ios_comparison "$ios_comparison" \
            --arg producer_attempt "$PRODUCER_RUN_ATTEMPT" \
            --arg producer_run_id "$PRODUCER_RUN_ID" \
            --arg source_attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --arg source_run_id "$SOURCE_CI_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --argjson packages "$packages" \
            --argjson release_targets "$RELEASE_TARGETS" \
            --argjson source_run_number "$SOURCE_CI_RUN_NUMBER" \
            --argjson source_workflow_id "$SOURCE_CI_WORKFLOW_ID" '{
              schema: "catch.mobile-build-authority/v1",
              sourceCiWorkflowId: $source_workflow_id,
              sourceCiRunNumber: $source_run_number,
              sourceCiRunId: $source_run_id,
              sourceCiRunAttempt: $source_attempt,
              sourceSha: $source_sha,
              producerRunId: $producer_run_id,
              producerRunAttempt: $producer_attempt,
              releaseTargets: $release_targets,
              crossRoleComparisons: {
                ios: $ios_comparison,
                android: $android_comparison
              },
              packages: $packages
            }' > build/mobile/final/mobile-build-authority.json
          node tool/ci/package_mobile_release.mjs verify-authority \
            --authority build/mobile/final/mobile-build-authority.json \
            --ci-workflow-id "$SOURCE_CI_WORKFLOW_ID" \
            --ci-run-number "$SOURCE_CI_RUN_NUMBER" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --source-sha "$SOURCE_SHA" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --release-targets "$RELEASE_TARGETS"

      - name: Reconfirm source CI attempt is still current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CI_RUN_ATTEMPT: ${{ needs.authorize.outputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ needs.authorize.outputs.source_ci_run_id }}
          SOURCE_CI_RUN_NUMBER: ${{ needs.authorize.outputs.source_ci_run_number }}
          SOURCE_CI_WORKFLOW_ID: ${{ needs.authorize.outputs.source_ci_workflow_id }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          latest_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID")"
          if ! jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$SOURCE_CI_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --argjson run_attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --argjson run_number "$SOURCE_CI_RUN_NUMBER" \
            --argjson workflow_id "$SOURCE_CI_WORKFLOW_ID" '
              .name == "CI" and
              (.path | split("@")[0]) == ".github/workflows/ci.yml" and
              .workflow_id == $workflow_id and
              .event == "push" and
              .head_branch == "main" and
              .head_repository.full_name == $repository and
              (.id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              .run_number == $run_number and
              .head_sha == $source_sha and
              .status == "completed" and
              .conclusion == "success"
            ' <<< "$latest_run" > /dev/null; then
            echo "::error::Source CI was re-run while mobile packages were building; this attempt is obsolete."
            exit 64
          fi

      - id: upload-authority
        name: Upload post-comparison mobile build authority
        uses: actions/upload-artifact@v7
        with:
          name: mobile-build-authority-v1-${{ needs.authorize.outputs.source_ci_workflow_id }}-${{ needs.authorize.outputs.source_ci_run_number }}-${{ needs.authorize.outputs.source_ci_run_id }}-${{ needs.authorize.outputs.source_ci_run_attempt }}-${{ needs.authorize.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mobile/final/mobile-build-authority.json
          if-no-files-found: error
          retention-days: 90

  dispatch-promotions:
    name: Dispatch automatic exact iOS promotions
    needs: [authorize, publish-authority]
    if: >-
      needs.authorize.result == 'success' &&
      needs.publish-authority.result == 'success' &&
      needs.authorize.outputs.has_ios_targets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch one exact promoter for each authorized iOS target
        env:
          AUTHORITY_ARTIFACT_ID: ${{ needs.publish-authority.outputs.authority_artifact_id }}
          AUTHORITY_ARTIFACT_SHA256: ${{ needs.publish-authority.outputs.authority_artifact_sha256 }}
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          RELEASE_TARGETS: ${{ needs.authorize.outputs.release_targets }}
        run: |
          set -euo pipefail
          [[ "$AUTHORITY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$AUTHORITY_ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PRODUCER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PRODUCER_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

          current_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$PRODUCER_RUN_ID" \
            --argjson run_attempt "$PRODUCER_RUN_ATTEMPT" '
              (.id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              .name == "Mobile Internal Release" and
              (.path | split("@")[0]) ==
                ".github/workflows/mobile-internal-release.yml" and
              .event == "workflow_run" and
              .head_branch == "main" and
              .head_repository.full_name == $repository and
              .status == "in_progress"
            ' <<< "$current_run" > /dev/null
          authority="$(gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTHORITY_ARTIFACT_ID")"
          jq -e \
            --arg digest "sha256:$AUTHORITY_ARTIFACT_SHA256" \
            --arg run_id "$PRODUCER_RUN_ID" \
            --argjson artifact_id "$AUTHORITY_ARTIFACT_ID" '
              .id == $artifact_id and
              .expired == false and
              .digest == $digest and
              (.workflow_run.id | tostring) == $run_id and
              .workflow_run.head_branch == "main"
            ' <<< "$authority" > /dev/null

          mkdir -p build/mobile/automatic-promotions
          dispatch_count=0
          while IFS= read -r release_target; do
            [[ "$release_target" =~ ^(consumer|host)-(android|ios)$ ]]
            if [[ "$release_target" != *-ios ]]; then continue; fi
            payload_path="build/mobile/automatic-promotions/${release_target}.json"
            jq -n \
              --arg authority_artifact_id "$AUTHORITY_ARTIFACT_ID" \
              --arg authority_artifact_sha256 "$AUTHORITY_ARTIFACT_SHA256" \
              --arg producer_run_attempt "$PRODUCER_RUN_ATTEMPT" \
              --arg producer_run_id "$PRODUCER_RUN_ID" \
              --arg release_target "$release_target" '{
                ref: "main",
                inputs: {
                  release_target: $release_target,
                  producer_run_id: $producer_run_id,
                  producer_run_attempt: $producer_run_attempt,
                  authority_artifact_id: $authority_artifact_id,
                  authority_artifact_sha256: $authority_artifact_sha256,
                  reason: ("Automatic exact iOS promotion from verified producer " +
                    $producer_run_id + " for " + $release_target),
                  confirm: "true"
                }
              }' > "$payload_path"
            dispatched="$(gh api \
              --method POST \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/actions/workflows/mobile-internal-promote.yml/dispatches" \
              --input "$payload_path")"
            jq -e '
              (.workflow_run_id | type == "number" and . > 0) and
              (.html_url | type == "string" and length > 0)
            ' <<< "$dispatched" > /dev/null
            dispatch_count=$((dispatch_count + 1))
            {
              echo "- \`$release_target\`: $(jq -er '.html_url' <<< "$dispatched")"
            } >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[]' <<< "$RELEASE_TARGETS")
          echo "Dispatched $dispatch_count exact iOS promotion workflow(s)." >> "$GITHUB_STEP_SUMMARY"

  verify-promotion-dispatches:
    name: Verify automatic promotion handoff
    needs: [authorize, publish-authority, dispatch-promotions]
    if: >-
      always() &&
      needs.authorize.result == 'success' &&
      needs.publish-authority.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every authorized iOS target to reach the promoter
        env:
          DISPATCH_RESULT: ${{ needs.dispatch-promotions.result }}
          RELEASE_TARGETS: ${{ needs.authorize.outputs.release_targets }}
        run: |
          set -euo pipefail
          ios_count="$(jq -r '[.[] | select(endswith("-ios"))] | length' <<< "$RELEASE_TARGETS")"
          if [[ "$ios_count" == "0" ]]; then
            test "$DISPATCH_RESULT" = "skipped"
          else
            test "$DISPATCH_RESULT" = "success"
          fi
