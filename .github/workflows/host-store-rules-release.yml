name: Protected Host store rules recovery

# A fixed rules-only promotion of PR592, whose rules differ from the observed
# production baseline only by the Host summary access block. The existing
# uploaded client can then use its callable fallback for absent summary markers.
# This does not deploy summary writers, enable markers, or advance delivery.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Confirm PR592 source 28703b2c6dfa7a2408b8d5789a2b46c6ebedcf9e.
        required: true
        type: string
      reason:
        description: Operator reason for the bounded Host rules recovery.
        required: true
        type: string
      confirm_rules_only:
        description: Promote only the exact reviewed Firestore rules; no other backend targets.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: backend-delivery
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require the exact reviewed scope on current main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          REASON: ${{ inputs.reason }}
          CONFIRM: ${{ inputs.confirm_rules_only }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$SOURCE_SHA" = 28703b2c6dfa7a2408b8d5789a2b46c6ebedcf9e
          test "$CONFIRM" = true
          (( ${#REASON} >= 12 && ${#REASON} <= 240 ))
          [[ "$REASON" != *$'\r'* && "$REASON" != *$'\n'* ]]
          [[ "$REASON" =~ [^[:space:]] ]]
          git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"
          node --test tool/ci/host_store_rules_release.test.mjs

  prod:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    concurrency:
      group: firebase-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Require a recorded approval from a configured human reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/host-rules-source build/host-rules-package
          gh api "repos/$GITHUB_REPOSITORY/environments/prod" > build/host-rules-environment.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > build/host-rules-approvals.json
          node tool/ci/host_store_rules_release.mjs approval build/host-rules-environment.json build/host-rules-approvals.json
      - name: Verify the immutable successful producer and download its exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38760225469/attempts/1" > build/host-rules-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11986523714" > build/host-rules-artifact.json
          node tool/ci/host_store_rules_release.mjs authority build/host-rules-run.json build/host-rules-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11986523714/zip" > build/host-rules.zip
          node tool/ci/host_store_rules_release.mjs archive build/host-rules.zip
          test "$(unzip -Z1 build/host-rules.zip | LC_ALL=C sort)" = "$(printf '%s\n' firebase-backend.tar.gz firebase-provenance.json)"
          unzip -q build/host-rules.zip -d build/host-rules-source
          node tool/ci/delivery_core.mjs verify \
            --manifest build/host-rules-source/firebase-provenance.json \
            --artifact build/host-rules-source/firebase-backend.tar.gz \
            --source-sha 28703b2c6dfa7a2408b8d5789a2b46c6ebedcf9e --ci-run-id 38760225469 --ci-run-attempt 1
          tar -tzf build/host-rules-source/firebase-backend.tar.gz | awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
          tar -xzf build/host-rules-source/firebase-backend.tar.gz -C build/host-rules-package
          node tool/ci/host_store_rules_release.mjs prepare \
            build/host-rules-package/delivery-plan.json build/host-rules-package
          node tool/ci/host_store_rules_release.mjs verify-rules firestore.rules
      - name: Authenticate using the existing protected production identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Capture and require the exact live predecessor
        run: node tool/ci/host_store_rules_release.mjs before build/host-rules-before.json
      - uses: actions/upload-artifact@v6
        with:
          name: host-store-rules-before-${{ github.run_id }}-1
          path: build/host-rules-before.json
          if-no-files-found: error
          retention-days: 90
      - name: Install pinned Firebase CLI
        run: npm install -g firebase-tools@${{ steps.toolchain.outputs.firebase-tools-version }}
      - name: Recheck source and live state, then deploy only the verified rules
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main
          git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 28703b2c6dfa7a2408b8d5789a2b46c6ebedcf9e "$GITHUB_SHA"
          node tool/ci/host_store_rules_release.mjs verify-rules firestore.rules
          node tool/ci/host_store_rules_release.mjs verify-before build/host-rules-before.json
          ./tool/deploy_firebase_targets.sh prod firestore:rules --config build/host-rules-only/firebase.json
          node tool/ci/host_store_rules_release.mjs after build/host-rules-before.json
      - uses: actions/upload-artifact@v6
        with:
          name: host-store-rules-completion-${{ github.run_id }}-1
          path: build/host-rules-receipt.json
          if-no-files-found: error
          retention-days: 90
