name: Backend Rebaseline

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main SHA to deploy as the cumulative backend snapshot.
        required: true
        type: string
      reason:
        description: Bounded operator reason for superseding the pending backend queue.
        required: true
        type: string
      confirm_full_backend_rebaseline:
        description: Confirm Functions, Firestore indexes/rules, and Storage rules promotion through prod.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

# Rebaseline and ordinary cursor delivery mutate the same Firebase surfaces.
concurrency:
  group: backend-delivery
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize the exact cumulative backend snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      base_sha: ${{ steps.cursor.outputs.base_sha }}
      source_ci_run_attempt: ${{ steps.authority.outputs.source_ci_run_attempt }}
      source_ci_run_id: ${{ steps.authority.outputs.source_ci_run_id }}
      source_ci_run_number: ${{ steps.authority.outputs.source_ci_run_number }}
      source_ci_workflow_id: ${{ steps.cursor.outputs.source_ci_workflow_id }}
      source_sha: ${{ steps.inputs.outputs.source_sha }}
    steps:
      - name: Checkout the exact requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - id: inputs
        name: Require an explicit exact-current-main authorization
        env:
          CONFIRM_FULL_BACKEND_REBASELINE: ${{ inputs.confirm_full_backend_rebaseline }}
          REASON: ${{ inputs.reason }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM_FULL_BACKEND_REBASELINE" = "true"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin main:refs/remotes/origin/main --no-tags
          test "$(git rev-parse refs/remotes/origin/main)" = "$SOURCE_SHA"
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$SOURCE_SHA"
          test -n "$REASON"
          test "${#REASON}" -le 200
          if [[ "$REASON" == *$'\n'* || "$REASON" == *$'\r'* ]]; then
            echo "The rebaseline reason must be a single line."
            exit 64
          fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - id: cursor
        name: Restore and verify the latest delivery cursor
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          mkdir -p build/rebaseline/cursor
          current_ci_workflow="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml")"
          current_ci_workflow_id="$(jq -er '
            select(
              (.id | type == "number" and . > 0 and floor == .) and
              (.path | split("@")[0]) == ".github/workflows/ci.yml"
            ) |
            .id
          ' <<< "$current_ci_workflow")"
          [[ "$current_ci_workflow_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]

          artifact_pages="$(gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100")"
          candidates="$(jq -c \
            --argjson repository_id "$REPOSITORY_ID" \
            --argjson workflow_id "$current_ci_workflow_id" '
            [.[].artifacts[] |
              select(
                .expired == false and
                .workflow_run.id != null and
                .workflow_run.repository_id == $repository_id and
                .workflow_run.head_repository_id == $repository_id and
                (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
              ) |
              . as $artifact |
              ($artifact.name |
                try capture(
                  "^backend-delivery-cursor-v4-(?<workflowId>[1-9][0-9]*)-(?<runNumber>[1-9][0-9]*)-(?<sourceRunId>[1-9][0-9]*)-(?<sourceAttempt>[1-9][0-9]*)-(?<sourceSha>[0-9a-f]{40})-(?<deliveryRunId>[1-9][0-9]*)-(?<deliveryAttempt>[1-9][0-9]*)$"
                ) catch null
              ) as $binding |
              select($binding != null) |
              {
                artifactId: $artifact.id,
                artifactName: $artifact.name,
                artifactDigest: $artifact.digest,
                artifactDeliveryRunId: ($artifact.workflow_run.id | tostring),
                sourceCiWorkflowId: ($binding.workflowId | tonumber),
                sourceCiRunNumber: ($binding.runNumber | tonumber),
                sourceCiRunId: $binding.sourceRunId,
                sourceCiRunAttempt: $binding.sourceAttempt,
                sourceSha: $binding.sourceSha,
                deliveryRunId: $binding.deliveryRunId,
                deliveryRunAttempt: $binding.deliveryAttempt
              } |
              select(
                .sourceCiWorkflowId == $workflow_id and
                .artifactDeliveryRunId == .deliveryRunId
              )
            ]
          ' <<< "$artifact_pages")"
          ambiguity_count="$(jq -r '
            group_by(.sourceCiRunNumber) |
            map(select(([.[] | [.sourceCiRunId, .sourceSha]] | unique | length) > 1)) |
            length
          ' <<< "$candidates")"
          if (( ambiguity_count > 0 )); then
            echo "Multiple cursor authorities claim the same CI run number."
            exit 64
          fi
          candidate="$(jq -c '
            sort_by([
              .sourceCiRunNumber,
              (.sourceCiRunAttempt | tonumber),
              (.deliveryRunId | tonumber),
              (.deliveryRunAttempt | tonumber)
            ]) |
            if length == 0 then null else last end
          ' <<< "$candidates")"
          if [[ "$candidate" == "null" ]]; then
            echo "A verified v4 delivery cursor is required before a backend rebaseline."
            exit 64
          fi

          artifact_id="$(jq -er '.artifactId | tostring' <<< "$candidate")"
          artifact_name="$(jq -er '.artifactName' <<< "$candidate")"
          artifact_digest="$(jq -er '.artifactDigest' <<< "$candidate")"
          delivery_run_id="$(jq -er '.deliveryRunId' <<< "$candidate")"
          delivery_run_attempt="$(jq -er '.deliveryRunAttempt' <<< "$candidate")"
          source_run_id="$(jq -er '.sourceCiRunId' <<< "$candidate")"
          source_run_attempt="$(jq -er '.sourceCiRunAttempt' <<< "$candidate")"
          source_run_number="$(jq -er '.sourceCiRunNumber' <<< "$candidate")"
          source_sha="$(jq -er '.sourceSha' <<< "$candidate")"
          cursor_dir=build/rebaseline/cursor/selected
          mkdir -p "$cursor_dir"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > "$cursor_dir/cursor.zip"
          test "sha256:$(sha256sum "$cursor_dir/cursor.zip" | awk '{print $1}')" = "$artifact_digest"
          unzip -Z1 "$cursor_dir/cursor.zip" | \
            awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
          unzip -q "$cursor_dir/cursor.zip" -d "$cursor_dir/content"
          test "$(find "$cursor_dir/content" -type l | wc -l | tr -d ' ')" = "0"
          cursor_file="$cursor_dir/content/backend-delivery-cursor.json"
          test -f "$cursor_file"
          test "$(find "$cursor_dir/content" -type f | wc -l | tr -d ' ')" = "1"
          jq -e \
            --arg artifact_name "$artifact_name" \
            --arg delivery_run_attempt "$delivery_run_attempt" \
            --arg delivery_run_id "$delivery_run_id" \
            --arg source_run_attempt "$source_run_attempt" \
            --arg source_run_id "$source_run_id" \
            --arg source_sha "$source_sha" \
            --argjson source_run_number "$source_run_number" \
            --argjson source_workflow_id "$current_ci_workflow_id" '
              (keys | sort) == [
                "deliveryRunAttempt",
                "deliveryRunId",
                "schema",
                "sourceCiRunAttempt",
                "sourceCiRunId",
                "sourceCiRunNumber",
                "sourceCiWorkflowId",
                "sourceSha"
              ] and
              .schema == "catch.backend-delivery-cursor/v4" and
              .deliveryRunId == $delivery_run_id and
              .deliveryRunAttempt == $delivery_run_attempt and
              .sourceCiWorkflowId == $source_workflow_id and
              .sourceCiRunNumber == $source_run_number and
              .sourceCiRunId == $source_run_id and
              .sourceCiRunAttempt == $source_run_attempt and
              .sourceSha == $source_sha and
              $artifact_name == (
                "backend-delivery-cursor-v4-" +
                (.sourceCiWorkflowId | tostring) + "-" +
                (.sourceCiRunNumber | tostring) + "-" +
                .sourceCiRunId + "-" +
                .sourceCiRunAttempt + "-" +
                .sourceSha + "-" +
                .deliveryRunId + "-" +
                .deliveryRunAttempt
              )
            ' "$cursor_file" > /dev/null

          historical_delivery="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$delivery_run_id/attempts/$delivery_run_attempt")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg delivery_run_id "$delivery_run_id" \
            --argjson delivery_run_attempt "$delivery_run_attempt" '
              (
                (.name == "Delivery" and
                 (.path | split("@")[0]) == ".github/workflows/delivery.yml") or
                (.name == "Backend Rebaseline" and
                 (.path | split("@")[0]) == ".github/workflows/backend-rebaseline.yml")
              ) and
              .head_repository.full_name == $repository and
              .head_branch == "main" and
              (.id | tostring) == $delivery_run_id and
              .run_attempt == $delivery_run_attempt
            ' <<< "$historical_delivery" > /dev/null
          cursor_source_run="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/attempts/$source_run_attempt")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson run_attempt "$source_run_attempt" \
            --arg run_id "$source_run_id" \
            --arg source_sha "$source_sha" \
            --argjson run_number "$source_run_number" \
            --argjson workflow_id "$current_ci_workflow_id" '
              .name == "CI" and
              (.path | split("@")[0]) == ".github/workflows/ci.yml" and
              .workflow_id == $workflow_id and
              .event == "push" and
              .head_branch == "main" and
              .head_repository.full_name == $repository and
              (.id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              .run_number == $run_number and
              .head_sha == $source_sha and
              .status == "completed" and
              .conclusion == "success"
            ' <<< "$cursor_source_run" > /dev/null
          echo "base_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "source_ci_workflow_id=$current_ci_workflow_id" >> "$GITHUB_OUTPUT"

      - id: authority
        name: Bind the current main successful CI authority
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CI_WORKFLOW_ID: ${{ steps.cursor.outputs.source_ci_workflow_id }}
          SOURCE_SHA: ${{ steps.inputs.outputs.source_sha }}
        run: |
          set -euo pipefail
          successful_pages="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100")"
          source_run="$(jq -c \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            --argjson workflow_id "$SOURCE_CI_WORKFLOW_ID" '
              [.[].workflow_runs[] |
                select(
                  .name == "CI" and
                  (.path | split("@")[0]) == ".github/workflows/ci.yml" and
                  .workflow_id == $workflow_id and
                  .event == "push" and
                  .head_branch == "main" and
                  .head_repository.full_name == $repository and
                  .head_sha == $source_sha and
                  .status == "completed" and
                  .conclusion == "success"
                )
              ] |
              sort_by([.run_number, .run_attempt]) |
              if length == 0 then null else last end
            ' <<< "$successful_pages")"
          if [[ "$source_run" == "null" ]]; then
            echo "Current main does not have a successful immutable CI authority."
            exit 64
          fi
          source_ci_run_id="$(jq -er '.id | tostring' <<< "$source_run")"
          source_ci_run_attempt="$(jq -er '.run_attempt | tostring' <<< "$source_run")"
          source_ci_run_number="$(jq -er '.run_number | tostring' <<< "$source_run")"
          [[ "$source_ci_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$source_ci_run_attempt" =~ ^[1-9][0-9]*$ ]]
          [[ "$source_ci_run_number" =~ ^[1-9][0-9]*$ ]]
          echo "source_ci_run_id=$source_ci_run_id" >> "$GITHUB_OUTPUT"
          echo "source_ci_run_attempt=$source_ci_run_attempt" >> "$GITHUB_OUTPUT"
          echo "source_ci_run_number=$source_ci_run_number" >> "$GITHUB_OUTPUT"

      - name: Create the graph-authorized all-backend impact plan
        env:
          BASE_SHA: ${{ steps.cursor.outputs.base_sha }}
          REBASELINE_REASON: ${{ inputs.reason }}
          SOURCE_SHA: ${{ steps.inputs.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" "$SOURCE_SHA"
          mkdir -p build/rebaseline
          node tool/harness.mjs plan \
            --paths functions/src/index.ts,firestore.indexes.json,firestore.rules,storage.rules \
            --mode main \
            --json > build/rebaseline/impact-plan.unbound.json
          jq \
            --arg baseSha "$BASE_SHA" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg sourceCiRunId "$GITHUB_RUN_ID" \
            --arg sourceCiRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg reason "$REBASELINE_REASON" '
              . + {
                baseSha: $baseSha,
                sourceSha: $sourceSha,
                sourceCiRunId: $sourceCiRunId,
                sourceCiRunAttempt: $sourceCiRunAttempt,
                rebaseline: {
                  schema: "catch.backend-rebaseline/v1",
                  cumulativeSnapshot: true,
                  reason: $reason
                }
              }
            ' build/rebaseline/impact-plan.unbound.json \
              > build/rebaseline/impact-plan.json
          rm build/rebaseline/impact-plan.unbound.json
          jq -e '
            .complete == true and
            .graphStatus == "required" and
            .mode == "main" and
            .rebaseline.schema == "catch.backend-rebaseline/v1" and
            .rebaseline.cumulativeSnapshot == true and
            (.rebaseline.reason | type == "string" and length > 0 and length <= 200) and
            (.operations.deployGroups | sort) == [
              "firestore-indexes",
              "firestore-rules",
              "functions",
              "storage-rules"
            ] and
            (.operations.ciTargets | contains([
              "contracts",
              "firestore_rules",
              "functions"
            ]))
          ' build/rebaseline/impact-plan.json > /dev/null

      - name: Upload the immutable rebaseline impact plan
        uses: actions/upload-artifact@v7
        with:
          name: backend-rebaseline-plan-${{ steps.inputs.outputs.source_sha }}-${{ github.run_attempt }}
          path: build/rebaseline/impact-plan.json
          if-no-files-found: error
          retention-days: 90

  functions:
    name: Revalidate Functions
    needs: authorize
    uses: ./.github/workflows/functions-ci.yml
    secrets: inherit

  contracts:
    name: Revalidate Firestore contracts and indexes
    needs: authorize
    uses: ./.github/workflows/contracts-ci.yml
    secrets: inherit

  firestore-rules:
    name: Revalidate Firestore and Storage rules
    needs: authorize
    uses: ./.github/workflows/firestore-rules-ci.yml
    secrets: inherit

  package:
    name: Package the exact cumulative Firebase backend
    needs: [authorize, functions, contracts, firestore-rules]
    if: >-
      always() &&
      needs.authorize.result == 'success' &&
      needs.functions.result == 'success' &&
      needs.contracts.result == 'success' &&
      needs.firestore-rules.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the exact authorized source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - name: Download the exact rebaseline impact plan
        uses: actions/download-artifact@v7
        with:
          name: backend-rebaseline-plan-${{ needs.authorize.outputs.source_sha }}-${{ github.run_attempt }}
          path: build/rebaseline

      - name: Download the exact tested Functions build
        uses: actions/download-artifact@v7
        with:
          name: functions-lib-${{ needs.authorize.outputs.source_sha }}-${{ github.run_attempt }}
          path: build/rebaseline/tested-functions-lib

      - name: Package the exact all-backend snapshot
        env:
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p build/rebaseline/firebase-delivery
          result="$(node tool/ci/package_firebase_delivery.mjs prepare \
            --impact-plan build/rebaseline/impact-plan.json \
            --source-sha "$SOURCE_SHA" \
            --base-sha "$BASE_SHA" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --stage-dir build/rebaseline/firebase-package \
            --functions-lib-dir build/rebaseline/tested-functions-lib)"
          stages="$(jq -er '.stages | join(",")' <<< "$result")"
          test "$stages" = "firestore-indexes,functions,firestore-rules,storage-rules"
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -C build/rebaseline/firebase-package \
            -czf build/rebaseline/firebase-delivery/firebase-backend.tar.gz .
          node tool/ci/delivery_core.mjs manifest \
            --artifact build/rebaseline/firebase-delivery/firebase-backend.tar.gz \
            --source-sha "$SOURCE_SHA" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --stages "$stages" \
            --out build/rebaseline/firebase-delivery/firebase-provenance.json

      - name: Upload the immutable Firebase rebaseline package
        uses: actions/upload-artifact@v7
        with:
          name: firebase-delivery-${{ needs.authorize.outputs.source_sha }}-${{ github.run_attempt }}
          path: build/rebaseline/firebase-delivery
          if-no-files-found: error
          retention-days: 90

  dev:
    name: Rebaseline backend in dev
    needs: [authorize, package]
    if: ${{ needs.authorize.result == 'success' && needs.package.result == 'success' }}
    uses: ./.github/workflows/_firebase-promote.yml
    with:
      environment: dev
      control_plane_sha: ${{ github.workflow_sha }}
      base_sha: ${{ needs.authorize.outputs.base_sha }}
      source_ci_run_attempt: ${{ github.run_attempt }}
      source_ci_run_id: ${{ github.run_id }}
      source_sha: ${{ needs.authorize.outputs.source_sha }}
      require_current_main: true
    secrets: inherit

  prod:
    name: Rebaseline backend in prod
    needs: [authorize, dev]
    if: ${{ always() && needs.authorize.result == 'success' && needs.dev.result == 'success' }}
    uses: ./.github/workflows/_firebase-promote.yml
    with:
      environment: prod
      control_plane_sha: ${{ github.workflow_sha }}
      base_sha: ${{ needs.authorize.outputs.base_sha }}
      source_ci_run_attempt: ${{ github.run_attempt }}
      source_ci_run_id: ${{ github.run_id }}
      source_sha: ${{ needs.authorize.outputs.source_sha }}
      require_current_main: true
    secrets: inherit

  finalize:
    name: Advance the delivery cursor only after prod
    needs: [authorize, dev, prod]
    if: ${{ always() && needs.authorize.result == 'success' && needs.prod.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Reconfirm the deployed source is still current main
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          fetch-depth: 0

      - name: Refuse stale main or partial reruns
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          git fetch origin main:refs/remotes/origin/main --no-tags
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$SOURCE_SHA"

      - name: Write the schema-bound current-main cursor
        env:
          DELIVERY_RUN_ATTEMPT: ${{ github.run_attempt }}
          DELIVERY_RUN_ID: ${{ github.run_id }}
          SOURCE_CI_RUN_ATTEMPT: ${{ needs.authorize.outputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ needs.authorize.outputs.source_ci_run_id }}
          SOURCE_CI_RUN_NUMBER: ${{ needs.authorize.outputs.source_ci_run_number }}
          SOURCE_CI_WORKFLOW_ID: ${{ needs.authorize.outputs.source_ci_workflow_id }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$DELIVERY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$DELIVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_CI_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_CI_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_CI_WORKFLOW_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p build/rebaseline/cursor
          jq -n \
            --arg deliveryRunAttempt "$DELIVERY_RUN_ATTEMPT" \
            --arg deliveryRunId "$DELIVERY_RUN_ID" \
            --arg sourceCiRunAttempt "$SOURCE_CI_RUN_ATTEMPT" \
            --arg sourceCiRunId "$SOURCE_CI_RUN_ID" \
            --arg sourceSha "$SOURCE_SHA" \
            --argjson sourceCiWorkflowId "$SOURCE_CI_WORKFLOW_ID" \
            --argjson sourceCiRunNumber "$SOURCE_CI_RUN_NUMBER" '{
              schema: "catch.backend-delivery-cursor/v4",
              deliveryRunAttempt: $deliveryRunAttempt,
              deliveryRunId: $deliveryRunId,
              sourceCiRunAttempt: $sourceCiRunAttempt,
              sourceCiRunNumber: $sourceCiRunNumber,
              sourceCiRunId: $sourceCiRunId,
              sourceCiWorkflowId: $sourceCiWorkflowId,
              sourceSha: $sourceSha
            }' > build/rebaseline/cursor/backend-delivery-cursor.json

      - name: Upload the immutable resumable delivery cursor
        uses: actions/upload-artifact@v7
        with:
          name: backend-delivery-cursor-v4-${{ needs.authorize.outputs.source_ci_workflow_id }}-${{ needs.authorize.outputs.source_ci_run_number }}-${{ needs.authorize.outputs.source_ci_run_id }}-${{ needs.authorize.outputs.source_ci_run_attempt }}-${{ needs.authorize.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/rebaseline/cursor/backend-delivery-cursor.json
          if-no-files-found: error
          retention-days: 90

      - name: Dispatch the next cursor-driven worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=backend-delivery-drain
