name: Backend Rebaseline

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main SHA to deploy as the cumulative backend snapshot.
        required: true
        type: string
      reason:
        description: Bounded operator reason for superseding the pending backend queue.
        required: true
        type: string
      confirm_full_backend_rebaseline:
        description: Confirm Functions, Firestore indexes/rules, and Storage rules promotion through prod.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: read
  id-token: write

# Rebaseline and ordinary cursor delivery mutate the same Firebase surfaces.
concurrency:
  group: backend-delivery
  cancel-in-progress: false

jobs:
  snapshot:
    name: Exclude both delivery lanes for the approved snapshot
    concurrency:
      group: backend-delivery-dev
      cancel-in-progress: false
    uses: ./.github/workflows/_backend-rebaseline.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      reason: ${{ inputs.reason }}
      confirm_full_backend_rebaseline: ${{ inputs.confirm_full_backend_rebaseline }}
    secrets: inherit
