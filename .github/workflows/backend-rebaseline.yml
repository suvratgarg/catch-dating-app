name: Backend Rebaseline

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Stop after DEV, or explicitly include protected production after DEV succeeds.
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      source_sha:
        description: Exact current main SHA to deploy as the cumulative backend snapshot.
        required: true
        type: string
      reason:
        description: Bounded operator reason for superseding the pending backend queue.
        required: true
        type: string
      confirm_full_backend_rebaseline:
        description: Confirm all backend targets within the selected environment scope.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: read
  id-token: write

# Rebaseline and ordinary cursor delivery mutate the same Firebase surfaces.
concurrency:
  group: backend-delivery
  cancel-in-progress: false

jobs:
  snapshot:
    name: Exclude both delivery lanes for the approved snapshot
    # The worker narrows ordinary jobs to read; its finalizer dispatches the
    # next delivery only after the protected production snapshot succeeds.
    permissions:
      actions: read
      contents: write
      pull-requests: read
      id-token: write
    concurrency:
      group: backend-delivery-dev
      cancel-in-progress: false
    uses: ./.github/workflows/_backend-rebaseline.yml
    with:
      target_environment: ${{ inputs.target_environment }}
      source_sha: ${{ inputs.source_sha }}
      reason: ${{ inputs.reason }}
      confirm_full_backend_rebaseline: ${{ inputs.confirm_full_backend_rebaseline }}
    secrets: inherit
