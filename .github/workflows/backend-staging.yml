name: Backend Staging Refresh

on:
  schedule:
    - cron: '17 2 1 * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  id-token: write

# Staging refreshes independently of the ordered dev/production queue.
# The shared promoter also serializes all mutations to the staging project.
concurrency:
  group: backend-staging
  cancel-in-progress: false

jobs:
  authorize:
    name: Bind a full staging snapshot to main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      base_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - id: plan
        name: Create the exact full backend snapshot plan
        env:
          SOURCE_SHA: ${{ github.sha }}
          CONTROL_PLANE_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$CONTROL_PLANE_SHA" = "$SOURCE_SHA"
          mkdir -p build/staging
          node tool/harness.mjs plan \
            --paths functions/src/index.ts,firestore.indexes.json,firestore.rules,storage.rules \
            --mode main --json > build/staging/impact-plan.unbound.json
          jq --arg sourceSha "$SOURCE_SHA" \
            --arg sourceCiRunId "$GITHUB_RUN_ID" \
            --arg sourceCiRunAttempt "$GITHUB_RUN_ATTEMPT" '
            . + {
              baseSha: $sourceSha,
              sourceSha: $sourceSha,
              sourceCiRunId: $sourceCiRunId,
              sourceCiRunAttempt: $sourceCiRunAttempt,
              snapshot: {
                schema: "catch.backend-snapshot/v1",
                environment: "staging",
                cumulativeSnapshot: true
              }
            }
          ' build/staging/impact-plan.unbound.json > build/staging/impact-plan.json
          jq -e '
            .complete == true and .graphStatus == "required" and .mode == "main" and
            (.operations.deployGroups | sort) == [
              "firestore-indexes", "firestore-rules", "functions", "storage-rules"
            ] and
            (.operations.ciTargets | contains(["contracts", "firestore_rules", "functions"]))
          ' build/staging/impact-plan.json > /dev/null
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: backend-staging-plan-${{ steps.plan.outputs.source_sha }}-${{ github.run_attempt }}
          path: build/staging/impact-plan.json
          if-no-files-found: error
          retention-days: 90

  functions:
    name: Validate Functions
    needs: authorize
    uses: ./.github/workflows/functions-ci.yml
    secrets: inherit

  contracts:
    name: Validate Firestore contracts and indexes
    needs: authorize
    uses: ./.github/workflows/contracts-ci.yml
    secrets: inherit

  firestore-rules:
    name: Validate Firestore and Storage rules
    needs: authorize
    uses: ./.github/workflows/firestore-rules-ci.yml
    secrets: inherit

  package:
    name: Package the exact cumulative Firebase backend
    needs: [authorize, functions, contracts, firestore-rules]
    if: >-
      always() &&
      needs.authorize.result == 'success' &&
      needs.functions.result == 'success' &&
      needs.contracts.result == 'success' &&
      needs.firestore-rules.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the exact authorized source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - name: Download the exact staging impact plan
        uses: actions/download-artifact@v7
        with:
          name: backend-staging-plan-${{ needs.authorize.outputs.source_sha }}-${{ github.run_attempt }}
          path: build/staging

      - name: Download the exact tested Functions build
        uses: actions/download-artifact@v7
        with:
          name: functions-lib-${{ needs.authorize.outputs.source_sha }}-${{ github.run_attempt }}
          path: build/staging/tested-functions-lib

      - name: Package the exact all-backend snapshot
        env:
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p build/staging/firebase-delivery
          result="$(node tool/ci/package_firebase_delivery.mjs prepare \
            --impact-plan build/staging/impact-plan.json \
            --source-sha "$SOURCE_SHA" \
            --base-sha "$BASE_SHA" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --stage-dir build/staging/firebase-package \
            --functions-lib-dir build/staging/tested-functions-lib)"
          stages="$(jq -er '.stages | join(",")' <<< "$result")"
          test "$stages" = "firestore-indexes,functions,firestore-rules,storage-rules"
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -C build/staging/firebase-package \
            -czf build/staging/firebase-delivery/firebase-backend.tar.gz .
          node tool/ci/delivery_core.mjs manifest \
            --artifact build/staging/firebase-delivery/firebase-backend.tar.gz \
            --source-sha "$SOURCE_SHA" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --stages "$stages" \
            --out build/staging/firebase-delivery/firebase-provenance.json

      - name: Upload the immutable Firebase staging package
        uses: actions/upload-artifact@v7
        with:
          name: firebase-delivery-${{ needs.authorize.outputs.source_sha }}-${{ github.run_attempt }}
          path: build/staging/firebase-delivery
          if-no-files-found: error
          retention-days: 90

  staging:
    name: Refresh staging from the validated snapshot
    needs: [authorize, package]
    if: ${{ needs.authorize.result == 'success' && needs.package.result == 'success' }}
    uses: ./.github/workflows/_firebase-promote.yml
    with:
      environment: staging
      control_plane_sha: ${{ github.workflow_sha }}
      base_sha: ${{ needs.authorize.outputs.base_sha }}
      source_ci_run_attempt: ${{ github.run_attempt }}
      source_ci_run_id: ${{ github.run_id }}
      source_sha: ${{ needs.authorize.outputs.source_sha }}
    secrets: inherit
