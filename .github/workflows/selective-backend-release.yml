name: One-Time Selective Backend PROD Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Confirm the exact audited CI source commit.
        required: true
        type: string
      reason:
        description: Single-line operator reason for the protected PROD release.
        required: true
        type: string
      confirm_four_functions_five_indexes:
        description: Confirm only the reviewed four Functions and five additive indexes.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: read
  id-token: write

# This one-time caller shares both ordinary Delivery's outer lock and the
# reusable promoter's firebase-prod lock. It never publishes a full cursor.
concurrency:
  group: backend-delivery
  cancel-in-progress: false

jobs:
  authorize:
    name: Verify one immutable candidate and exact operator scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Pin reviewed main, CI producer and package before PROD review
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REASON: ${{ inputs.reason }}
          CONFIRM: ${{ inputs.confirm_four_functions_five_indexes }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$CONFIRM" = true
          test "$REQUESTED_SHA" = 656f093d1910afdbe4d93d31565d1782c39aab63
          (( ${#REASON} >= 12 && ${#REASON} <= 240 ))
          [[ "$REASON" != *$'\r'* && "$REASON" != *$'\n'* ]]
          [[ "$REASON" =~ [^[:space:]] ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$REQUESTED_SHA" "$GITHUB_SHA"
          git diff --quiet "$REQUESTED_SHA" "$GITHUB_SHA" -- \
            functions/src functions/package.json functions/package-lock.json \
            functions/scripts/set-callable-invokers-public.cjs \
            firebase.json .firebaserc firestore.indexes.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/37247348530/attempts/1" | jq -e '
            .status == "completed" and .conclusion == "success" and
            .event == "push" and .head_branch == "main" and
            .head_sha == "656f093d1910afdbe4d93d31565d1782c39aab63" and
            .run_attempt == 1 and .workflow_id == 320377139
          ' > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11319623826" | jq -e '
            .id == 11319623826 and .expired == false and
            .name == "firebase-delivery-656f093d1910afdbe4d93d31565d1782c39aab63-1" and
            .digest == "sha256:a3f0636ba0ba631f66990b2a41ac25dd486ed9650eb6060a0a9a0a1caebc9029" and
            .workflow_run.id == 37247348530
          ' > /dev/null

  prod:
    name: Protected exact-target PROD promotion
    needs: authorize
    if: ${{ needs.authorize.result == 'success' }}
    uses: ./.github/workflows/_firebase-promote.yml
    with:
      environment: prod
      control_plane_sha: ${{ github.sha }}
      source_sha: 656f093d1910afdbe4d93d31565d1782c39aab63
      base_sha: ea518ad0576829dbc505293d4edbd9f6710a2b8f
      source_ci_run_id: '37247348530'
      source_ci_run_attempt: '1'
      operator_release: true
    secrets: inherit
