name: Verify mobile platform packages

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      source_ci_run_id:
        required: true
        type: string
      source_ci_run_attempt:
        required: true
        type: string
      source_ci_run_number:
        required: true
        type: string
      source_ci_workflow_id:
        required: true
        type: string
      source_bundle_name:
        required: true
        type: string
      release_targets:
        required: true
        type: string
    outputs:
      authority_artifact_id:
        value: ${{ jobs.publish-authority.outputs.authority_artifact_id }}
      authority_artifact_sha256:
        value: ${{ jobs.publish-authority.outputs.authority_artifact_sha256 }}

permissions:
  actions: read
  contents: read

jobs:
  compare-role-packages:
    name: Compare Consumer and Host packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - name: Require a nonempty exact platform slice
        env:
          PLATFORM: ${{ inputs.platform }}
          RELEASE_TARGETS: ${{ inputs.release_targets }}
        run: |
          set -euo pipefail
          [[ "$PLATFORM" == "ios" || "$PLATFORM" == "android" ]]
          jq -e --arg platform "$PLATFORM" '
            length > 0 and . == (sort | unique) and
            all(.[]; . == ("consumer-" + $platform) or . == ("host-" + $platform))
          ' <<< "$RELEASE_TARGETS" > /dev/null

      - name: Require a complete current producer attempt
        env:
          EXPECTED_SOURCE_BUNDLE_NAME: ${{ inputs.source_bundle_name }}
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          RELEASE_TARGETS: ${{ inputs.release_targets }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          partial_attempt() {
            echo "::error::This mobile producer attempt is incomplete. Partial job reruns cannot mix evidence across attempts."
            echo "::error::Use Re-run all jobs for Mobile Internal Release."
            exit 64
          }

          current_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$PRODUCER_RUN_ID" \
            --argjson run_attempt "$PRODUCER_RUN_ATTEMPT" '
              .name == "Mobile Internal Release" and
              (.path | split("@")[0]) == ".github/workflows/mobile-internal-release.yml" and
              .event == "workflow_run" and
              .repository.full_name == $repository and
              (.id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              .status == "in_progress"
            ' <<< "$current_run" > /dev/null || partial_attempt

          suffix="${SOURCE_CI_RUN_ID}-${SOURCE_CI_RUN_ATTEMPT}-${PRODUCER_RUN_ID}-${PRODUCER_RUN_ATTEMPT}"
          source_bundle_name="mobile-source-v1-${SOURCE_CI_RUN_ID}-${SOURCE_CI_RUN_ATTEMPT}-${PRODUCER_RUN_ID}-${PRODUCER_RUN_ATTEMPT}"
          [[ "$EXPECTED_SOURCE_BUNDLE_NAME" == "$source_bundle_name" ]] || partial_attempt
          artifact_pages="$(gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/artifacts?per_page=100")"
          source_count="$(jq -r --arg name "$source_bundle_name" \
            '[.[].artifacts[] | select(.expired == false and .name == $name)] | length' \
            <<< "$artifact_pages")"
          [[ "$source_count" == "1" ]] || partial_attempt

          mkdir -p build/mobile/attempt/entries
          while IFS= read -r release_target; do
            package_name="mobile-package-v1-${release_target}-${suffix}"
            receipt_name="mobile-package-receipt-v1-${release_target}-${suffix}"
            package_count="$(jq -r --arg name "$package_name" \
              '[.[].artifacts[] | select(.expired == false and .name == $name)] | length' \
              <<< "$artifact_pages")"
            receipt_count="$(jq -r --arg name "$receipt_name" \
              '[.[].artifacts[] | select(.expired == false and .name == $name)] | length' \
              <<< "$artifact_pages")"
            [[ "$package_count" == "1" && "$receipt_count" == "1" ]] || partial_attempt
            package_metadata="$(jq -c --arg name "$package_name" \
              '[.[].artifacts[] | select(.expired == false and .name == $name)][0]' \
              <<< "$artifact_pages")"
            receipt_metadata="$(jq -c --arg name "$receipt_name" \
              '[.[].artifacts[] | select(.expired == false and .name == $name)][0]' \
              <<< "$artifact_pages")"
            package_id="$(jq -er '.id' <<< "$package_metadata")"
            package_digest="$(jq -er '.digest' <<< "$package_metadata")"
            receipt_id="$(jq -er '.id' <<< "$receipt_metadata")"
            receipt_digest="$(jq -er '.digest' <<< "$receipt_metadata")"
            [[ "$package_id" =~ ^[1-9][0-9]*$ && \
               "$receipt_id" =~ ^[1-9][0-9]*$ && \
               "$package_digest" =~ ^sha256:[0-9a-f]{64}$ && \
               "$receipt_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || partial_attempt
            jq -n \
              --arg package_digest "$package_digest" \
              --arg package_name "$package_name" \
              --arg receipt_digest "$receipt_digest" \
              --arg receipt_name "$receipt_name" \
              --arg release_target "$release_target" \
              --argjson package_id "$package_id" \
              --argjson receipt_id "$receipt_id" '{
                releaseTarget: $release_target,
                packageArtifact: {
                  id: $package_id,
                  name: $package_name,
                  digest: $package_digest
                },
                receiptArtifact: {
                  id: $receipt_id,
                  name: $receipt_name,
                  digest: $receipt_digest
                }
              }' > "build/mobile/attempt/entries/${release_target}.json"
          done < <(jq -r '.[]' <<< "$RELEASE_TARGETS")

      - name: Download exact package receipt artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: mobile-package-receipt-v1-*-${{ inputs.platform }}-${{ inputs.source_ci_run_id }}-${{ inputs.source_ci_run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mobile/compare

      - name: Verify every selected package receipt
        env:
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          RELEASE_TARGETS: ${{ inputs.release_targets }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          expected_count="$(jq -r 'length' <<< "$RELEASE_TARGETS")"
          actual_count="$(find build/mobile/compare -name mobile-package-upload-receipt.json \
            -type f | wc -l | tr -d ' ')"
          test "$actual_count" = "$expected_count"
          while IFS= read -r release_target; do
            receipt_file="$(find build/mobile/compare -path \
              "*/mobile-package-receipt-v1-${release_target}-${SOURCE_CI_RUN_ID}-${SOURCE_CI_RUN_ATTEMPT}-${PRODUCER_RUN_ID}-${PRODUCER_RUN_ATTEMPT}/mobile-package-upload-receipt.json" \
              -type f -print -quit)"
            test -n "$receipt_file"
            receipt_dir="$(dirname "$receipt_file")"
            package_id="$(jq -er '.packageArtifact.id' "$receipt_file")"
            package_name="$(jq -er '.packageArtifact.name' "$receipt_file")"
            package_digest="$(jq -er '.packageArtifact.digest' "$receipt_file")"
            node tool/ci/package_mobile_release.mjs verify-upload \
              --receipt-dir "$receipt_dir" \
              --release-target "$release_target" \
              --source-sha "$SOURCE_SHA" \
              --ci-run-id "$SOURCE_CI_RUN_ID" \
              --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
              --producer-run-id "$PRODUCER_RUN_ID" \
              --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
              --package-artifact-id "$package_id" \
              --package-artifact-name "$package_name" \
              --package-artifact-digest "$package_digest"
          done < <(jq -r '.[]' <<< "$RELEASE_TARGETS")

      - name: Compare every selected cross-role platform pair
        env:
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          RELEASE_TARGETS: ${{ inputs.release_targets }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
        run: |
          set -euo pipefail
          suffix="${SOURCE_CI_RUN_ID}-${SOURCE_CI_RUN_ATTEMPT}-${PRODUCER_RUN_ID}-${PRODUCER_RUN_ATTEMPT}"
          for platform in ios android; do
            if jq -e --arg platform "$platform" '
              (index("consumer-" + $platform) != null) and
              (index("host-" + $platform) != null)
            ' <<< "$RELEASE_TARGETS" > /dev/null; then
              consumer="$(find build/mobile/compare -path \
                "*/mobile-package-receipt-v1-consumer-${platform}-${suffix}/package-policy-receipt.json" \
                -type f -print -quit)"
              host="$(find build/mobile/compare -path \
                "*/mobile-package-receipt-v1-host-${platform}-${suffix}/package-policy-receipt.json" \
                -type f -print -quit)"
              test -n "$consumer"
              test -n "$host"
              node tool/platform/check_mobile_package.mjs --compare "$consumer,$host"
            fi
          done

      - name: Create current-attempt completeness authority
        env:
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          RELEASE_TARGETS: ${{ inputs.release_targets }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          artifacts="$(jq -s 'sort_by(.releaseTarget)' build/mobile/attempt/entries/*.json)"
          ios_comparison="$(jq -r '
            if (index("consumer-ios") != null and index("host-ios") != null)
            then "passed" else "not-required" end
          ' <<< "$RELEASE_TARGETS")"
          android_comparison="$(jq -r '
            if (index("consumer-android") != null and index("host-android") != null)
            then "passed" else "not-required" end
          ' <<< "$RELEASE_TARGETS")"
          jq -n \
            --arg android_comparison "$android_comparison" \
            --arg ios_comparison "$ios_comparison" \
            --arg producer_attempt "$PRODUCER_RUN_ATTEMPT" \
            --arg producer_run_id "$PRODUCER_RUN_ID" \
            --arg source_attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --arg source_run_id "$SOURCE_CI_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --argjson artifacts "$artifacts" \
            --argjson release_targets "$RELEASE_TARGETS" '{
              schema: "catch.mobile-attempt-completeness-authority/v1",
              sourceCiRunId: $source_run_id,
              sourceCiRunAttempt: $source_attempt,
              sourceSha: $source_sha,
              producerRunId: $producer_run_id,
              producerRunAttempt: $producer_attempt,
              releaseTargets: $release_targets,
              crossRoleComparisons: {
                ios: $ios_comparison,
                android: $android_comparison
              },
              artifacts: $artifacts
            }' > build/mobile/attempt/mobile-attempt-completeness-authority.json
          node tool/ci/package_mobile_release.mjs verify-attempt \
            --authority build/mobile/attempt/mobile-attempt-completeness-authority.json \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --source-sha "$SOURCE_SHA" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --release-targets "$RELEASE_TARGETS"

      - name: Upload current-attempt completeness authority
        uses: actions/upload-artifact@v7
        with:
          name: mobile-attempt-completeness-v1-${{ inputs.platform }}-${{ inputs.source_ci_run_id }}-${{ inputs.source_ci_run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mobile/attempt/mobile-attempt-completeness-authority.json
          if-no-files-found: error
          retention-days: 90

  publish-authority:
    name: Publish verified mobile build authority
    needs: compare-role-packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      authority_artifact_id: ${{ steps.upload-authority.outputs.artifact-id }}
      authority_artifact_sha256: ${{ steps.upload-authority.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - name: Verify exact package and receipt artifact metadata
        env:
          EXPECTED_SOURCE_BUNDLE_NAME: ${{ inputs.source_bundle_name }}
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          RELEASE_TARGETS: ${{ inputs.release_targets }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_CI_RUN_NUMBER: ${{ inputs.source_ci_run_number }}
          SOURCE_CI_WORKFLOW_ID: ${{ inputs.source_ci_workflow_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          partial_attempt() {
            echo "::error::This mobile producer attempt is incomplete. Partial job reruns cannot mix evidence across attempts."
            echo "::error::Use Re-run all jobs for Mobile Internal Release."
            exit 64
          }
          current_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$PRODUCER_RUN_ID" \
            --argjson run_attempt "$PRODUCER_RUN_ATTEMPT" '
              .name == "Mobile Internal Release" and
              (.path | split("@")[0]) == ".github/workflows/mobile-internal-release.yml" and
              .event == "workflow_run" and
              .repository.full_name == $repository and
              (.id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              .status == "in_progress"
            ' <<< "$current_run" > /dev/null || partial_attempt

          mkdir -p \
            build/mobile/final/attempt \
            build/mobile/final/entries \
            build/mobile/final/packages \
            build/mobile/final/receipts
          artifact_pages="$(gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")"
          suffix="${SOURCE_CI_RUN_ID}-${SOURCE_CI_RUN_ATTEMPT}-${PRODUCER_RUN_ID}-${PRODUCER_RUN_ATTEMPT}"
          source_bundle_name="mobile-source-v1-${SOURCE_CI_RUN_ID}-${SOURCE_CI_RUN_ATTEMPT}-${PRODUCER_RUN_ID}-${PRODUCER_RUN_ATTEMPT}"
          attempt_name="mobile-attempt-completeness-v1-${{ inputs.platform }}-${suffix}"
          [[ "$EXPECTED_SOURCE_BUNDLE_NAME" == "$source_bundle_name" ]] || partial_attempt
          for artifact_name in "$source_bundle_name" "$attempt_name"; do
            count="$(jq -r --arg name "$artifact_name" \
              '[.[].artifacts[] | select(.expired == false and .name == $name)] | length' \
              <<< "$artifact_pages")"
            [[ "$count" == "1" ]] || partial_attempt
          done

          attempt_metadata="$(jq -c --arg name "$attempt_name" \
            '[.[].artifacts[] | select(.expired == false and .name == $name)][0]' \
            <<< "$artifact_pages")"
          attempt_id="$(jq -er '.id' <<< "$attempt_metadata")"
          attempt_digest="$(jq -er '.digest' <<< "$attempt_metadata")"
          [[ "$attempt_id" =~ ^[1-9][0-9]*$ && \
             "$attempt_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || partial_attempt
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$attempt_id/zip" \
            > build/mobile/final/attempt/attempt.zip
          test "sha256:$(sha256sum build/mobile/final/attempt/attempt.zip | awk '{print $1}')" = \
            "$attempt_digest"
          unzip -Z1 build/mobile/final/attempt/attempt.zip | \
            awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
          unzip -q build/mobile/final/attempt/attempt.zip -d build/mobile/final/attempt/content
          test "$(find build/mobile/final/attempt/content -type l | wc -l | tr -d ' ')" = "0"
          test "$(find build/mobile/final/attempt/content -type f | wc -l | tr -d ' ')" = "1"
          attempt_authority="build/mobile/final/attempt/content/mobile-attempt-completeness-authority.json"
          test -f "$attempt_authority"
          node tool/ci/package_mobile_release.mjs verify-attempt \
            --authority "$attempt_authority" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --source-sha "$SOURCE_SHA" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --release-targets "$RELEASE_TARGETS"

          expected_count="$(( $(jq -r 'length' <<< "$RELEASE_TARGETS") * 2 ))"
          current_count="$(jq -r --arg suffix "-${{ inputs.platform }}-$suffix" '
            [.[].artifacts[] |
              select(
                .expired == false and
                ((.name | startswith("mobile-package-v1-")) or
                 (.name | startswith("mobile-package-receipt-v1-"))) and
                (.name | endswith($suffix))
              )
            ] | length
          ' <<< "$artifact_pages")"
          if [[ "$current_count" != "$expected_count" ]]; then
            partial_attempt
          fi

          while IFS= read -r release_target; do
            package_name="mobile-package-v1-${release_target}-${suffix}"
            receipt_name="mobile-package-receipt-v1-${release_target}-${suffix}"
            for artifact_name in "$package_name" "$receipt_name"; do
              count="$(jq -r --arg name "$artifact_name" \
                '[.[].artifacts[] | select(.expired == false and .name == $name)] | length' \
                <<< "$artifact_pages")"
              if [[ "$count" != "1" ]]; then
                echo "Expected exactly one artifact named $artifact_name; found $count."
                exit 64
              fi
            done
            package_metadata="$(jq -c --arg name "$package_name" \
              '[.[].artifacts[] | select(.expired == false and .name == $name)][0]' \
              <<< "$artifact_pages")"
            receipt_metadata="$(jq -c --arg name "$receipt_name" \
              '[.[].artifacts[] | select(.expired == false and .name == $name)][0]' \
              <<< "$artifact_pages")"
            package_id="$(jq -er '.id' <<< "$package_metadata")"
            package_digest="$(jq -er '.digest' <<< "$package_metadata")"
            receipt_id="$(jq -er '.id' <<< "$receipt_metadata")"
            receipt_digest="$(jq -er '.digest' <<< "$receipt_metadata")"
            [[ "$package_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$receipt_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$package_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$receipt_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

            jq -e \
              --arg package_digest "$package_digest" \
              --arg package_name "$package_name" \
              --arg receipt_digest "$receipt_digest" \
              --arg receipt_name "$receipt_name" \
              --arg release_target "$release_target" \
              --argjson package_id "$package_id" \
              --argjson receipt_id "$receipt_id" '
                [.artifacts[] | select(.releaseTarget == $release_target)] as $entry |
                ($entry | length) == 1 and
                $entry[0].packageArtifact == {
                  id: $package_id,
                  name: $package_name,
                  digest: $package_digest
                } and
                $entry[0].receiptArtifact == {
                  id: $receipt_id,
                  name: $receipt_name,
                  digest: $receipt_digest
                }
              ' "$attempt_authority" > /dev/null || partial_attempt

            package_root="build/mobile/final/packages/$release_target"
            mkdir -p "$package_root/content"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$package_id/zip" \
              > "$package_root/package.zip"
            test "sha256:$(sha256sum "$package_root/package.zip" | awk '{print $1}')" = \
              "$package_digest"
            unzip -Z1 "$package_root/package.zip" | \
              awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
            unzip -q "$package_root/package.zip" -d "$package_root/content"
            test "$(find "$package_root/content" -type l | wc -l | tr -d ' ')" = "0"
            node tool/ci/package_mobile_release.mjs verify \
              --package-dir "$package_root/content" \
              --release-target "$release_target" \
              --source-sha "$SOURCE_SHA" \
              --ci-run-id "$SOURCE_CI_RUN_ID" \
              --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
              --producer-run-id "$PRODUCER_RUN_ID" \
              --producer-run-attempt "$PRODUCER_RUN_ATTEMPT"

            receipt_root="build/mobile/final/receipts/$release_target"
            mkdir -p "$receipt_root/content"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$receipt_id/zip" \
              > "$receipt_root/receipt.zip"
            test "sha256:$(sha256sum "$receipt_root/receipt.zip" | awk '{print $1}')" = \
              "$receipt_digest"
            unzip -Z1 "$receipt_root/receipt.zip" | \
              awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
            unzip -q "$receipt_root/receipt.zip" -d "$receipt_root/content"
            test "$(find "$receipt_root/content" -type l | wc -l | tr -d ' ')" = "0"
            test "$(find "$receipt_root/content" -type f | wc -l | tr -d ' ')" = "2"
            node tool/ci/package_mobile_release.mjs verify-upload \
              --receipt-dir "$receipt_root/content" \
              --release-target "$release_target" \
              --source-sha "$SOURCE_SHA" \
              --ci-run-id "$SOURCE_CI_RUN_ID" \
              --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
              --producer-run-id "$PRODUCER_RUN_ID" \
              --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
              --package-artifact-id "$package_id" \
              --package-artifact-name "$package_name" \
              --package-artifact-digest "$package_digest"
            upload_receipt="$receipt_root/content/mobile-package-upload-receipt.json"
            jq -S . "$package_root/content/mobile-package-receipt.json" \
              > "$package_root/package-receipt.sorted.json"
            jq -S '.packageReceipt' "$upload_receipt" \
              > "$receipt_root/upload-package-receipt.sorted.json"
            cmp "$package_root/package-receipt.sorted.json" \
              "$receipt_root/upload-package-receipt.sorted.json"
            jq -n \
              --arg package_digest "$package_digest" \
              --arg package_name "$package_name" \
              --arg receipt_digest "$receipt_digest" \
              --arg receipt_name "$receipt_name" \
              --arg release_target "$release_target" \
              --argjson package_id "$package_id" \
              --argjson receipt_id "$receipt_id" \
              --slurpfile package_receipt \
                "$package_root/content/mobile-package-receipt.json" '{
                releaseTarget: $release_target,
                artifactSha256: $package_receipt[0].artifact.sha256,
                provenanceManifestSha256:
                  $package_receipt[0].provenance.manifestSha256,
                packageArtifact: {
                  id: $package_id,
                  name: $package_name,
                  digest: $package_digest
                },
                receiptArtifact: {
                  id: $receipt_id,
                  name: $receipt_name,
                  digest: $receipt_digest
                }
              }' > "build/mobile/final/entries/${release_target}.json"
          done < <(jq -r '.[]' <<< "$RELEASE_TARGETS")

          for platform in ios android; do
            if jq -e --arg platform "$platform" '
              (index("consumer-" + $platform) != null) and
              (index("host-" + $platform) != null)
            ' <<< "$RELEASE_TARGETS" > /dev/null; then
              node tool/platform/check_mobile_package.mjs --compare \
                "build/mobile/final/packages/consumer-${platform}/content/package-policy-receipt.json,build/mobile/final/packages/host-${platform}/content/package-policy-receipt.json"
            fi
          done

          packages="$(jq -s 'sort_by(.releaseTarget)' build/mobile/final/entries/*.json)"
          ios_comparison="$(jq -r '
            if (index("consumer-ios") != null and index("host-ios") != null)
            then "passed" else "not-required" end
          ' <<< "$RELEASE_TARGETS")"
          android_comparison="$(jq -r '
            if (index("consumer-android") != null and index("host-android") != null)
            then "passed" else "not-required" end
          ' <<< "$RELEASE_TARGETS")"
          jq -n \
            --arg android_comparison "$android_comparison" \
            --arg ios_comparison "$ios_comparison" \
            --arg producer_attempt "$PRODUCER_RUN_ATTEMPT" \
            --arg producer_run_id "$PRODUCER_RUN_ID" \
            --arg source_attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --arg source_run_id "$SOURCE_CI_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --argjson packages "$packages" \
            --argjson release_targets "$RELEASE_TARGETS" \
            --argjson source_run_number "$SOURCE_CI_RUN_NUMBER" \
            --argjson source_workflow_id "$SOURCE_CI_WORKFLOW_ID" '{
              schema: "catch.mobile-build-authority/v2",
              platform: "${{ inputs.platform }}",
              sourceCiWorkflowId: $source_workflow_id,
              sourceCiRunNumber: $source_run_number,
              sourceCiRunId: $source_run_id,
              sourceCiRunAttempt: $source_attempt,
              sourceSha: $source_sha,
              producerRunId: $producer_run_id,
              producerRunAttempt: $producer_attempt,
              releaseTargets: $release_targets,
              crossRoleComparisons: {
                ios: $ios_comparison,
                android: $android_comparison
              },
              packages: $packages
            }' > build/mobile/final/mobile-build-authority.json
          node tool/ci/package_mobile_release.mjs verify-authority \
            --authority build/mobile/final/mobile-build-authority.json \
            --ci-workflow-id "$SOURCE_CI_WORKFLOW_ID" \
            --ci-run-number "$SOURCE_CI_RUN_NUMBER" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --source-sha "$SOURCE_SHA" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --release-targets "$RELEASE_TARGETS"

      - name: Reconfirm source CI attempt is still current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_CI_RUN_NUMBER: ${{ inputs.source_ci_run_number }}
          SOURCE_CI_WORKFLOW_ID: ${{ inputs.source_ci_workflow_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          latest_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID")"
          if ! jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$SOURCE_CI_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --argjson run_attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --argjson run_number "$SOURCE_CI_RUN_NUMBER" \
            --argjson workflow_id "$SOURCE_CI_WORKFLOW_ID" '
              .name == "CI" and
              (.path | split("@")[0]) == ".github/workflows/ci.yml" and
              .workflow_id == $workflow_id and
              .event == "push" and
              .head_branch == "main" and
              .head_repository.full_name == $repository and
              (.id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              .run_number == $run_number and
              .head_sha == $source_sha and
              .status == "completed" and
              .conclusion == "success"
            ' <<< "$latest_run" > /dev/null; then
            echo "::error::Source CI was re-run while mobile packages were building; this attempt is obsolete."
            exit 64
          fi

      - id: upload-authority
        name: Upload post-comparison mobile build authority
        uses: actions/upload-artifact@v7
        with:
          name: mobile-build-authority-v2-${{ inputs.platform }}-${{ inputs.source_ci_workflow_id }}-${{ inputs.source_ci_run_number }}-${{ inputs.source_ci_run_id }}-${{ inputs.source_ci_run_attempt }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mobile/final/mobile-build-authority.json
          if-no-files-found: error
          retention-days: 90

