name: Wedding Phone Import Callable Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Confirm the exact audited CI source commit.
        required: true
        type: string
      reason:
        description: Single-line operator reason for the protected PROD release.
        required: true
        type: string
      confirm_one_callable:
        description: Confirm only importWeddingPhoneContacts; keep both activation controls closed.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: read
  id-token: write

# Separate additive caller shares Delivery locks; no full inventory deployment
# or activation-control write. PROD retains configured human environment review.
concurrency:
  group: backend-delivery
  cancel-in-progress: false

jobs:
  authorize:
    name: Verify one immutable candidate and exact operator scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Pin reviewed main, CI producer and package before PROD review
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REASON: ${{ inputs.reason }}
          CONFIRM: ${{ inputs.confirm_one_callable }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$CONFIRM" = true
          test "$REQUESTED_SHA" = f509e144579403bd3dd66fc39ae0ee821ca0ab30
          (( ${#REASON} >= 12 && ${#REASON} <= 240 ))
          [[ "$REASON" != *$'\r'* && "$REASON" != *$'\n'* ]]
          [[ "$REASON" =~ [^[:space:]] ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$REQUESTED_SHA" "$GITHUB_SHA"
          node tool/ci/wedding_phone_import_release.mjs source --current-main "$GITHUB_SHA" --source-root .
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/37349803226/attempts/1" | jq -e '
            .status == "completed" and .conclusion == "success" and
            .event == "push" and .head_branch == "main" and
            .head_sha == "f509e144579403bd3dd66fc39ae0ee821ca0ab30" and
            .run_attempt == 1 and .workflow_id == 320377139
          ' > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11362334310" | jq -e '
            .id == 11362334310 and .expired == false and
            .name == "firebase-delivery-f509e144579403bd3dd66fc39ae0ee821ca0ab30-1" and
            .digest == "sha256:75d8fa915af23289467f63765ac92a9719ea8f0dcd24679fb16c58f914fd7e75" and
            .workflow_run.id == 37349803226
          ' > /dev/null

  dev:
    name: Exact one-callable DEV promotion
    needs: authorize
    if: ${{ needs.authorize.result == 'success' }}
    uses: ./.github/workflows/_firebase-promote.yml
    with:
      environment: dev
      control_plane_sha: ${{ github.sha }}
      source_sha: f509e144579403bd3dd66fc39ae0ee821ca0ab30
      base_sha: f7d2605cabbef640212b88a95002f515028437a3
      source_ci_run_id: '37349803226'
      source_ci_run_attempt: '1'
      wedding_phone_import_release: true
    secrets: inherit

  prod:
    name: Exact one-callable PROD promotion
    needs: [authorize, dev]
    if: ${{ needs.dev.result == 'success' }}
    uses: ./.github/workflows/_firebase-promote.yml
    with:
      environment: prod
      control_plane_sha: ${{ github.sha }}
      source_sha: f509e144579403bd3dd66fc39ae0ee821ca0ab30
      base_sha: f7d2605cabbef640212b88a95002f515028437a3
      source_ci_run_id: '37349803226'
      source_ci_run_attempt: '1'
      wedding_phone_import_release: true
      dev_completion_receipt_sha256: ${{ needs.dev.outputs.wedding_receipt_sha256 }}
      dev_completion_artifact_id: ${{ needs.dev.outputs.wedding_artifact_id }}
      dev_completion_artifact_digest: ${{ needs.dev.outputs.wedding_artifact_digest }}
    secrets: inherit
