name: App Capture Freshness

on:
  workflow_call:

permissions:
  contents: read

jobs:
  freshness:
    name: Check app capture provenance and website copies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Check capture provenance and website image bytes
        run: node tool/marketing/sync_website_media.mjs --check
      - name: Check derived screenshot design metadata
        run: node tool/marketing/export_app_screenshots.mjs --check-design-json
