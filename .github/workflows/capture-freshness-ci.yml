name: App Capture Freshness

on:
  workflow_call:
    outputs:
      capture_binding:
        description: Exact source and immutable canonical capture artifact identity.
        value: ${{ jobs.freshness.outputs.capture_binding }}

permissions:
  contents: read

jobs:
  freshness:
    name: Produce exact-source canonical captures
    uses: ./.github/workflows/marketing-captures.yml
    with:
      automatic_source_sha: ${{ github.sha }}
