name: Operations CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operations:
    name: Operations platform
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: operations/package-lock.json

      - name: Install Operations dependencies
        run: npm --prefix operations ci

      - name: Run Operations contracts, tests, boundaries, and CLI smoke
        run: npm --prefix operations run check
