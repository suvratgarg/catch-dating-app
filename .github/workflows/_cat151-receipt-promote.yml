name: Protected CAT151 receipt-only promotion
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      control_plane_sha:
        required: true
        type: string
      dev_completion_artifact_id:
        default: ""
        type: string
      dev_completion_artifact_digest:
        default: ""
        type: string
      dev_completion_receipt_sha256:
        default: ""
        type: string
    outputs:
      receipt_sha256:
        value: ${{ jobs.promote-cat151-receipt.outputs.receipt_sha256 }}
      artifact_id:
        value: ${{ jobs.promote-cat151-receipt.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.promote-cat151-receipt.outputs.artifact_digest }}
permissions:
  actions: read
  contents: read
  pull-requests: read
  id-token: write
jobs:
  promote-cat151-receipt:
    name: CAT151 order receipt ${{ inputs.environment }} promotion
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    concurrency:
      group: firebase-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      receipt_sha256: ${{ steps.cat151-proof.outputs.receipt_sha256 }}
      artifact_id: ${{ steps.cat151-receipt.outputs.artifact-id }}
      artifact_digest: ${{ steps.cat151-receipt.outputs.artifact-digest }}
    steps:
      - name: Validate the fixed receipt caller and reject all extra inputs
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/selective-backend-release.yml@refs/heads/main"
          jq -e '
            (keys | sort) == (["environment", "control_plane_sha", "dev_completion_artifact_id", "dev_completion_artifact_digest", "dev_completion_receipt_sha256"] | sort) and
            (.environment == "dev" or .environment == "prod") and .control_plane_sha == env.GITHUB_SHA and
            (if .environment == "dev" then
              .dev_completion_artifact_id == "" and .dev_completion_artifact_digest == "" and .dev_completion_receipt_sha256 == ""
            else (.dev_completion_artifact_id | test("^[1-9][0-9]*$")) and
              (.dev_completion_artifact_digest | test("^[a-f0-9]{64}$")) and (.dev_completion_receipt_sha256 | test("^[a-f0-9]{64}$")) end)
          ' <<< "$INPUTS" > /dev/null

      - name: Require recorded human PROD environment approval for operator release
        if: ${{ inputs.environment == 'prod' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment="$(gh api "repos/$GITHUB_REPOSITORY/environments/prod")"
          history="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals")"
          jq -en --argjson environment "$environment" --argjson history "$history" '
            ([ $environment.protection_rules[]? | select(.type == "required_reviewers") |
              .reviewers[]? | select(.type == "User") | .reviewer.id ]) as $reviewers |
            ($reviewers | length) > 0 and
            ([ $history[]? | select(any(.environments[]?; .id == $environment.id and .name == "prod")) ]
              | length) > 0 and
            ([ $history[]? | select(any(.environments[]?; .id == $environment.id and .name == "prod")) |
              select(.state != "approved") ] | length) == 0 and
            any($history[]?;
              .state == "approved" and .user.id != null and
              (.user.id as $reviewer_id | ($reviewers | index($reviewer_id)) != null) and
              any(.environments[]?; .id == $environment.id and .name == "prod"))
          ' > /dev/null

      - name: Checkout the immutable CAT151 control plane
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.control_plane_sha }}
          fetch-depth: 0
      - name: Checkout the exact CI-approved CAT151 source
        uses: actions/checkout@v6
        with:
          ref: bbff52defd3c0dfb8df7c78c336c6549af7df47a
          fetch-depth: 0
          path: build/delivery/source-checkout
      - name: Verify current control plane, reviewed source compatibility and immutable producer
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_PLANE_SHA: ${{ inputs.control_plane_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_SHA"
          git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          test "$(git rev-parse refs/remotes/origin/main)" = "$CONTROL_PLANE_SHA"
          test "$(git -C build/delivery/source-checkout rev-parse HEAD)" = bbff52defd3c0dfb8df7c78c336c6549af7df47a
          git -C build/delivery/source-checkout fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          node tool/ci/cat151_receipt_release.mjs source \
            --current-main "$CONTROL_PLANE_SHA" --source-root build/delivery/source-checkout
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38931076239/attempts/1" | jq -e '
            .status == "completed" and .conclusion == "success" and .event == "push" and
            .head_branch == "main" and .head_sha == "bbff52defd3c0dfb8df7c78c336c6549af7df47a" and
            .run_attempt == 1 and .workflow_id == 320377139
          ' > /dev/null
          mkdir -p build/delivery/source
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12059462962" > build/delivery/cat151-artifact.json
          node tool/ci/cat151_receipt_release.mjs artifact --metadata build/delivery/cat151-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12059462962/zip" > build/delivery/cat151.zip
          node tool/ci/cat151_receipt_release.mjs archive --archive build/delivery/cat151.zip
          test "$(unzip -Z1 build/delivery/cat151.zip | LC_ALL=C sort)" = "$(printf '%s\n' firebase-backend.tar.gz firebase-provenance.json)"
          unzip -q build/delivery/cat151.zip -d build/delivery/source
          node tool/ci/cat151_receipt_release.mjs provenance --manifest build/delivery/source/firebase-provenance.json

      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the pinned source-analysis parser
        run: npm ci --ignore-scripts --workspaces=false
      - id: verify
        name: Verify the complete immutable package and derive only the CAT151 target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tool/ci/delivery_core.mjs verify \
            --manifest build/delivery/source/firebase-provenance.json --artifact build/delivery/source/firebase-backend.tar.gz \
            --source-sha bbff52defd3c0dfb8df7c78c336c6549af7df47a --ci-run-id 38931076239 --ci-run-attempt 1
          mkdir -p build/delivery/package
          tar -tzf build/delivery/source/firebase-backend.tar.gz | awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
          tar -xzf build/delivery/source/firebase-backend.tar.gz -C build/delivery/package
          node tool/ci/package_firebase_delivery.mjs verify \
            --source-root build/delivery/source-checkout --package-dir build/delivery/package \
            --source-sha bbff52defd3c0dfb8df7c78c336c6549af7df47a --base-sha 2f3d78db47343a0a363e619ee7dddc9cf8ad1199 \
            --ci-run-id 38931076239 --ci-run-attempt 1 --provenance-manifest build/delivery/source/firebase-provenance.json \
            --affected-functions true > build/delivery/package-plan.json
          node tool/ci/backend_source_review.mjs --source-root build/delivery/source-checkout \
            --repository "$GITHUB_REPOSITORY" < build/delivery/package-plan.json > build/delivery/cat151-source-review.json
          node tool/ci/cat151_receipt_release.mjs prepare \
            --manifest build/delivery/source/firebase-provenance.json --package-plan build/delivery/package-plan.json \
            --output build/delivery/execution-plan.json
          environment='${{ inputs.environment }}'
          case "$environment" in dev) project=catchdates-dev ;; prod) project=catch-dating-app-64e51 ;; *) exit 64 ;; esac
          test "$(jq -er --arg environment "$environment" '.projects[$environment]' build/delivery/package/.firebaserc)" = "$project"
          echo "project_id=$project" >> "$GITHUB_OUTPUT"
          echo 'targets=functions:createRazorpayOrder' >> "$GITHUB_OUTPUT"
          echo 'has_targets=true' >> "$GITHUB_OUTPUT"
          echo 'has_functions=true' >> "$GITHUB_OUTPUT"

      - name: Verify this run's successful DEV receipt before PROD credentials
        if: ${{ inputs.environment == 'prod' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_ARTIFACT_ID: ${{ inputs.dev_completion_artifact_id }}
          DEV_ARTIFACT_DIGEST: ${{ inputs.dev_completion_artifact_digest }}
          DEV_RECEIPT_SHA256: ${{ inputs.dev_completion_receipt_sha256 }}
        run: |
          set -euo pipefail
          dev_run="$GITHUB_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEV_ARTIFACT_ID" | jq -e \
            --arg id "$DEV_ARTIFACT_ID" --arg run "$dev_run" --arg digest "sha256:$DEV_ARTIFACT_DIGEST" \
            '.id == ($id|tonumber) and .workflow_run.id == ($run|tonumber) and .expired == false and .digest == $digest and
             .name == ("cat151-receipt-selected-only-dev-" + $run + "-1")' > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEV_ARTIFACT_ID/zip" > build/delivery/dev.zip
          test "$(sha256sum build/delivery/dev.zip | cut -d' ' -f1)" = "$DEV_ARTIFACT_DIGEST"
          test "$(unzip -Z1 build/delivery/dev.zip | grep -xc cat151-completion.json)" = 1
          unzip -p build/delivery/dev.zip cat151-completion.json > build/delivery/dev-completion.json
          test "$(sha256sum build/delivery/dev-completion.json | cut -d' ' -f1)" = "$DEV_RECEIPT_SHA256"
          node tool/ci/cat151_receipt_release.mjs verify-dev --receipt build/delivery/dev-completion.json \
            --manifest build/delivery/source/firebase-provenance.json

      - name: Authenticate to Google Cloud after protected approval and provenance
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      - name: Install authenticated Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Capture all retained Functions, Extensions and protected configuration
        run: node tool/ci/cat151_receipt_release.mjs before --environment "${{ inputs.environment }}" --output build/delivery/cat151-before.json
      - name: Retain the immutable predeployment proof
        uses: actions/upload-artifact@v6
        with:
          name: cat151-receipt-before-${{ inputs.environment }}-${{ github.run_id }}-1
          path: build/delivery/cat151-before.json
          if-no-files-found: error
          retention-days: 90

      - name: Record names-only Functions parameter provenance
        if: ${{ steps.verify.outputs.has_functions == 'true' }}
        env:
          ALGOLIA_APPLICATION_ID: ${{ vars.ALGOLIA_APPLICATION_ID }}
          RAZORPAY_PUBLIC_KEY_ID: ${{ vars.RAZORPAY_PUBLIC_KEY_ID }}
          FLIGHT_PROVIDER_CONFIG_VERSION: ${{ vars.FLIGHT_PROVIDER_CONFIG_VERSION }}
          FLIGHT_WEBHOOK_BASE_URL: ${{ vars.FLIGHT_WEBHOOK_BASE_URL }}
          FORM_RAZORPAY_PARTNER_CONFIG_VERSION: ${{ vars.FORM_RAZORPAY_PARTNER_CONFIG_VERSION }}
          RAZORPAY_PLATFORM_PAYMENT_CONFIG_VERSION: ${{ vars.RAZORPAY_PLATFORM_PAYMENT_CONFIG_VERSION }}
          META_WHATSAPP_APP_ID: ${{ vars.META_WHATSAPP_APP_ID }}
          META_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID: ${{ vars.META_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID }}
          META_WHATSAPP_GRAPH_VERSION: ${{ vars.META_WHATSAPP_GRAPH_VERSION }}
          META_WHATSAPP_ENABLED: ${{ vars.META_WHATSAPP_ENABLED }}
          CATCH_WHATSAPP_WEBHOOK_ENABLED: ${{ vars.CATCH_WHATSAPP_WEBHOOK_ENABLED }}
          # Non-secret scoped settings only; runtime readiness remains mandatory.
          CATCH_WHATSAPP_RECEIPT_CONSUMERS_ENABLED: ${{ vars.CATCH_WHATSAPP_RECEIPT_CONSUMERS_ENABLED }}
          CATCH_WHATSAPP_REPLIES_ENABLED: ${{ vars.CATCH_WHATSAPP_REPLIES_ENABLED }}
          CATCH_WHATSAPP_ATOMIC_STOP_INGRESS_READY: ${{ vars.CATCH_WHATSAPP_ATOMIC_STOP_INGRESS_READY }}
          CATCH_WHATSAPP_REPLY_ACTOR_UID: ${{ vars.CATCH_WHATSAPP_REPLY_ACTOR_UID }}
          CATCH_WHATSAPP_REPLY_RECIPIENT_UID: ${{ vars.CATCH_WHATSAPP_REPLY_RECIPIENT_UID }}
          CATCH_WHATSAPP_REPLY_RECIPIENT_E164: ${{ vars.CATCH_WHATSAPP_REPLY_RECIPIENT_E164 }}
          CATCH_WHATSAPP_REPLY_CREDENTIAL_VERSION: ${{ vars.CATCH_WHATSAPP_REPLY_CREDENTIAL_VERSION }}
          CATCH_WHATSAPP_REPLY_GRAPH_VERSION: ${{ vars.CATCH_WHATSAPP_REPLY_GRAPH_VERSION }}
          CATCH_WHATSAPP_REPLY_EVIDENCE_SHA256: ${{ vars.CATCH_WHATSAPP_REPLY_EVIDENCE_SHA256 }}
          CATCH_WHATSAPP_WABA_ID: ${{ vars.CATCH_WHATSAPP_WABA_ID }}
          CATCH_WHATSAPP_PHONE_NUMBER_ID: ${{ vars.CATCH_WHATSAPP_PHONE_NUMBER_ID }}
          EVENT_ASSISTANCE_GUEST_KEY_VERSION: ${{ vars.EVENT_ASSISTANCE_GUEST_KEY_VERSION }}
          EVENT_ASSISTANCE_RCS_WEBHOOK_KEY_VERSION: ${{ vars.EVENT_ASSISTANCE_RCS_WEBHOOK_KEY_VERSION }}
          EVENT_ASSISTANCE_RCS_ENABLED: ${{ vars.EVENT_ASSISTANCE_RCS_ENABLED }}
          EVENT_ASSISTANCE_RCS_WEBHOOK_ENABLED: ${{ vars.EVENT_ASSISTANCE_RCS_WEBHOOK_ENABLED }}
          EVENT_ASSISTANCE_SMS_REPORTS_ENABLED: ${{ vars.EVENT_ASSISTANCE_SMS_REPORTS_ENABLED }}
        run: |
          set -euo pipefail
          node tool/firebase/prepare_functions_params_for_deploy.mjs \
            --provenance-only --project "${{ steps.verify.outputs.project_id }}" \
            --source-sha "bbff52defd3c0dfb8df7c78c336c6549af7df47a" \
            --output build/delivery/params-provenance.json

      - name: Verify environment prerequisites for the approved targets
        if: ${{ steps.verify.outputs.has_targets == 'true' }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_TARGETS: ${{ steps.verify.outputs.targets }}
          SOURCE_SHA: bbff52defd3c0dfb8df7c78c336c6549af7df47a
          HAS_FUNCTIONS: ${{ steps.verify.outputs.has_functions }}
        run: |
          set -euo pipefail
          args=(--env "$DEPLOY_ENVIRONMENT" --targets "$DEPLOY_TARGETS"
            --source-root build/delivery/source-checkout --source-sha "$SOURCE_SHA")
          if [[ "$HAS_FUNCTIONS" == "true" ]]; then
            args+=(--phase candidate --params-provenance build/delivery/params-provenance.json
              --write-candidate build/delivery/secret-bindings.json)
          fi
          node tool/firebase/check_environment_readiness.mjs "${args[@]}"

      - name: Install Firebase CLI
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm install -g firebase-tools@${{ steps.toolchain.outputs.firebase-tools-version }}; then
              exit 0
            fi
            if [[ "$attempt" = 3 ]]; then exit 1; fi
            sleep 10
          done

      - name: Create a separate deploy tree
        run: |
          test ! -e build/delivery/deploy-tree
          cp -a build/delivery/package build/delivery/deploy-tree

      - name: Install runtime dependencies only in the deploy tree
        if: ${{ steps.verify.outputs.has_functions == 'true' }}
        run: >-
          npm --prefix build/delivery/deploy-tree/functions ci
          --omit=dev --ignore-scripts

      - name: Reverify package, deploy bytes, current source and unchanged protected resources
        env:
          CATCH_DEPLOY_ALLOW_BEHIND: '1'
          CATCH_DELIVERY_FUNCTIONS_DIR: build/delivery/deploy-tree/functions
          CATCH_FIREBASE_SOURCE_ROOT: build/delivery/source-checkout
        run: |
          set -euo pipefail
          node tool/ci/delivery_core.mjs verify \
            --manifest build/delivery/source/firebase-provenance.json --artifact build/delivery/source/firebase-backend.tar.gz \
            --source-sha bbff52defd3c0dfb8df7c78c336c6549af7df47a --ci-run-id 38931076239 --ci-run-attempt 1
          node tool/ci/cat151_receipt_release.mjs provenance --manifest build/delivery/source/firebase-provenance.json
          node tool/ci/package_firebase_delivery.mjs verify \
            --source-root build/delivery/source-checkout --package-dir build/delivery/deploy-tree \
            --source-sha bbff52defd3c0dfb8df7c78c336c6549af7df47a --base-sha 2f3d78db47343a0a363e619ee7dddc9cf8ad1199 \
            --ci-run-id 38931076239 --ci-run-attempt 1 --provenance-manifest build/delivery/source/firebase-provenance.json \
            --allow-runtime-dependencies true --trusted-package-dir build/delivery/package --affected-functions true \
            > build/delivery/reverified-plan.json
          cmp build/delivery/package-plan.json build/delivery/reverified-plan.json
          node tool/ci/cat151_receipt_release.mjs prepare \
            --manifest build/delivery/source/firebase-provenance.json --package-plan build/delivery/reverified-plan.json \
            --output build/delivery/cat151-reverified-plan.json
          cmp build/delivery/execution-plan.json build/delivery/cat151-reverified-plan.json

      - name: Materialize non-secret Functions params in the deploy copy
        if: ${{ steps.verify.outputs.has_functions == 'true' }}
        env:
          ALGOLIA_APPLICATION_ID: ${{ vars.ALGOLIA_APPLICATION_ID }}
          RAZORPAY_PUBLIC_KEY_ID: ${{ vars.RAZORPAY_PUBLIC_KEY_ID }}
          FLIGHT_PROVIDER_CONFIG_VERSION: ${{ vars.FLIGHT_PROVIDER_CONFIG_VERSION }}
          FLIGHT_WEBHOOK_BASE_URL: ${{ vars.FLIGHT_WEBHOOK_BASE_URL }}
          FORM_RAZORPAY_PARTNER_CONFIG_VERSION: ${{ vars.FORM_RAZORPAY_PARTNER_CONFIG_VERSION }}
          RAZORPAY_PLATFORM_PAYMENT_CONFIG_VERSION: ${{ vars.RAZORPAY_PLATFORM_PAYMENT_CONFIG_VERSION }}
          META_WHATSAPP_APP_ID: ${{ vars.META_WHATSAPP_APP_ID }}
          META_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID: ${{ vars.META_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID }}
          META_WHATSAPP_GRAPH_VERSION: ${{ vars.META_WHATSAPP_GRAPH_VERSION }}
          META_WHATSAPP_ENABLED: ${{ vars.META_WHATSAPP_ENABLED }}
          CATCH_WHATSAPP_WEBHOOK_ENABLED: ${{ vars.CATCH_WHATSAPP_WEBHOOK_ENABLED }}
          # Non-secret scoped settings only; runtime readiness remains mandatory.
          CATCH_WHATSAPP_RECEIPT_CONSUMERS_ENABLED: ${{ vars.CATCH_WHATSAPP_RECEIPT_CONSUMERS_ENABLED }}
          CATCH_WHATSAPP_REPLIES_ENABLED: ${{ vars.CATCH_WHATSAPP_REPLIES_ENABLED }}
          CATCH_WHATSAPP_ATOMIC_STOP_INGRESS_READY: ${{ vars.CATCH_WHATSAPP_ATOMIC_STOP_INGRESS_READY }}
          CATCH_WHATSAPP_REPLY_ACTOR_UID: ${{ vars.CATCH_WHATSAPP_REPLY_ACTOR_UID }}
          CATCH_WHATSAPP_REPLY_RECIPIENT_UID: ${{ vars.CATCH_WHATSAPP_REPLY_RECIPIENT_UID }}
          CATCH_WHATSAPP_REPLY_RECIPIENT_E164: ${{ vars.CATCH_WHATSAPP_REPLY_RECIPIENT_E164 }}
          CATCH_WHATSAPP_REPLY_CREDENTIAL_VERSION: ${{ vars.CATCH_WHATSAPP_REPLY_CREDENTIAL_VERSION }}
          CATCH_WHATSAPP_REPLY_GRAPH_VERSION: ${{ vars.CATCH_WHATSAPP_REPLY_GRAPH_VERSION }}
          CATCH_WHATSAPP_REPLY_EVIDENCE_SHA256: ${{ vars.CATCH_WHATSAPP_REPLY_EVIDENCE_SHA256 }}
          CATCH_WHATSAPP_WABA_ID: ${{ vars.CATCH_WHATSAPP_WABA_ID }}
          CATCH_WHATSAPP_PHONE_NUMBER_ID: ${{ vars.CATCH_WHATSAPP_PHONE_NUMBER_ID }}
          EVENT_ASSISTANCE_GUEST_KEY_VERSION: ${{ vars.EVENT_ASSISTANCE_GUEST_KEY_VERSION }}
          EVENT_ASSISTANCE_RCS_WEBHOOK_KEY_VERSION: ${{ vars.EVENT_ASSISTANCE_RCS_WEBHOOK_KEY_VERSION }}
          EVENT_ASSISTANCE_RCS_ENABLED: ${{ vars.EVENT_ASSISTANCE_RCS_ENABLED }}
          EVENT_ASSISTANCE_RCS_WEBHOOK_ENABLED: ${{ vars.EVENT_ASSISTANCE_RCS_WEBHOOK_ENABLED }}
          EVENT_ASSISTANCE_SMS_REPORTS_ENABLED: ${{ vars.EVENT_ASSISTANCE_SMS_REPORTS_ENABLED }}
        run: |
          set -euo pipefail
          functions_dir=build/delivery/deploy-tree/functions
          if [[ -d "$functions_dir" ]]; then
            node tool/firebase/prepare_functions_params_for_deploy.mjs \
              --functions-dir "$functions_dir" \
              --project "${{ steps.verify.outputs.project_id }}" \
              --source-sha "bbff52defd3c0dfb8df7c78c336c6549af7df47a" \
              --provenance build/delivery/params-provenance.json
          else
            echo "Verified package has no Functions payload; skipping Functions parameter materialization."
          fi

          node tool/ci/cat151_receipt_release.mjs params --environment "${{ inputs.environment }}" \
            --params-file build/delivery/deploy-tree/functions/.env.${{ steps.verify.outputs.project_id }} \
            --provenance build/delivery/params-provenance.json --output build/delivery/cat151-params-binding.json

      - name: Gate Functions param coverage before any deploy mutation
        if: ${{ steps.verify.outputs.has_functions == 'true' }}
        env:
          PROJECT_ID: ${{ steps.verify.outputs.project_id }}
        run: |
          set -euo pipefail
          functions_dir=build/delivery/deploy-tree/functions
          if [[ -d "$functions_dir" ]]; then
            node tool/firebase/check_functions_params_coverage.mjs \
              --functions-dir build/delivery/source-checkout/functions \
              --env-file "$functions_dir/.env.$PROJECT_ID"
          else
            echo "Verified package has no Functions payload; skipping Functions parameter coverage gate."
          fi

      - name: Recheck exact source, parameters and all retained resources at the mutation boundary
        env:
          CATCH_DEPLOY_ALLOW_BEHIND: '1'
          CATCH_DELIVERY_FUNCTIONS_DIR: build/delivery/deploy-tree/functions
          CATCH_FIREBASE_SOURCE_ROOT: build/delivery/source-checkout
        run: |
          set -euo pipefail
          node tool/ci/cat151_receipt_release.mjs verify-params --environment "${{ inputs.environment }}" \
            --params-file build/delivery/deploy-tree/functions/.env.${{ steps.verify.outputs.project_id }} \
            --provenance build/delivery/params-provenance.json --binding build/delivery/cat151-params-binding.json
          git -C build/delivery/source-checkout fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          git -C build/delivery/source-checkout merge-base --is-ancestor "${{ inputs.control_plane_sha }}" refs/remotes/origin/main
          node tool/ci/cat151_receipt_release.mjs source \
            --current-main "$(git -C build/delivery/source-checkout rev-parse refs/remotes/origin/main)" \
            --source-root build/delivery/source-checkout
          ./tool/deploy_firebase_targets.sh --preflight "${{ inputs.environment }}" functions:createRazorpayOrder
          node tool/ci/cat151_receipt_release.mjs verify-before --environment "${{ inputs.environment }}" --before build/delivery/cat151-before.json

      - name: Reject provider setting or secret-version drift before mutation
        run: |
          node tool/ci/cat151_receipt_release.mjs verify-candidate --environment "${{ inputs.environment }}" \
            --candidate build/delivery/secret-bindings.json --before build/delivery/cat151-before.json \
            --params-file build/delivery/deploy-tree/functions/.env.${{ steps.verify.outputs.project_id }}

      - name: Deploy the fixed createRazorpayOrder Function once
        env:
          CATCH_DEPLOY_ALLOW_BEHIND: '1'
          CATCH_DELIVERY_FUNCTIONS_DIR: build/delivery/deploy-tree/functions
          CATCH_FIREBASE_SOURCE_ROOT: build/delivery/source-checkout
        run: |
          set -euo pipefail
          test "$(jq -er '.targets | join(",")' build/delivery/execution-plan.json)" = functions:createRazorpayOrder
          test "$(jq -cer '.stages' build/delivery/execution-plan.json)" = '["functions"]'
          ./tool/firebase_with_env.sh "${{ inputs.environment }}" deploy --only functions:createRazorpayOrder \
            --non-interactive --config build/delivery/deploy-tree/firebase.json

      - name: Verify the selected runtime and every retained resource without repairs
        run: |
          set -euo pipefail
          node tool/firebase/check_deploy_parity.mjs --env "${{ inputs.environment }}" --repo-root build/delivery/source-checkout \
            --targets functions:createRazorpayOrder
          node tool/firebase/check_environment_readiness.mjs --env "${{ inputs.environment }}" --targets functions:createRazorpayOrder \
            --source-root build/delivery/source-checkout --source-sha bbff52defd3c0dfb8df7c78c336c6549af7df47a \
            --phase deployed --candidate build/delivery/secret-bindings.json
          node tool/ci/firebase_functions_checkpoint.mjs record \
            --manifest build/delivery/source/firebase-provenance.json --artifact build/delivery/source/firebase-backend.tar.gz \
            --source-sha bbff52defd3c0dfb8df7c78c336c6549af7df47a --ci-run-id 38931076239 --ci-run-attempt 1 \
            --scope firebase:${{ inputs.environment }}:${{ steps.verify.outputs.project_id }} --checkpoint build/delivery/cat151-selected/checkpoint.json \
            --base-sha 2f3d78db47343a0a363e619ee7dddc9cf8ad1199 --targets functions:createRazorpayOrder \
            --params-file build/delivery/deploy-tree/functions/.env.${{ steps.verify.outputs.project_id }}
          node tool/ci/cat151_receipt_release.mjs complete --environment "${{ inputs.environment }}" --before build/delivery/cat151-before.json \
            --params-file build/delivery/deploy-tree/functions/.env.${{ steps.verify.outputs.project_id }} \
            --params-provenance build/delivery/params-provenance.json --params-binding build/delivery/cat151-params-binding.json \
            --manifest build/delivery/source/firebase-provenance.json --package-plan build/delivery/package-plan.json \
            --deployment build/delivery/cat151-selected/functions-deployment.json \
            --output build/delivery/cat151-completion.json
          for callable in createRazorpayOrder; do
            status="$(curl --silent --show-error --max-time 30 --output build/delivery/probe.json \
              --write-out '%{http_code}' --header 'Content-Type: application/json' --data '{"data":{}}' \
              "https://asia-south1-${{ steps.verify.outputs.project_id }}.cloudfunctions.net/$callable")"
            test "$status" = 401
            jq -e '.error.status == "UNAUTHENTICATED"' build/delivery/probe.json > /dev/null
          done
      - id: cat151-proof
        name: Bind completed environment receipt bytes
        run: echo "receipt_sha256=$(sha256sum build/delivery/cat151-completion.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: cat151-receipt
        name: Retain isolated selected-only outcome and failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: cat151-receipt-selected-only-${{ inputs.environment }}-${{ github.run_id }}-1
          path: |
            build/delivery/cat151-before.json
            build/delivery/cat151-completion.json
            build/delivery/cat151-source-review.json
            build/delivery/cat151-params-binding.json
            build/delivery/cat151-selected/functions-deployment.json
          if-no-files-found: warn
          retention-days: 90
