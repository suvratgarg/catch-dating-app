version: 2
updates:
  # Security fixes stay grouped. Routine version updates are limited to one
  # compatible minor/patch PR per ecosystem; majors require an explicit slice.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/admin"
      - "/website"
      - "/packages/web-ui"
      - "/functions"
      - "/operations"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "05:30"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 1
    groups:
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
      compatible-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "pub"
    directories:
      - "/"
      - "/apps/consumer"
      - "/apps/host"
      - "/packages/catch_ui_lints"
      - "/packages/phosphor_flutter"
      - "/packages/phosphor_flutter/example"
      - "/tool/widget_dedupe"
      - "/widgetbook"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "05:45"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 1
    groups:
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
      compatible-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 1
    groups:
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
      compatible-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
